name: 📐 Spec
description: One slice of a milestone or an accepted Intent. Drafted by Claude, approved by the PO or the tech lead.
title: 'Spec: '
labels: ['type: spec', 'status: draft']
body:
  - type: markdown
    attributes:
      value: |
        A **spec** says what one slice of a milestone or Intent will change, and how we'll know it works. How it's built goes in the plan.
        If it changes what the user sees, set `status: ready-for-po`: the PO reads the **Flagged concerns** first, then approves by setting `status: ready-for-dev`. If it is engineering-only, the tech lead approves by setting `status: ready-for-dev`.
  - type: input
    id: intent
    attributes:
      label: Intent or milestone
      description: The Intent issue or milestone this spec slices, e.g. #12 or M0
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs covered
      description: e.g. MAP-01, MAP-02, NFR-01
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: In plain language, what will change.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour and UX
      description: What the user sees and does, screen by screen or step by step.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Testable Given/When/Then checks. Each one becomes an automated test where possible.
    validations:
      required: true
  - type: textarea
    id: concerns
    attributes:
      label: ⚠️ Flagged concerns
      description: Risks, conflicting requirements, hard-to-reverse choices and decisions the approver must make before build. Write "None" if there are none.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope / carried forward
      description: Open questions from the Intent that this spec does not answer, and where they go next.
