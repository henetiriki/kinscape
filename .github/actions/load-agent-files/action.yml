name: Load agent files
description: >-
  Download a settings file and the given files from .github/agent/ as main has them, and join the
  files into one system prompt. claude-code-review.yml and the run-claude action call this action.

inputs:
  files:
    description: 'The files in .github/agent/ that become the system prompt, space separated, in order.'
    required: true
  settings:
    description: "The file in .github/agent/ that is Claude's settings: settings.json, or review-settings.json for the review. Each caller names its own (a test checks), so none gets another agent's tools. The default is for a branch cut before this input existed."
    default: settings.json
  token:
    description: 'A token that can read the repo.'
    required: true

runs:
  using: composite
  steps:
    # The files come from main, not the checked-out branch: a plan branch cut before a change
    # still gets it, and a branch can't widen its own tools. For the same reason the callers name
    # this action by repo, pinned to a main commit, never a `./` path, which would run the branch's
    # copy (scripts/__tests__/load-agent-files.test.ts checks both).
    - name: Load agent files
      shell: bash
      env:
        AGENT_FILES: ${{ inputs.files }}
        SETTINGS_FILE: ${{ inputs.settings }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/agent"
        # Download the settings file and each file in AGENT_FILES as main has them (the raw file,
        # not JSON). $AGENT_FILES is unquoted so it splits into one name per file. A failed
        # download is tried 3 times, then fails the step.
        for f in "$SETTINGS_FILE" $AGENT_FILES; do
          for attempt in 1 2 3; do
            gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/.github/agent/$f?ref=main" > "$RUNNER_TEMP/agent/$f" 2> "$RUNNER_TEMP/agent.err" && continue 2
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          cat "$RUNNER_TEMP/agent.err" >&2
          exit 1
        done
        # Build system.md: empty it (`:` does nothing, `>` truncates), then append each file in
        # AGENT_FILES order, with a newline after each. That order is the order Claude reads them.
        : > "$RUNNER_TEMP/agent/system.md"
        for f in $AGENT_FILES; do
          { cat "$RUNNER_TEMP/agent/$f"; echo; } >> "$RUNNER_TEMP/agent/system.md"
        done
        # Show what Claude is told: a collapsed group in the log and a section on the run page.
        # The files come from main and hold no secrets.
        echo "::group::System prompt ($AGENT_FILES)"
        cat "$RUNNER_TEMP/agent/system.md"
        echo "::endgroup::"
        {
          echo "<details><summary>System prompt ($AGENT_FILES)</summary>"
          echo
          cat "$RUNNER_TEMP/agent/system.md"
          echo
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
