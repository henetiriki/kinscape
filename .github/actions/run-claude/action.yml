name: Run Claude
description: >-
  Load the agent files, run Claude Code with them, and keep its output. The steps of every run in
  claude-run.yml, which claude-respond.yml also calls.

inputs:
  files:
    description: 'The files in .github/agent/ that become the system prompt, space separated, in order.'
    required: true
  model_args:
    description: 'Claude CLI model flags, e.g. "--model sonnet".'
    required: true
  prompt:
    description: 'What Claude is asked to do. Empty keeps tag mode, where the triggering comment is the prompt.'
    default: ''
  additional_permissions:
    description: "GitHub permissions claude-code-action requests beyond its defaults, e.g. 'actions: read'."
    default: ''
  claude_code_oauth_token:
    description: "Claude's OAuth token."
    required: true
  github_token:
    description: "The bot's token, which claude-code-action uses to read and write the repo."
    required: true
  bot_login:
    description: "The App's bot login, from vars.KINSCAPE_BOT_LOGIN."
    required: true
  bot_id:
    description: "The App's bot numeric id, from vars.KINSCAPE_BOT_ID."
    required: true
  team_logins:
    description: 'The logins whose comments Claude reads, comma separated, from vars.KINSCAPE_TEAM_LOGINS.'
    required: true
  main_files:
    description: "Repo files Claude reads as main has them, space separated: each is copied over the checkout's. Empty leaves the checkout's files as they are."
    default: ''

runs:
  using: composite
  steps:
    # An input given as an empty string replaces claude-code-action's default bot, so a run before
    # setup-github.sh has set the variables would commit with no name, and an empty team would
    # leave Claude only its own comments. Stop with the reason instead.
    - name: Check the repo variables
      shell: bash
      env:
        BOT_LOGIN: ${{ inputs.bot_login }}
        BOT_ID: ${{ inputs.bot_id }}
        TEAM_LOGINS: ${{ inputs.team_logins }}
      run: |
        if [ -z "$BOT_LOGIN" ] || [ -z "$BOT_ID" ] || [ -z "$TEAM_LOGINS" ]; then
          echo '::error::The repo variables KINSCAPE_BOT_LOGIN, KINSCAPE_BOT_ID and KINSCAPE_TEAM_LOGINS are not set. Run scripts/setup-github.sh.'
          exit 1
        fi

    # From main, not this branch (see load-agent-files). settings.json is the build agent's tools.
    - name: Load the agent files
      uses: henetiriki/kinscape/.github/actions/load-agent-files@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
      with:
        files: ${{ inputs.files }}
        settings: settings.json
        main_files: ${{ inputs.main_files }}
        token: ${{ inputs.github_token }}

    # Claude reads these files from the checkout, which is the PR branch. The log shows an M for each
    # copy that differs from the branch. --skip-worktree keeps `git add -A` from committing the copies;
    # resolve-conflict.md clears the marks before the merge of main, which they would stop.
    - name: Put main's rule files in the checkout
      if: inputs.main_files != ''
      shell: bash
      env:
        MAIN_FILES: ${{ inputs.main_files }}
      run: |
        for f in $MAIN_FILES; do
          cp "$RUNNER_TEMP/agent/main/$f" "$f"
        done
        git status --short -- $MAIN_FILES
        git update-index --skip-worktree -- $MAIN_FILES

    - name: Run Claude Code
      uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        bot_name: ${{ inputs.bot_login }}
        bot_id: ${{ inputs.bot_id }}
        prompt: ${{ inputs.prompt }}
        additional_permissions: ${{ inputs.additional_permissions }}
        # Only the team's comments, reviews and review comments reach the prompt (the triggering
        # comment always does): the write collaborators, the bot for its own earlier replies, and
        # github-actions for the review's findings (claude-code-review.yml posts with the
        # workflow's token). Exact logins; the action adds "[bot]" to an App's.
        include_comments_by_actor: ${{ inputs.team_logins }},${{ inputs.bot_login }},github-actions[bot]
        # Both off: the full output includes every screenshot Claude reads, as base64, and the log
        # stopped at the first of them; the report would put Claude's own text on the public run
        # page. The summary job writes the run page from the summary uploaded below.
        display_report: false
        show_full_output: false
        # Tools, denials and the Bash timeout are in settings.json; the rules are in the system prompt.
        settings: ${{ runner.temp }}/agent/settings.json
        claude_args: '${{ inputs.model_args }} --append-system-prompt-file ${{ runner.temp }}/agent/system.md'

    # The summary, secret scan and upload of Claude's transcript, from a pinned main commit.
    - name: Keep Claude's output
      if: always()
      uses: henetiriki/kinscape/.github/actions/keep-claude-output@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
      with:
        thread: ${{ github.event.issue.number || github.event.pull_request.number }}
        # The callers install Node in setup-workspace; keep that one.
        setup_node: 'false'
