name: Run Claude
description: >-
  Load the agent files, run Claude Code with them, and keep its output. The steps claude.yml and
  claude-run.yml share.

inputs:
  files:
    description: 'The files in .github/agent/ that become the system prompt, space separated, in order.'
    required: true
  model_args:
    description: 'Claude CLI model flags, e.g. "--model sonnet".'
    required: true
  prompt:
    description: 'What Claude is asked to do. Empty keeps tag mode, where the triggering comment is the prompt.'
    default: ''
  additional_permissions:
    description: "GitHub permissions claude-code-action requests beyond its defaults, e.g. 'actions: read'."
    default: ''
  claude_code_oauth_token:
    description: "Claude's OAuth token."
    required: true
  github_token:
    description: "The bot's token, which claude-code-action uses to read and write the repo."
    required: true

runs:
  using: composite
  steps:
    # From main, not this branch (see load-agent-files). settings.json is the build agent's tools.
    - name: Load agent files
      uses: henetiriki/kinscape/.github/actions/load-agent-files@dceb6771c35cb12c93ef65d1403199f3b741f9ce
      with:
        files: ${{ inputs.files }}
        settings: settings.json
        token: ${{ inputs.github_token }}

    - name: Run Claude Code
      uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        bot_name: henetiriki-bot
        bot_id: '344434370'
        prompt: ${{ inputs.prompt }}
        additional_permissions: ${{ inputs.additional_permissions }}
        # Off: the full output includes every screenshot Claude reads, as base64, and the log
        # stopped at the first of them. The summary job writes the run page from the summary
        # uploaded below.
        show_full_output: false
        # Tools, denials and the Bash timeout are in settings.json; the rules are in the system prompt.
        settings: ${{ runner.temp }}/agent/settings.json
        claude_args: '${{ inputs.model_args }} --append-system-prompt-file ${{ runner.temp }}/agent/system.md'

    # Claude's transcript holds every tool result, so any token a command printed. Only its summary
    # is uploaded, written by the script from main into a folder cleared first. The summary steps
    # never fail the job: with no summary, nothing is uploaded. Node is the caller's, from
    # setup-workspace. Guards against an accidental leak; a run's own steps could still defeat it.
    - name: Clear the summary script folder
      if: always()
      continue-on-error: true
      shell: bash
      run: rm -rf .claude-summary-script
    - name: Check out the summary script
      if: always()
      continue-on-error: true
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        path: .claude-summary-script
        sparse-checkout: scripts
        persist-credentials: false
    - name: Summarise Claude's output
      if: always()
      continue-on-error: true
      shell: bash
      run: node .claude-summary-script/scripts/agent-transcript.mts "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/claude-summary/claude-execution-output.json"

    # Claude's final message or a denied command can still hold a secret. Only a clean scan uploads
    # the copy it scanned; a hit or a failed scan comments on the thread instead (scan-summary.sh).
    # github.token comments, as claude-run.yml's safety net counts only the bot's comments.
    - name: Scan the summary for secrets
      id: scan
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        THREAD: ${{ github.event.issue.number || github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash .claude-summary-script/scripts/scan-summary.sh

    - name: Upload Claude's output
      if: always() && steps.scan.outputs.clean == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: claude-execution-output
        path: ${{ runner.temp }}/gitleaks/scan/claude-execution-output.json
        retention-days: 7
