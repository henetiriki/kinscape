name: Run Claude
description: >-
  Load the agent files, run Claude Code with them, and keep its output. The steps claude-respond.yml and
  claude-run.yml share.

inputs:
  files:
    description: 'The files in .github/agent/ that become the system prompt, space separated, in order.'
    required: true
  model_args:
    description: 'Claude CLI model flags, e.g. "--model sonnet".'
    required: true
  prompt:
    description: 'What Claude is asked to do. Empty keeps tag mode, where the triggering comment is the prompt.'
    default: ''
  additional_permissions:
    description: "GitHub permissions claude-code-action requests beyond its defaults, e.g. 'actions: read'."
    default: ''
  claude_code_oauth_token:
    description: "Claude's OAuth token."
    required: true
  github_token:
    description: "The bot's token, which claude-code-action uses to read and write the repo."
    required: true
  bot_login:
    description: "The bot account's login, from vars.KINSCAPE_BOT_LOGIN."
    required: true
  bot_id:
    description: "The bot account's numeric id, from vars.KINSCAPE_BOT_ID."
    required: true

runs:
  using: composite
  steps:
    # An input given as an empty string replaces claude-code-action's default bot, so a run before
    # setup-github.sh has set the variables would commit with no name. Stop with the reason instead.
    - name: Check the bot variables
      shell: bash
      env:
        BOT_LOGIN: ${{ inputs.bot_login }}
        BOT_ID: ${{ inputs.bot_id }}
      run: |
        if [ -z "$BOT_LOGIN" ] || [ -z "$BOT_ID" ]; then
          echo '::error::The repo variables KINSCAPE_BOT_LOGIN and KINSCAPE_BOT_ID are not set. Run scripts/setup-github.sh.'
          exit 1
        fi

    # From main, not this branch (see load-agent-files). settings.json is the build agent's tools.
    - name: Load agent files
      uses: henetiriki/kinscape/.github/actions/load-agent-files@48a0be9d9003af15eb5eef513e79fa73715c4210
      with:
        files: ${{ inputs.files }}
        settings: settings.json
        token: ${{ inputs.github_token }}

    - name: Run Claude Code
      uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        bot_name: ${{ inputs.bot_login }}
        bot_id: ${{ inputs.bot_id }}
        prompt: ${{ inputs.prompt }}
        additional_permissions: ${{ inputs.additional_permissions }}
        # Off: the full output includes every screenshot Claude reads, as base64, and the log
        # stopped at the first of them. The summary job writes the run page from the summary
        # uploaded below.
        show_full_output: false
        # Tools, denials and the Bash timeout are in settings.json; the rules are in the system prompt.
        settings: ${{ runner.temp }}/agent/settings.json
        claude_args: '${{ inputs.model_args }} --append-system-prompt-file ${{ runner.temp }}/agent/system.md'

    # The summary, secret scan and upload of Claude's transcript, from a pinned main commit.
    - name: Keep Claude's output
      if: always()
      uses: henetiriki/kinscape/.github/actions/keep-claude-output@aa2dab4d1b31c84068caa7ba123ea4b68e7be8d2
      with:
        thread: ${{ github.event.issue.number || github.event.pull_request.number }}
        # The callers set up Node in setup-workspace; keep that one.
        setup_node: 'false'
