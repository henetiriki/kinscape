name: Run summary
description: >-
  Write the run page's result section from Claude's transcript (scripts/run-summary.mts, from
  main). claude.yml, claude-run.yml and claude-code-review.yml call this action in a job of their
  own, which has no secrets and never fails the run.

runs:
  using: composite
  steps:
    # The script comes from main, so the checked-out branch can't change it. Callers name this
    # action by repo and `@main`, for the same reason (scripts/__tests__/load-agent-files.test.ts).
    - name: Check out the summary script
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        sparse-checkout: |
          scripts
          .nvmrc
        persist-credentials: false
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    # The artifact is missing if the run stopped before Claude started; the script says so.
    - name: Download Claude's output
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: claude-execution-output
        path: ${{ runner.temp }}/claude-output
    - name: Write the summary
      continue-on-error: true
      shell: bash
      run: node scripts/run-summary.mts "$RUNNER_TEMP/claude-output/claude-execution-output.json"
