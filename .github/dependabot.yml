version: 2
# One PR moves @playwright/test and the Playwright image: see "The Playwright image" in docs/dependencies.md.
multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
updates:
  # Two npm entries: an entry in a multi-ecosystem group drops its own groups, schedule and commit-message.
  # The first entry holds only @playwright/test, so the playwright PR moves it with the image.
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    multi-ecosystem-group: playwright
    patterns:
      - '@playwright/test'
  # The second entry keeps the other npm groups and ignores @playwright/test.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
    # Held majors: see "Held packages" in docs/dependencies.md.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: '@playwright/test'
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      maplibre:
        patterns:
          - maplibre-gl
          - '@maplibre/maplibre-gl-style-spec'
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /docker/playwright
    multi-ecosystem-group: playwright
    patterns:
      - '*'
  # Dependabot keeps the major version: see "Held packages" in docs/dependencies.md.
  - package-ecosystem: docker
    directory: /docker/postgres
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
