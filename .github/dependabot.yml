version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: chore
    # Held majors: see "Held packages" in docs/dependencies.md.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      maplibre:
        patterns:
          - maplibre-gl
          - '@maplibre/maplibre-gl-style-spec'
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
  # The Playwright image version must match @playwright/test: see "The Playwright image" in docs/dependencies.md.
  - package-ecosystem: docker
    directory: /docker/playwright
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
  # Dependabot keeps the major version: see "Held packages" in docs/dependencies.md.
  - package-ecosystem: docker
    directory: /docker/postgres
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
