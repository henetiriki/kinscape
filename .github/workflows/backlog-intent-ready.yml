name: 'Backlog: Intent ready for PO'

# In plain English: when a Spec is closed, check whether that was the last open Spec of its
# Intent. If so, hand the Intent to the PO to confirm the outcome and close it.
#
# The title shown for each run in the Actions tab: "Check Intent: <title>" for a Spec,
# "Skipped: <title>" for any other issue. Repeats the job's `if:` (run-name cannot see job
# results): change them together.
run-name: >-
  ${{
    contains(github.event.issue.labels.*.name, 'type: spec') &&
    format('Check Intent: {0}', github.event.issue.title) ||
    format('Skipped: {0}', github.event.issue.title)
  }}

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  # Only closed Specs matter here; every other closed issue is ignored.
  flag-intent:
    if: "contains(github.event.issue.labels.*.name, 'type: spec')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;

            // 1. Find the Intent this Spec belongs to (its "parent" issue).
            let parent;
            try {
              ({ data: parent } = await github.request(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/parent',
                { owner, repo, issue_number: number },
              ));
            } catch (error) {
              if (error.status === 404) return; // a Spec with no parent Intent
              throw error;
            }

            // 2. Stop quietly unless all of these hold: the parent is still open, it really is
            //    an Intent, it isn't already marked ready for the PO, and every one of its
            //    Specs is now closed.
            const labels = parent.labels.map((label) => label.name);
            const { total, completed } = parent.sub_issues_summary;
            if (
              parent.state !== 'open' ||
              !labels.includes('type: intent') ||
              labels.includes('status: ready-for-po') ||
              completed < total
            ) {
              return;
            }

            // 3. Take off the Intent's old status label(s), then mark it "ready-for-po".
            for (const name of labels.filter((l) => l.startsWith('status: '))) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: parent.number,
                name,
              });
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: parent.number,
              labels: ['status: ready-for-po'],
            });
            // 4. Tell the PO what to do next.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parent.number,
              body: 'Every Spec of this Intent is closed. PO: check the outcome is met, then close this Intent, or file another Spec if something is missing.',
            });
