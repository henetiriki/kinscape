name: 'Backlog: Flag Intent for PO'

# When a Spec is closed, check whether that was the last open Spec of its
# Intent. If so, hand the Intent to the PO to confirm the outcome and close it.
#
# The title shown for each run in the Actions tab: "Check Intent: <title>" for a Spec filed by
# the owner, a member, a collaborator or the agent App, "Skipped Check Intent: <title>" for any other
# issue. Repeats the job's `if:` (run-name cannot see job results): change them together.
# The event may not carry `issue.type`. An issue with no Type in the event passes both conditions.
# The script then reads the Type from the API. `scripts/__tests__/issue-type-gates.test.ts` fails
# if a condition tests the Type with no such guard.
run-name: >-
  ${{
    (!github.event.issue.type || github.event.issue.type.name == 'Spec') &&
    (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      github.event.issue.user.login == vars.KINSCAPE_BOT_LOGIN) &&
    format('Check Intent: {0}', github.event.issue.title) ||
    format('Skipped Check Intent: {0}', github.event.issue.title)
  }}

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  # Only closed Specs matter here; every other closed issue is ignored.
  flag-intent:
    if: >-
      (!github.event.issue.type || github.event.issue.type.name == 'Spec') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        github.event.issue.user.login == vars.KINSCAPE_BOT_LOGIN)
    runs-on: ubuntu-latest
    steps:
      - name: Flag the Intent for the PO
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Without this header GitHub serves 2022-11-28, which it sunsets on 2028-03-10.
            github.hook.before('request', (o) => {
              o.headers['x-github-api-version'] = '2026-03-10';
            });
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;

            // 0. The event may not carry the Type, so read the issue as it is now.
            const { data: current } = await github.rest.issues.get({
              owner,
              repo,
              issue_number: number,
            });
            if (current.type?.name !== 'Spec') return;

            // 1. Find the Intent this Spec belongs to (its "parent" issue).
            let parent;
            try {
              ({ data: parent } = await github.request(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/parent',
                { owner, repo, issue_number: number },
              ));
            } catch (error) {
              if (error.status === 404) return; // a Spec with no parent Intent
              throw error;
            }

            // 2. Stop quietly unless all of these hold: the parent is still open, it really is
            //    an Intent, it isn't already marked ready for the PO, and every one of its
            //    Specs is now closed.
            const labels = parent.labels.map((label) => label.name);
            const { total, completed } = parent.sub_issues_summary;
            if (
              parent.state !== 'open' ||
              parent.type?.name !== 'Intent' ||
              labels.includes('status: ready-for-po') ||
              completed < total
            ) {
              return;
            }

            // 3. Take off the Intent's old status label(s), then mark it "ready-for-po".
            for (const name of labels.filter((l) => l.startsWith('status: '))) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: parent.number,
                name,
              });
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: parent.number,
              labels: ['status: ready-for-po'],
            });
            // 4. Tell the PO what to do next.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: parent.number,
              body: 'Every Spec of this Intent is closed. PO: check the outcome is met, then close this Intent, or file another Spec if something is missing.',
            });
