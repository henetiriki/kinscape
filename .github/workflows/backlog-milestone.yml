name: 'Backlog: Inherit milestone'

# A Spec takes its parent Intent's milestone; a PR takes the milestone of the Spec or Bug it closes.
# Only empty milestones are filled. A manual run does this for every Spec, then every PR.

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

# One run per issue or PR at a time; a run for another one never replaces it while it waits.
concurrency:
  group: backlog-milestone-${{ github.event.issue.number || github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  inherit:
    # New or edited issues: Specs by the owner, a member or a collaborator only. Fork PRs are
    # skipped: their token cannot write.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'type: spec') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Copy milestones
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3 # a transient 5xx would otherwise end a backfill; each write sets one value, so a repeat is harmless
          script: |
            // Without this header GitHub serves 2022-11-28, which it sunsets on 2028-03-10.
            github.hook.before('request', (o) => {
              o.headers['x-github-api-version'] = '2026-03-10';
            });
            const { owner, repo } = context.repo;
            const hasLabel = (issue, name) => issue.labels.some((l) => (l.name ?? l) === name);
            const all = (route, params) =>
              github.paginate(route, { owner, repo, state: 'all', per_page: 100, ...params });

            // An issue by number, or undefined with a warning when it does not exist.
            async function getIssue(number, from) {
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
                return data;
              } catch (error) {
                if (error.status !== 404) throw error;
                core.warning(`#${from}: #${number} not found`);
              }
            }

            // The milestone number a Spec should have: its parent Intent's, else the form answer.
            let milestones;
            async function specMilestone(spec) {
              try {
                const { data: parent } = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/parent',
                  { owner, repo, issue_number: spec.number },
                );
                if (parent.milestone) return parent.milestone.number;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const field = /### Intent or milestone\s+(.*)/.exec(spec.body ?? '');
              const value = field ? field[1].trim() : '';
              if (/^M\d+$/.test(value)) {
                milestones ??= await all(github.rest.issues.listMilestones);
                const found = milestones.find(
                  (m) => m.title === value || m.title.startsWith(`${value} `),
                );
                if (!found) core.warning(`#${spec.number}: no milestone is titled ${value}`);
                return found?.number;
              }
              const match = /^#?(\d+)$/.exec(value);
              if (!match) {
                core.warning(`#${spec.number}: no parent Intent, and the form answer names none`);
                return undefined;
              }
              const intent = await getIssue(Number(match[1]), spec.number);
              if (!intent) return undefined;
              if (intent.pull_request || !hasLabel(intent, 'type: intent')) {
                core.warning(`#${spec.number}: #${intent.number} is not an Intent`);
                return undefined;
              }
              return intent.milestone?.number;
            }

            async function fill(issue, milestone) {
              if (issue.milestone || !milestone) return;
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                milestone,
              });
              core.info(`#${issue.number}: milestone ${milestone}`);
            }

            // The milestone a PR should have: the first Spec or Bug it closes that has one.
            const closing = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi;
            async function prMilestone(pr) {
              for (const [, n] of (pr.body ?? '').matchAll(closing)) {
                const issue = await getIssue(Number(n), pr.number);
                if (
                  issue &&
                  !issue.pull_request &&
                  (hasLabel(issue, 'type: spec') || hasLabel(issue, 'type: bug')) &&
                  issue.milestone
                ) {
                  return issue.milestone.number;
                }
              }
            }

            if (context.eventName === 'issues') {
              const spec = context.payload.issue;
              await fill(spec, await specMilestone(spec));
            } else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              await fill(pr, await prMilestone(pr));
            } else {
              const specs = await all(github.rest.issues.listForRepo, { labels: 'type: spec' });
              for (const spec of specs.filter((s) => !s.pull_request)) {
                await fill(spec, await specMilestone(spec));
              }
              for (const pr of await all(github.rest.pulls.list)) {
                await fill(pr, await prMilestone(pr));
              }
            }
