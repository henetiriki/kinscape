name: 'Backlog: Link Spec to Intent'

# When a new Spec is filed, attach it to the Intent it slices, using the
# "Intent or milestone" answer on the issue form. If that can't be done, leave a comment.
#
# The title shown for each run in the Actions tab: "Link: <title>" for a Spec, "Skipped:
# <title>" for any other issue. Repeats the job's `if:` (run-name cannot see job results):
# change them together.
run-name: >-
  ${{
    contains(github.event.issue.labels.*.name, 'type: spec') &&
    format('Link: {0}', github.event.issue.title) ||
    format('Skipped: {0}', github.event.issue.title)
  }}

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  # Only new Specs matter here; every other new issue is ignored.
  link-spec:
    if: "contains(github.event.issue.labels.*.name, 'type: spec')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number, id, body } = context.payload.issue;

            // 1. Already attached to an Intent? Then there is nothing to do.
            try {
              await github.request(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/parent',
                { owner, repo, issue_number: number },
              );
              return; // already linked
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // 2. Read the "Intent or milestone" answer from the issue form. A milestone such
            //    as "M2" needs no link, because milestone Specs have no parent issue.
            const field = /### Intent or milestone\s+(.*)/.exec(body ?? '');
            const value = field ? field[1].trim() : '';
            if (/^M\d+$/.test(value)) return; // a milestone Spec has no parent issue

            // 3. Otherwise the answer should be an issue number such as "42" or "#42". Look
            //    that issue up and, if it is an open Intent, attach this Spec to it.
            const match = /^#?(\d+)$/.exec(value);
            let linked = false;
            if (match) {
              try {
                const { data: intent } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: Number(match[1]),
                });
                if (
                  intent.state === 'open' &&
                  !intent.pull_request &&
                  intent.labels.some((label) => label.name === 'type: intent')
                ) {
                  await github.request(
                    'POST /repos/{owner}/{repo}/issues/{issue_number}/sub_issues',
                    { owner, repo, issue_number: intent.number, sub_issue_id: id },
                  );
                  linked = true;
                }
              } catch (error) {
                core.warning(`Could not link Spec #${number}: ${error.message}`);
              }
            }

            // 4. If no link was made (blank answer, not an issue number, not an open Intent),
            //    ask the author to link it by hand.
            if (!linked) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: `Couldn't link this Spec to an Intent from "Intent or milestone" (\`${value}\`). If it slices an Intent, add it as a sub-issue of that Intent.`,
              });
            }
