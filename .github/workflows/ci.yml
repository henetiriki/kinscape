name: CI

# The title shown for each run in the Actions tab: "CI: <PR title>" for a pull request, "CI: main"
# for a push. Only the jobs have an `if:` (`format` and `words` run on every run), so there is no
# "Skipped" form.
run-name: 'CI: ${{ github.event.pull_request.title || github.ref_name }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# setup-node caches the directory `npm config get cache` prints, and the cache version is a hash of
# that path. The Playwright container's home differs from the runner's, so by default each lockfile
# gets two ~190 MB entries. One literal path gives one (scripts/__tests__/npm-cache-path.test.ts).
env:
  npm_config_cache: /tmp/npm-cache

# One group per PR, so a new push cancels the PR's older run. Each run on main gets its own group, so it always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The automated checks that every change must pass.
# Drafts are mostly plan PRs: only format and words run on them. Every job runs on a push to main.
jobs:
  # Checks the code for mistakes and style problems.
  lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      - name: Lint the code
        run: npm run lint

  # Checks the types, so a type error fails here and not late in e2e's build.
  typecheck:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      - name: Check the types
        run: npm run typecheck

  # Checks that files are laid out consistently.
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      - name: Check the format
        run: npm run format:check

  # Runs the automated tests and keeps the coverage report for the coverage job (even if a test failed).
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      # The contract suites run on this Postgres as well as on PGlite (scripts/ci-postgres.sh).
      - name: Start Postgres
        run: scripts/ci-postgres.sh test
      - name: Run the tests
        run: npm test
      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/lcov.info

  # Sends the test job's coverage report to Codecov, which trusts the job's own OIDC token: no
  # stored secret. Its own job, so the permission to mint that token is held where no project
  # script runs. Runs even if a test failed, so Codecov still reports.
  coverage:
    needs: test
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Send the coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: coverage/lcov.info
          use_oidc: true

  # Checks the historical boundary data files are valid.
  boundaries:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      - name: Validate the boundaries
        run: npm run validate:boundaries

  # Checks that docs and plans stay within their word limits.
  words:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the word counts
        run: npm run words

  # Reads the Playwright image from its one home. A job's container can't read a file, so this passes it on.
  image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the Playwright image
        id: pin
        run: echo "image=$(cat .github/playwright-image)" >> "$GITHUB_OUTPUT"

  # Opens the app in a real browser and clicks through it, as a user would. It runs on the runner,
  # not in the Playwright image: the Postgres script needs Docker, which the image lacks. It signs in
  # with the memory sign-in and reads and writes the Postgres of scripts/ci-postgres.sh.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      # The same key and path as setup-workspace and ci-playwright-cache.yml, which seeds main's cache.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright
      # The cache holds the browser, not the system packages it needs, so these install on every run.
      - name: Install the browser
        run: npm run e2e:install -- --with-deps
      - name: Start Postgres
        run: scripts/ci-postgres.sh e2e
      - name: Migrate the database
        run: npm run db:migrate
      - name: Seed the synthetic Account and Tree
        run: node scripts/seed-ci.mts
      # Keep Next.js's build cache. A source change still restores the last build for the same lockfile.
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'features/**', 'lib/**', 'server/**', 'data/**', 'types/**', 'design/tokens.*', 'next.config.ts', 'instrumentation.ts', 'proxy.ts') }}
          path: .next/cache
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      # The design job runs the design check, so this run drops that project (playwright.config.ts).
      - name: Run the end-to-end tests
        run: npm run e2e
        env:
          E2E_SPLIT: '1'
          KINSCAPE_MEMORY_SIGN_IN: '1'

  # Compares each built screen with its design snapshot, in parallel with e2e.
  design:
    needs: image
    runs-on: ubuntu-latest
    # The same image as e2e: the snapshot export and the design check both launch Chromium.
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user 1001
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the dependencies
        run: npm ci
      # Fails, naming the file, when a design/source snapshot differs from its design/canvas artboard.
      - name: Check that the HTML snapshots match the canvas
        run: npm run design:export && node scripts/design-shots-ci.mts source
      # Only restores the cache that the e2e job saves, so the two jobs do not save one key. The key is
      # the e2e job's restore-keys prefix, as in setup-workspace.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
          path: .next/cache
      - name: Run the design check
        run: npm run design:check
      - name: Upload the design-check results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: design-check
          path: test-results/design
          if-no-files-found: ignore
