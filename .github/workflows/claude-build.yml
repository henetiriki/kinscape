name: 'Claude: Build'

# The title shown for each run in the Actions tab:
#   "Build: <title>"         - the tech lead approved a draft plan PR, so the approval is recorded and Claude builds it
#                              (`approve` records a `hand-back` PR whose plan has no row that CI can build and comments on the PR, but Claude does not build it; the title is the same)
#   "Skipped Build: <title>" - anything else, so nothing runs
# This repeats the `if:` of the `approve` job (run-name cannot see job results): change them together.
run-name: >-
  ${{
    github.event.review.state == 'approved' &&
    github.event.review.author_association == 'OWNER' &&
    github.event.pull_request.draft &&
    github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
    endsWith(github.event.pull_request.title, '(plan)') &&
    format('Build: {0}', github.event.pull_request.title) ||
    format('Skipped Build: {0}', github.event.pull_request.title)
  }}

# The tech lead's approving review on a draft plan PR starts the build (plans/README.md). Plans are
# drafted by claude-plan.yml; `@claude` comments on the plan PR are handled by claude-respond.yml.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# A second review on the same PR waits for the run in progress, gate included, so its gate then
# reads the PR as that run left it. The reviewer and the review state are in the key so that a
# comment or a bot's review can't displace a waiting approval. A run still queued behind a newer
# one is dropped; they are the same.
concurrency:
  group: build-${{ github.event.pull_request.number }}-${{ github.event.review.user.login }}-${{ github.event.review.state }}
  cancel-in-progress: false

jobs:
  # Runs when the repo owner approves a review on a draft plan PR that Claude's bot opened. The bot
  # opens its other PRs too: only a draft whose title ends "(plan)" is a plan PR
  # (plans/README.md#plan-pr-flow; the build drops the suffix). It records the approval and the
  # owner's answers to the plan's decisions in the plan and commits it to the PR branch
  # (scripts/agent-approve.mts), before any model runs. With a decision open it comments which and
  # the workflow skips `build`. A `hand-back` PR (plans/README.md#hand-back) whose plan has no row
  # that is not a hand-back path gets a comment that the tech lead builds it, and the workflow skips
  # `build`. It also sets the issue's status label from the outcome (`ready-for-agent` on go,
  # `ready-for-dev` on stop). On a stop it does not change the issue of a `hand-back` PR. The
  # review approved one commit: a PR whose head has moved since stops too, and `head` names the
  # commit the build must fetch. The script comes from main and the PR head is never fetched: it
  # reads and writes the plan through the API.
  approve:
    name: Approve
    if: |
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
      endsWith(github.event.pull_request.title, '(plan)')
    # One run per thread at a time, shared with claude-respond.yml and the build's `run`, so an
    # approval never overlaps a revision of the plan.
    concurrency: thread-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only to fetch main; the bot's App token comments and commits (as claude-run.yml does).
    permissions:
      contents: read
    outputs:
      go: ${{ steps.approve.outputs.go }}
      head: ${{ steps.approve.outputs.head }}
    steps:
      # It uses only Node's own modules, so no `npm ci`.
      - name: Fetch the approval script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The App token, not GITHUB_TOKEN: a push by GITHUB_TOKEN would start no workflow, so CI would not run on it.
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Record the approval
        id: approve
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APPROVER: ${{ github.event.review.user.login }}
          COMMIT: ${{ github.event.review.commit_id }}
          NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/agent-approve.mts "$NUMBER"

  # Claude builds what the approved plan describes and comments on the PR with the result. The
  # `approve` job already checked that this is a draft plan PR the owner approved. The shared runner
  # checks the Spec isn't blocked. It comes from main, like the agent files.
  build:
    # The Actions graph shows the runner's jobs under this name: "Build / Gate", "Build / Run Claude", "Build / Result".
    name: Build
    needs: approve
    if: needs.approve.outputs.go == 'true'
    uses: henetiriki/kinscape/.github/workflows/claude-run.yml@9afe70cc851a22ca7826b0f3417c5a97cf16665a
    with:
      thread: ${{ github.event.pull_request.number }}
      # Fetch the plan PR's branch, at the commit the approval recorded.
      ref: ${{ github.event.pull_request.head.ref }}
      head: ${{ needs.approve.outputs.head }}
      playwright: true
      model_args: --model sonnet
      # The files in .github/agent/ that become the system prompt. The order matters:
      # rules.md first, build.md last (scripts/__tests__/load-agent-files.test.ts checks it).
      agent_files: rules.md build.md
      # Claude reads these from the checkout, which is the PR branch: put main's copies there
      # (scripts/__tests__/load-agent-files.test.ts checks the list). The reword step of build.md
      # reads spec-checks.md, and no prompt of a build holds that file. AGENTS.md is not in the
      # list: claude-code-action restores it from main, and the SessionStart hook in
      # .github/agent/settings.json keeps that copy out of the index.
      main_files: docs/security.md docs/writing.md docs/code-rules.md docs/code-rules/pattern-table.md docs/code-rules/scale.md docs/code-rules/test-quality.md docs/patterns/auth.md docs/patterns/ci-images.md docs/patterns/components.md docs/patterns/data.md docs/patterns/dev-screens.md docs/patterns/domain.md docs/patterns/map.md docs/patterns/tree-data.md .github/agent/spec-checks.md
      prompt: >-
        @${{ github.event.review.user.login }} approved the plan on PR #${{ github.event.pull_request.number }}.
        Build it: follow "Build a plan PR" in your instructions. The approver is ${{ github.event.review.user.login }}.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KINSCAPE_APP_PRIVATE_KEY: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
