name: 'Claude: Build'

# The title shown for each run in the Actions tab:
#   "Build: <title>"         - the tech lead approved a draft plan PR, so the approval is recorded and Claude builds it
#                              (a `hand-back` PR is recorded and commented on, but not built; the title is the same)
#   "Skipped Build: <title>" - anything else, so nothing runs
# This repeats the `if:` of the `approve` job (run-name cannot see job results): change them together.
run-name: >-
  ${{
    github.event.review.state == 'approved' &&
    github.event.review.author_association == 'OWNER' &&
    github.event.pull_request.draft &&
    github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
    endsWith(github.event.pull_request.title, '(plan)') &&
    format('Build: {0}', github.event.pull_request.title) ||
    format('Skipped Build: {0}', github.event.pull_request.title)
  }}

# The tech lead's approving review on a draft plan PR starts the build (plans/README.md). Plans are
# drafted by claude-plan.yml; `@claude` comments on the plan PR are handled by claude-respond.yml.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# A second review on the same PR waits for the run in progress, gate included, so its gate then
# reads the PR as that run left it. The reviewer and the review state are in the key so that a
# comment or a bot's review can't displace a waiting approval. A run still queued behind a newer
# one is dropped; they are the same.
concurrency:
  group: build-${{ github.event.pull_request.number }}-${{ github.event.review.user.login }}-${{ github.event.review.state }}
  cancel-in-progress: false

jobs:
  # Runs when the repo owner approves a review on a draft plan PR that Claude's bot opened. The bot
  # opens its other PRs too: only a draft whose title ends "(plan)" is a plan PR (plans/README.md
  # rule 3; the build drops the suffix). It records the approval and the owner's answers to the
  # plan's decisions in the plan and commits it to the PR branch (scripts/agent-approve.mts), before
  # any model runs. With a decision open it comments which and `build` is skipped; a `hand-back`
  # PR (plans/README.md rule 4) gets a comment that the tech lead builds it, and `build` is
  # skipped. It also sets the issue's status label from the outcome (`ready-for-agent` on go,
  # `ready-for-dev` on stop; a `hand-back` PR's issue is left alone). The
  # script comes from main and the PR head is never checked out: it reads and writes the plan
  # through the API.
  approve:
    name: Approve
    if: |
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
      endsWith(github.event.pull_request.title, '(plan)')
    # One run per thread at a time, shared with claude-respond.yml and the build's `run`, so an
    # approval never overlaps a revision of the plan.
    concurrency: thread-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only to check out main; the bot's App token comments and commits (as claude-run.yml does).
    permissions:
      contents: read
    outputs:
      go: ${{ steps.approve.outputs.go }}
    steps:
      # It uses only Node's own modules, so no `npm ci`.
      - name: Check out the approval script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The App token, not GITHUB_TOKEN: a push by GITHUB_TOKEN would start no workflow, so CI would not run on it.
      - name: Mint the bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Record the approval
        id: approve
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APPROVER: ${{ github.event.review.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/agent-approve.mts "$NUMBER"

  # Claude builds what the approved plan describes and comments on the PR with the result. The
  # `approve` job already checked that this is a draft plan PR the owner approved. The shared runner
  # checks the Spec isn't blocked. It comes from main, like the agent files.
  build:
    # The Actions graph shows the runner's jobs under this name: "Build / Gate", "Build / Run Claude", "Build / Result".
    name: Build
    needs: approve
    if: needs.approve.outputs.go == 'true'
    uses: henetiriki/kinscape/.github/workflows/claude-run.yml@00b1ba240a0b6b9c0fa60acbc7481b435c7112f3
    with:
      thread: ${{ github.event.pull_request.number }}
      # Check out the plan PR's branch.
      ref: ${{ github.event.pull_request.head.ref }}
      playwright: true
      model_args: --model sonnet
      # The files in .github/agent/ that become the system prompt. The order matters:
      # rules.md first, build.md last (scripts/__tests__/load-agent-files.test.ts checks it).
      agent_files: rules.md build.md
      prompt: >-
        @${{ github.event.review.user.login }} approved the plan on PR #${{ github.event.pull_request.number }}.
        Build it: follow "Build a plan PR" in your instructions. The approver is ${{ github.event.review.user.login }}.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KINSCAPE_APP_PRIVATE_KEY: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
