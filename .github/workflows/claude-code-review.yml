name: 'Claude: Code Review'

# When a PR is opened, updated or marked ready, Claude reviews the code and
# leaves comments on it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skipped only when every changed file matches.
    paths-ignore:
      - 'plans/**'

# One review per PR: a new push cancels the older, now-stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Dependabot pull requests get no Actions secrets, so the review cannot run.
    # Drafts are reviewed when marked ready for review.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The rules come from main, not the checked-out branch: a PR can't change its own reviewer.
      # Until the file is on main (404) the review runs without it; any other failure retries, then fails the job.
      - name: Load review rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/.github/agent/review.md?ref=main" > "$RUNNER_TEMP/review.md" 2> "$RUNNER_TEMP/review.err" && exit 0
            grep -q 'HTTP 404' "$RUNNER_TEMP/review.err" && break
            sleep $((attempt * 5))
          done
          if grep -q 'HTTP 404' "$RUNNER_TEMP/review.err"; then
            echo "::warning::review.md is not on main yet"
            echo "No review rules on main." > "$RUNNER_TEMP/review.md"
          else
            cat "$RUNNER_TEMP/review.err" >&2
            exit 1
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The plugin is pinned to a commit in this marketplace. Dependabot doesn't track it: bump the sha by hand.
          plugin_marketplaces: './.github/claude-plugins'
          plugins: 'code-review@kinscape-ci'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--model opus --effort high --allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt-file ${{ runner.temp }}/review.md'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The weekly denial audit (claude-denial-audit.yml) reads the denials in this transcript.
      - name: Upload Claude's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14

      # The action runs only a workflow identical to main's, so on a PR that changes this file Claude never starts.
      # That known cause warns (the PR needs a human review); any other missing review fails the job.
      - name: Report a missing review
        if: steps.claude-review.outputs.conclusion == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/.github/workflows/claude-code-review.yml?ref=main" > "$RUNNER_TEMP/main-workflow.yml"
          if cmp -s "$RUNNER_TEMP/main-workflow.yml" .github/workflows/claude-code-review.yml; then
            echo "::error::No review: Claude didn't start. See the step above."
            exit 1
          fi
          echo "::warning::No Claude review: this PR changes claude-code-review.yml, which the action runs only as it is on main. Review it by hand; the change applies to later PRs."
