name: 'Claude: Code Review'

# When a PR is opened, updated or marked ready, Claude reviews the code and
# leaves comments on it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skipped only when every changed file matches.
    paths-ignore:
      - 'plans/**'

# One review per PR: a new push cancels the older, now-stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Run Claude
    # Dependabot pull requests get no Actions secrets, so the review cannot run.
    # Drafts are reviewed when marked ready for review. Outsiders' PRs aren't reviewed.
    if: >-
      github.actor != 'dependabot[bot]' && !github.event.pull_request.draft &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    env:
      # A run ends with its turn, which kills background sub-agents and posts nothing.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # The changes-since step lists this workflow's earlier runs.
      actions: read
      # Needed: this step passes no github_token, so the action gets its token by an OIDC exchange.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The rules and settings come from main, not the checked-out branch: a PR can't change its own
      # reviewer. The action retries a failed download, then fails the job, and shows review.md.
      - name: Load review rules and settings
        uses: henetiriki/kinscape/.github/actions/load-agent-files@main
        with:
          files: review.md
          settings: review-settings.json
          token: ${{ github.token }}

      # Agent mode posts nothing until Claude does, so mark the PR as picked up: :eyes: stays, the
      # "Working" comment is deleted when the run ends. Neither is worth failing the run for.
      - name: Show that the review started
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPINNER_URL: ${{ github.server_url }}/${{ github.repository }}/raw/main/.github/clauding.gif
        run: |
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/reactions" -f content=eyes --silent
          id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="Reviewing… <img src='$SPINNER_URL' width='14' height='14' alt=''>

          [View run]($RUN_URL)" --jq .id)
          echo "WORKING_COMMENT_ID=$id" >> "$GITHUB_ENV"

      # After a review, a push is reviewed for what changed since (review.md › Findings): the diff from
      # the head of the PR's last review. With no review, on a re-run, or on any failure, no file is
      # written and the whole PR is reviewed. Only a written diff sets `scope=since`.
      - name: Write the changes since the last review
        id: since
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diff="$GITHUB_WORKSPACE/.since-last-review.diff"
          # The branch could commit a file or folder by this name: only this step may write it.
          rm -rf "$diff"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "A re-run: reviewing the whole PR."
            exit 0
          fi
          # Successful runs, newest first. One counts as a review only if it uploaded Claude's transcript
          # (kept 14 days): a run where Claude didn't start, as on a PR changing this file, succeeds too.
          last=""
          for run in $(gh run list --workflow claude-code-review.yml --branch "$HEAD_REF" --event pull_request --status success \
            --json databaseId,headSha --jq '.[] | select(.headSha != env.HEAD_SHA) | "\(.databaseId):\(.headSha)"'); do
            if [ -n "$(gh api "repos/$GH_REPO/actions/runs/${run%%:*}/artifacts" \
              --jq '.artifacts[] | select(.name == "claude-execution-output" and (.expired | not)) | .id')" ]; then
              last="${run#*:}"
              break
            fi
          done
          if ! [[ "$last" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No earlier review: reviewing the whole PR."
            exit 0
          fi
          # A rebase drops the reviewed commit from the PR.
          if ! gh pr view "$PR_NUMBER" --json commits --jq '.commits[].oid' | grep -qx "$last"; then
            echo "$last is no longer in the PR: reviewing the whole PR."
            exit 0
          fi
          gh api -H "Accept: application/vnd.github.diff" "repos/$GH_REPO/compare/$last...$HEAD_SHA" > "$RUNNER_TEMP/since.diff"
          mv "$RUNNER_TEMP/since.diff" "$diff"
          echo "scope=since" >> "$GITHUB_OUTPUT"
          echo "Reviewing the changes since $last."

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The plugin is pinned to a commit in this marketplace. Dependabot doesn't track it: bump the sha by hand,
          # and re-check review-settings.json against the plugin command's allowed-tools.
          plugin_marketplaces: './.github/claude-plugins'
          plugins: 'code-review@kinscape-ci'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Read-only permissions from main (.github/agent/review-settings.json).
          settings: ${{ runner.temp }}/agent/review-settings.json
          # The inline-comment tool stays a flag: the action starts its MCP server only if claude_args names it.
          # A full review runs on Opus at high effort: the main agent reviews alone, without the plugin's agents.
          # A review of the changes since the last one is small, so it keeps the default model.
          claude_args: '${{ steps.since.outputs.scope != ''since'' && ''--model opus --effort high '' || '''' }}--allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt-file ${{ runner.temp }}/agent/system.md'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The weekly denial audit (claude-denial-audit.yml) reads the denials in this transcript.
      - name: Upload Claude's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14

      # Before the step below, whose `gh pr comment --edit-last` would otherwise edit this comment.
      - name: Remove the working comment
        if: always() && env.WORKING_COMMENT_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$WORKING_COMMENT_ID"

      # The action runs only a workflow identical to main's, so on a PR that changes this file Claude never starts.
      # That known cause comments on the PR (it needs a human review); any other missing review fails the job.
      # !cancelled(): a failed load step above also lands here, as when this file changes before the action on
      # main takes the `settings` input; a run cancelled by a newer push (concurrency) does not.
      - name: Report a missing review
        if: "!cancelled() && steps.claude-review.outputs.conclusion == ''"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/.github/workflows/claude-code-review.yml?ref=main" > "$RUNNER_TEMP/main-workflow.yml"
          if cmp -s "$RUNNER_TEMP/main-workflow.yml" .github/workflows/claude-code-review.yml; then
            echo "::error::No review: Claude didn't start. See the step above."
            exit 1
          fi
          msg=$'## :rotating_light: No Claude review\n\nThis PR changes claude-code-review.yml, which the action runs only as it is on main. Review it by hand; the change applies to later PRs.'
          # Each push updates the one comment. A read-only token (fork PR) falls back to a warning.
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$msg" || echo "::warning::$msg"

  # With show_full_output off, the log above stops at the start of the review. This writes the run
  # page from Claude's transcript (the run-summary action, from main), as claude-run.yml does for
  # plan and build runs. It has no secrets, and its script step never fails the job. A review
  # cancelled by a newer push (concurrency) gets no summary, so `!cancelled()`, not `always()`.
  summary:
    name: Result
    needs: claude-review
    if: "!cancelled() && needs.claude-review.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@main
