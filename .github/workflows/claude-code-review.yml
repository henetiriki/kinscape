name: 'Claude: Code Review'

# When a PR is opened, updated or marked ready, Claude reviews the code and
# leaves comments on it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skipped only when every changed file matches.
    paths-ignore:
      - 'plans/**'

# One review per PR: a new push cancels the older, now-stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Run Claude
    # Dependabot pull requests get no Actions secrets, so the review cannot run.
    # Drafts are reviewed when marked ready for review.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft

    runs-on: ubuntu-latest
    env:
      # A run ends with its turn, which kills background sub-agents and posts nothing.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # Needed: this step passes no github_token, so the action gets its token by an OIDC exchange.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The rules and settings come from main, not the checked-out branch: a PR can't change its own
      # reviewer. The action retries a failed download, then fails the job, and shows review.md.
      - name: Load review rules and settings
        uses: henetiriki/kinscape/.github/actions/load-agent-files@main
        with:
          files: review.md
          settings: review-settings.json
          token: ${{ github.token }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The plugin is pinned to a commit in this marketplace. Dependabot doesn't track it: bump the sha by hand,
          # and re-check review-settings.json against the plugin command's allowed-tools.
          plugin_marketplaces: './.github/claude-plugins'
          plugins: 'code-review@kinscape-ci'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Read-only permissions from main (.github/agent/review-settings.json).
          settings: ${{ runner.temp }}/agent/review-settings.json
          # The inline-comment tool stays a flag: the action starts its MCP server only if claude_args names it.
          claude_args: '--model opus --effort high --allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt-file ${{ runner.temp }}/agent/system.md'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The weekly denial audit (claude-denial-audit.yml) reads the denials in this transcript.
      - name: Upload Claude's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14

      # The action runs only a workflow identical to main's, so on a PR that changes this file Claude never starts.
      # That known cause comments on the PR (it needs a human review); any other missing review fails the job.
      # !cancelled(): a failed load step above also lands here, as when this file changes before review-settings.json
      # is on main; a run cancelled by a newer push (concurrency) does not.
      - name: Report a missing review
        if: "!cancelled() && steps.claude-review.outputs.conclusion == ''"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" "repos/$GH_REPO/contents/.github/workflows/claude-code-review.yml?ref=main" > "$RUNNER_TEMP/main-workflow.yml"
          if cmp -s "$RUNNER_TEMP/main-workflow.yml" .github/workflows/claude-code-review.yml; then
            echo "::error::No review: Claude didn't start. See the step above."
            exit 1
          fi
          msg=$'## :rotating_light: No Claude review\n\nThis PR changes claude-code-review.yml, which the action runs only as it is on main. Review it by hand; the change applies to later PRs.'
          # Each push updates the one comment. A read-only token (fork PR) falls back to a warning.
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$msg" || echo "::warning::$msg"

  # With show_full_output off, the log above stops at the start of the review. This writes the run
  # page from Claude's transcript (the run-summary action, from main), as claude-run.yml does for
  # plan and build runs. It has no secrets, and its script step never fails the job. A review
  # cancelled by a newer push (concurrency) gets no summary, so `!cancelled()`, not `always()`.
  summary:
    name: Result
    needs: claude-review
    if: "!cancelled() && needs.claude-review.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@main
