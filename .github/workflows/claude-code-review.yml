name: 'Claude: Code review'

# When a PR is opened, updated or marked ready, Claude reviews the code and
# leaves comments on it.
#
# The title shown for each run in the Actions tab: "Review: <PR title>" for a ready PR by the
# owner, a member, a collaborator or the bot, "Skipped Review: <PR title>" for a draft, Dependabot, the
# bot's action-pin PR or an outsider's PR. The pin PR is the bot's PR from the head branch
# bot/update-action-pins, and the bot itself pushed the change: a person's push to it is reviewed.
# A PR that changes only plans/** gets "Review: <PR title>" too. Its job runs, skips Claude and ends
# green, because the `Review` check is required. Repeats the `claude-review` job's `if:` (run-name
# cannot see job results): change them together.
run-name: >-
  ${{
    github.actor != 'dependabot[bot]' && !github.event.pull_request.draft &&
    !(github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
      github.actor == vars.KINSCAPE_BOT_LOGIN &&
      github.event.pull_request.head.ref == 'bot/update-action-pins' &&
      github.event.pull_request.head.repo.full_name == github.repository) &&
    (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
      github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN) &&
    format('Review: {0}', github.event.pull_request.title) ||
    format('Skipped Review: {0}', github.event.pull_request.title)
  }}

on:
  pull_request:
    # No path filter: a required check that a filter skips stays pending, and the PR can't merge.
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR: a new push cancels the older, now-stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A check name no other workflow uses: claude-respond.yml's jobs show as "Respond / Run Claude" and "Respond / Result".
    name: Review
    # Dependabot pull requests get no Actions secrets, so the review cannot run.
    # Drafts are reviewed when marked ready for review. Outsiders' PRs aren't reviewed; the bot's own
    # are (a GitHub App's PR is no collaborator's).
    if: >-
      github.actor != 'dependabot[bot]' && !github.event.pull_request.draft &&
      !(github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
        github.actor == vars.KINSCAPE_BOT_LOGIN &&
        github.event.pull_request.head.ref == 'bot/update-action-pins' &&
        github.event.pull_request.head.repo.full_name == github.repository) &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
        github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN)

    runs-on: ubuntu-latest
    env:
      # A run ends with its turn, which kills background sub-agents and posts nothing.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      # The changes-since step lists this workflow's earlier runs.
      actions: read

    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The rules, settings, plugin marketplace, the files CLAUDE.md imports and main's copy of this file
      # come from main, not the checked-out branch. The action retries a failed download, then fails the
      # job (Claude doesn't start, and the report step says so), and shows the system prompt.
      - name: Load the review rules and settings
        uses: henetiriki/kinscape/.github/actions/load-agent-files@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
        with:
          files: review.md review-code.md
          settings: review-settings.json
          main_files: AGENTS.md docs/security.md docs/writing.md docs/code-rules.md .github/claude-plugins/.claude-plugin/marketplace.json .github/workflows/claude-code-review.yml
          token: ${{ github.token }}

      # Claude runs only a copy of this file identical to main's, so a PR can't change its own reviewer.
      # (The action checked this itself while it minted its own token; with the workflow token it doesn't.)
      - name: Check that this workflow is main's
        id: same
        run: |
          main="$RUNNER_TEMP/agent/main/.github/workflows/claude-code-review.yml"
          if ! [ -f "$main" ]; then
            echo "::error::The step above didn't load main's copy of this file."
            exit 1
          fi
          if cmp -s "$main" .github/workflows/claude-code-review.yml; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "This file differs from main's: Claude won't start."
          fi

      # The action restores CLAUDE.md from main, but what it imports is read from the checkout: put
      # main's copies there. `git status` shows an M for each one the PR changed.
      - name: Put main's rule files in the checkout
        run: |
          cp "$RUNNER_TEMP/agent/main/AGENTS.md" AGENTS.md
          cp "$RUNNER_TEMP/agent/main/docs/security.md" docs/security.md
          cp "$RUNNER_TEMP/agent/main/docs/writing.md" docs/writing.md
          cp "$RUNNER_TEMP/agent/main/docs/code-rules.md" docs/code-rules.md
          git status --short -- AGENTS.md docs/security.md docs/writing.md docs/code-rules.md

      # `Review` is a required check, which a path filter would leave pending on a PR that changes only
      # plans/**. So the job always runs, and skips Claude for such a PR: the job then ends green. If the
      # list of files fails, Claude runs.
      - name: Find a PR that changes only plans
        id: plans
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          plans_only=false
          if files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename') &&
            [ -n "$files" ] && ! grep -qv '^plans/' <<< "$files"; then
            plans_only=true
          fi
          echo "plans_only=$plans_only" >> "$GITHUB_OUTPUT"

      # Agent mode posts nothing until Claude does, so mark the PR as picked up: :eyes: stays, the
      # "Working" comment is deleted when the run ends. Neither is worth failing the run for.
      - name: Show that the review started
        if: steps.same.outputs.same == 'true' && steps.plans.outputs.plans_only != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPINNER_URL: ${{ github.server_url }}/${{ github.repository }}/raw/main/.github/clauding.gif
        run: |
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/reactions" -f content=eyes --silent
          id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="Reviewing… <img src='$SPINNER_URL' width='14' height='14' alt=''>

          [View run]($RUN_URL)" --jq .id)
          echo "WORKING_COMMENT_ID=$id" >> "$GITHUB_ENV"

      # After a review, a push is reviewed for what changed since (review.md › Findings): the diff from
      # the head of the PR's last review. With no review, on a re-run, or on any failure, no file is
      # written and the whole PR is reviewed. Only a written diff sets `scope=since`.
      - name: Write the changes since the last review
        id: since
        if: steps.same.outputs.same == 'true' && steps.plans.outputs.plans_only != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          diff="$GITHUB_WORKSPACE/.since-last-review.diff"
          # The branch could commit a file or folder by this name: only this step may write it.
          rm -rf "$diff"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "A re-run: reviewing the whole PR."
            exit 0
          fi
          # Runs that ended green or red, newest first. A cancelled run is left out. The limit is high
          # because gh lists 20 by default, and cancelled and plans-only runs could fill them.
          # A red run counts only if its gate step failed. The gate turns a run red when the review has
          # open findings, and a Claude failure is red too. A run counts as a review only if it uploaded
          # Claude's summary (kept 7 days). A run where Claude didn't start succeeds without one.
          last=""
          for run in $(gh run list --workflow claude-code-review.yml --branch "$HEAD_REF" --event pull_request --limit 100 \
            --json conclusion,databaseId,headSha --jq '.[] | select(.headSha != env.HEAD_SHA and (.conclusion == "success" or .conclusion == "failure")) | "\(.databaseId):\(.headSha):\(.conclusion)"'); do
            IFS=: read -r id sha conclusion <<< "$run"
            if [ "$conclusion" = failure ] && [ "$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
              --jq '.jobs[] | select(.name == "Review") | .steps[] | select(.name == "Fail on open findings") | .conclusion')" != failure ]; then
              continue
            fi
            if [ -n "$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" \
              --jq '.artifacts[] | select(.name == "claude-execution-output" and (.expired | not)) | .id')" ]; then
              last="$sha"
              break
            fi
          done
          if ! [[ "$last" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No earlier review: reviewing the whole PR."
            exit 0
          fi
          # A rebase drops the reviewed commit from the PR.
          if ! gh pr view "$PR_NUMBER" --json commits --jq '.commits[].oid' | grep -qx "$last"; then
            echo "$last is no longer in the PR: reviewing the whole PR."
            exit 0
          fi
          gh api -H "Accept: application/vnd.github.diff" "repos/$GH_REPO/compare/$last...$HEAD_SHA" > "$RUNNER_TEMP/since.diff"
          mv "$RUNNER_TEMP/since.diff" "$diff"
          echo "scope=since" >> "$GITHUB_OUTPUT"
          echo "Reviewing the changes since $last."

      - name: Run Claude Code
        id: claude-review
        if: steps.same.outputs.same == 'true' && steps.plans.outputs.plans_only != 'true'
        uses: anthropics/claude-code-action@9eb012b6d0900c2b9eede65ee1758cec4d2973e9 # v1.0.270
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's token: the review posts as github-actions[bot], which can't approve a PR
          # (the Actions token row of docs/repo-settings.md).
          github_token: ${{ github.token }}
          # The App's own PRs: the action refuses a bot actor unless it is listed.
          allowed_bots: ${{ vars.KINSCAPE_BOT_LOGIN }}
          # The marketplace as main has it (loaded above). The plugin is pinned to a commit in it. Dependabot
          # doesn't track it: bump the sha by hand, and re-check review-settings.json against the plugin
          # command's allowed-tools.
          plugin_marketplaces: ${{ runner.temp }}/agent/main/.github/claude-plugins
          plugins: 'code-review@kinscape-ci'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Neither Claude's report nor its full output goes on the public run page: the summary job writes it.
          display_report: false
          show_full_output: false
          # Read-only permissions from main (.github/agent/review-settings.json).
          settings: ${{ runner.temp }}/agent/review-settings.json
          # The inline-comment tool stays a flag: the action starts its MCP server only if claude_args names it.
          # A full review runs on Opus at high effort: the main agent reviews alone, without the plugin's agents.
          # A review of the changes since the last one is small, so it keeps the default model.
          claude_args: '${{ steps.since.outputs.scope != ''since'' && ''--model opus --effort high '' || '''' }}--allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt-file ${{ runner.temp }}/agent/system.md'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The summary, secret scan and upload of Claude's transcript, from a pinned main commit. The
      # summary and scan never fail the job: with no summary nothing is uploaded, and the next push is
      # reviewed whole. A failed upload does fail the job.
      - name: Keep Claude's output
        if: always()
        uses: henetiriki/kinscape/.github/actions/keep-claude-output@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
        with:
          thread: ${{ github.event.issue.number || github.event.pull_request.number }}

      - name: Remove the working comment
        if: always() && env.WORKING_COMMENT_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$WORKING_COMMENT_ID"

      # On a PR that changes this file Claude never starts (the check above). That known cause comments on
      # the PR (it needs a human review); any other missing review fails the job. !cancelled(): a failed step
      # above also lands here, as when this file changes before the action on main takes a new input; a run
      # cancelled by a newer push (concurrency) does not. A PR that changes only plans/** has no review
      # to miss.
      - name: Report a missing review
        if: "!cancelled() && steps.claude-review.outputs.conclusion == '' && steps.plans.outputs.plans_only != 'true'"
        # bash with pipefail, so a failed comment lookup isn't read as no comment.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME: ${{ steps.same.outputs.same }}
        run: |
          if [ "$SAME" != false ]; then
            echo "::error::No review: Claude didn't start. See the steps above."
            exit 1
          fi
          msg=$'## :rotating_light: No Claude review\n\nThis PR changes claude-code-review.yml, which Claude runs only as it is on main. Review it by hand; the change applies to later PRs.'
          # Each push updates the one comment, found by its heading: the token's last comment could be the
          # secret-scan warning. A read-only token (fork PR) falls back to a warning.
          id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## :rotating_light: No Claude review"))) | .id' | tail -n 1) || id=""
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$msg" --silent || echo "::warning::$msg"
          else
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$msg" --silent || echo "::warning::$msg"
          fi

      # Last, so that the output, the working comment and the missing-review report are done before the job
      # turns red. This job is the required check `Review`. It is red while the review has open findings,
      # so the PR can't merge.
      # An open finding is a review thread that the reviewer started and nobody resolved, on any commit: a
      # push after a review (the snapshot bot's too) moves the head, and the thread stays. A re-run doesn't
      # repeat a finding that is still on the PR. The count in the latest `Earlier findings still open: <n>`
      # comment (review.md › Findings) adds the findings that a thread can't show: a resolved thread whose
      # defect is still in the code, and a finding with no line. A fixer resolves a thread before it pushes
      # (fix-review.md), so the review that the push starts sees it. A thread that a person resolves starts
      # no run: they re-run the job. A failed call fails the step.
      - name: Fail on open findings
        if: steps.claude-review.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # One page of 100 threads in each pass. The first comment of a thread names who started it:
          # the reviewer is `github-actions` of type Bot.
          threads=0
          cursor=''
          while :; do
            args=(-f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -F number="$PR_NUMBER")
            [ -z "$cursor" ] || args+=(-f after="$cursor")
            page=$(gh api graphql "${args[@]}" -f query='query($owner: String!, $name: String!, $number: Int!, $after: String) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100, after: $after) {
                    pageInfo { endCursor hasNextPage }
                    nodes { isResolved comments(first: 1) { nodes { author { login __typename } } } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest.reviewThreads | [([.nodes[] | select(.isResolved | not) | .comments.nodes[0].author | select(.login == "github-actions" and .__typename == "Bot")] | length), .pageInfo.hasNextPage, (.pageInfo.endCursor // "")] | @tsv')
            IFS=$'\t' read -r count more cursor <<<"$page"
            threads=$((threads + count))
            [ "$more" = true ] || break
            if [ -z "$cursor" ]; then
              echo "::error::A page of review threads has a next page but no cursor."
              exit 1
            fi
          done
          # The comment starts with the line. Claude may wrap it in markdown: `, *, _, # or >, around the
          # label or the number.
          earlier=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .body | capture("\\A[\\s*_`#>]*Earlier findings still open[*_`]*:[\\s*_`]*(?<n>[0-9]+)") | .n' | tail -n 1)
          total=$((threads + ${earlier:-0}))
          if [ "$total" -gt 0 ]; then
            echo "::error::The review has open findings: $total ($threads unresolved threads, ${earlier:-0} in its Earlier findings still open comment)."
            exit 1
          fi
          echo "The review has no open findings."

  # With show_full_output off, the log above stops at the start of the review. This writes the run
  # page from the summary of Claude's transcript (the run-summary action, from main), as claude-run.yml does for
  # plan and build runs. It has no secrets, and its script step never fails the job. A review
  # cancelled by a newer push (concurrency) gets no summary, so `!cancelled()`, not `always()`.
  summary:
    name: Review result
    needs: claude-review
    if: "!cancelled() && needs.claude-review.result != 'skipped'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
