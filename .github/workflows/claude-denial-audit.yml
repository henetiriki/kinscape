name: 'Claude: Audit denials'

# Claude's runs are limited by an allowlist and some denials (.github/agent/settings.json). Each
# time Claude tries something denied, the summary the run uploads records it. Once a week this
# reads the past week's summaries and keeps one issue up to date with the denials that repeat, so the
# allowlist and the rules follow what the agents really try. It does nothing when none repeats.

on:
  schedule:
    # Every Monday at 07:00 UTC.
    - cron: '0 7 * * 1'
  # Lets a person run it by hand from the Actions tab.
  workflow_dispatch:

# The bot's token reads the runs and does the issue calls: GitHub drops an issue Type that
# `github.token` sets.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-issues: write
      # Run the audit (scripts/denial-audit.mts). GH_TOKEN lets it list runs, download their
      # summaries, and open or update the issue.
      - name: Audit the permission denials
        run: node scripts/denial-audit.mts
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
