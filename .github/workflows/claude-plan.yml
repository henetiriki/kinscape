name: 'Claude: Plan'

# The title shown for each run in the Actions tab:
#   "Plan: <title>"         - the repo owner (the tech lead) marked an issue ready for the agent.
#                             Its author is the owner, a member, a collaborator or the agent App.
#                             Its title starts with "Spec: ", "Bug: " or "Chore: ". An `issues`
#                             payload carries no `issue.type`, so the title prefix shows the
#                             Type. The gate then runs. The gate (scripts/agent-gate.mts) reads the
#                             Type from the API. It stops quietly unless the Type is Spec, Bug or
#                             Chore.
#   "Skipped Plan: <title>" - anything else, so nothing runs (a PO's label included)
# This repeats the `if:` of the `plan` job (run-name cannot see job results): change them together.
# `scripts/__tests__/issue-title-filters.test.ts` fails if their title tests differ.
run-name: >-
  ${{
    github.event.issue.state == 'open' &&
    github.event.label.name == 'status: ready-for-agent' &&
    (startsWith(github.event.issue.title, 'Spec: ') || startsWith(github.event.issue.title, 'Bug: ') || startsWith(github.event.issue.title, 'Chore: ')) &&
    (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
      github.event.issue.user.login == vars.KINSCAPE_BOT_LOGIN) &&
    github.actor == github.repository_owner &&
    format('Plan: {0}', github.event.issue.title) ||
    format('Skipped Plan: {0}', github.event.issue.title)
  }}

# A ready-for-agent Spec, Bug or Chore gets a draft plan PR (plans/README.md); the tech lead's
# approving review on that PR starts claude-build.yml. `@claude` comments on the plan PR are
# handled by claude-respond.yml.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# A second event for the same issue waits for the run in progress, gate included, so its gate then
# sees what that run did (an open plan PR). The label is in the key so that adding another label
# can't displace a waiting run. A run still queued behind a newer one is dropped; they are the same.
concurrency:
  group: plan-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  # Runs when the repo owner adds the "status: ready-for-agent" label to an open issue. Only the tech
  # lead sets that label (how-we-work.md). The PO has write access, so the PO's label must not start
  # a run. The shared runner checks that the plan can start. This includes the issue Type: it must be
  # a Spec, Bug or Chore. Then Claude writes the plan and opens a draft PR. Claude stops there and
  # waits for the tech lead. The runner comes from main, like the agent files.
  plan:
    # The Actions graph shows the runner's jobs under this name: "Plan / Gate", "Plan / Run Claude", "Plan / Result".
    name: Plan
    if: |
      github.event.issue.state == 'open' &&
      github.event.label.name == 'status: ready-for-agent' &&
      (startsWith(github.event.issue.title, 'Spec: ') || startsWith(github.event.issue.title, 'Bug: ') || startsWith(github.event.issue.title, 'Chore: ')) &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        github.event.issue.user.login == vars.KINSCAPE_BOT_LOGIN) &&
      github.actor == github.repository_owner
    uses: henetiriki/kinscape/.github/workflows/claude-run.yml@76a4e958b63030bff188bfa1f1f5eb7ff9892ad1
    with:
      thread: ${{ github.event.issue.number }}
      plan: true
      # A plan for a UI Spec runs `npm run design:check` for its scores, which needs the browser.
      # The cache keeps the download between runs.
      playwright: true
      model_args: --model opus --effort high
      # The files in .github/agent/ that become the system prompt. The order matters:
      # rules.md first, build.md last (scripts/__tests__/load-agent-files.test.ts checks it).
      agent_files: rules.md refresh.md spec-checks.md
      prompt: >-
        Pick up Spec, Bug or Chore #${{ github.event.issue.number }}. Draft the plan only. Follow plans/README.md.
        First refresh it as .github/agent/refresh.md says; this is a plan run.
        The issues that blocked it are in `gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/dependencies/blocked_by`.
        Run `npm run plan:new -- ${{ github.event.issue.number }} <slug>`. Pick a slug of two to four words. Read each issue that it lists, as plans/README.md, related-issues rule says.
        Add one line to your comment that lists the related issues you read. If you read none, write "Related issues read: none".
        If a Chore needs a secret or is too big, hand it back at plan time as plans/README.md, hand-back rule says.
        Write each open choice as a decision in the format in docs/how-we-work.md.
        Put `Closes #${{ github.event.issue.number }}` in the plan PR's body, so the gates and the safety net can find it.
        Push before you stop, then comment on the Spec with a link to the plan PR.
        If you're blocked, comment on the Spec saying why,
        then swap its status label for `status: blocked`.
        A stale fact is not blocked: follow plans/README.md, stale-facts rule.
        Run `npm run words` once after drafting, not after every edit.
        If the plan can't be built until another Spec merges, record that first:
        `gh issue edit ${{ github.event.issue.number }} --add-blocked-by <other>`. Say so in your comment.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KINSCAPE_APP_PRIVATE_KEY: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
