name: 'Claude: Respond'

# This workflow lets people talk to Claude by writing "@claude" in an
# issue, a comment or a PR review.
#
# The title shown for each run in the Actions tab. It reads "Respond: <title>" when Claude
# will answer, and "Skipped Respond: <title>" when it won't. Claude answers when all of these hold:
#   - the bot variable KINSCAPE_BOT_LOGIN is set, and the author is not that account (so Claude never
#     answers itself, and an unset variable lets nobody through)
#   - the issue, review or comment is by the owner, a member or a collaborator (outsiders trigger nothing)
#   - it is not the repo owner approving a draft plan PR that the bot opened (claude-build.yml
#     handles those; an approval from anyone else is answered here, as feedback)
#   - the text mentions "@claude"
# This repeats the `if:` of the `claude` job below (run-name cannot see job results): change them together.
run-name: >-
  ${{
    vars.KINSCAPE_BOT_LOGIN != '' && github.actor != vars.KINSCAPE_BOT_LOGIN &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event_name == 'issues' && github.event.issue.author_association ||
      github.event_name == 'pull_request_review' && github.event.review.author_association ||
      github.event.comment.author_association) &&
    !(github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
      endsWith(github.event.pull_request.title, '(plan)')) &&
    contains(
      github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
      github.event_name == 'pull_request_review' && github.event.review.body ||
      github.event.comment.body,
      '@claude') &&
    format('Respond: {0}', github.event.issue.title || github.event.pull_request.title) ||
    format('Skipped Respond: {0}', github.event.issue.title || github.event.pull_request.title)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# The npm cache path shared with the container jobs (see ci.yml).
env:
  npm_config_cache: /tmp/npm-cache

jobs:
  # Let Claude read the request, work in the repo and reply. A run that fails any of the checks
  # in the `run-name` comment above skips this job, so the Actions tab shows the skipped icon.
  claude:
    name: Run Claude
    if: >-
      vars.KINSCAPE_BOT_LOGIN != '' && github.actor != vars.KINSCAPE_BOT_LOGIN &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event_name == 'issues' && github.event.issue.author_association ||
        github.event_name == 'pull_request_review' && github.event.review.author_association ||
        github.event.comment.author_association) &&
      !(github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.review.author_association == 'OWNER' &&
        github.event.pull_request.draft &&
        github.event.pull_request.user.login == vars.KINSCAPE_BOT_LOGIN &&
        endsWith(github.event.pull_request.title, '(plan)')) &&
      contains(
        github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
        github.event_name == 'pull_request_review' && github.event.review.body ||
        github.event.comment.body,
        '@claude')
    # Shared with the plan and build runs (claude-run.yml), so a revision and a build never overlap.
    concurrency: thread-${{ github.event.pull_request.number || github.event.issue.number }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      # A run ends with its turn, which kills any background work.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Checkout, Node, `npm ci` and the Playwright and Next.js caches: see
      # .github/actions/setup-workspace/action.yml. It runs from main, like run-claude below.
      # Most runs never open a browser, so Claude installs it when it needs one (`npm run e2e:install`,
      # see .github/agent/respond.md); the cache keeps the download between runs.
      - name: Set up the workspace
        uses: henetiriki/kinscape/.github/actions/setup-workspace@90b8105edc4bfba72baf6a52cd736509ff935c54
        with:
          # Persist the PAT, not GITHUB_TOKEN: claude-code-action fetches the PR branch before it sets up git auth,
          # and runs triggered by a GITHUB_TOKEN push wait for approval.
          token: ${{ secrets.KINSCAPE_BOT_PAT }}
          persist-credentials: 'true'
          playwright: 'true'

      # Loads the agent files, runs Claude Code and uploads its output: see
      # .github/actions/run-claude/action.yml. It runs from main, like claude-run.yml's copy of this
      # step, so the checked-out branch can't change it.
      - name: Run Claude Code
        id: claude
        uses: henetiriki/kinscape/.github/actions/run-claude@458a581a2a46f245b636c24a6146f17be2ced84b
        with:
          # The files in .github/agent/ that become the system prompt. The order matters: respond.md
          # points to build.md "below", so build.md comes after it.
          files: rules.md respond.md build.md
          # Same tools, denials and Bash timeout as the CI agent (settings.json); the rules and the
          # respond and build instructions are the system prompt. Planning is the hard thinking, so a
          # plan PR (its title ends "(plan)") gets the stronger Opus model and everything else Sonnet.
          model_args: >-
            ${{ contains(github.event.issue.title || github.event.pull_request.title, '(plan)') && '--model opus --effort high' || '--model sonnet' }}
          additional_permissions: 'actions: read'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_login: ${{ vars.KINSCAPE_BOT_LOGIN }}
          bot_id: ${{ vars.KINSCAPE_BOT_ID }}

  # With show_full_output off, the log above stops at the start of the run. This writes the run page
  # from the summary of Claude's transcript (the run-summary action, from main, so the checked-out branch can't
  # change it), as claude-run.yml does for plan and build runs. It has no secrets, and its script step never fails the job.
  summary:
    name: Result
    needs: claude
    if: always() && needs.claude.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@48a0be9d9003af15eb5eef513e79fa73715c4210
