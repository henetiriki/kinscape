name: 'Claude: Run (shared)'

# What both agent paths share: a gate that stops a blocked or duplicate run before any model
# runs, then set up the repo, load the agent files, run Claude, keep its output, and leave a
# comment if Claude left none. claude-plan.yml, claude-build.yml and claude-fix-review.yml call
# this workflow; each decides when to run and what to ask. It never runs on its own.
#
# The `github` context here is the caller's, so `github.event`, `github.run_id` and the rest are
# those of the plan or build run.

on:
  workflow_call:
    inputs:
      thread:
        description: 'The issue or PR number that gets a fallback comment if the agent leaves none.'
        required: true
        type: string
      prompt:
        description: 'What Claude is asked to do.'
        required: true
        type: string
      model_args:
        description: 'Claude CLI model flags, e.g. "--model sonnet".'
        required: true
        type: string
      agent_files:
        description: 'The files in .github/agent/ joined into the system prompt, space separated, in order.'
        required: true
        type: string
      ref:
        description: 'The branch to check out. Empty checks out the default branch.'
        default: ''
        type: string
      playwright:
        description: 'Install the test browser, for a run that runs e2e or design:check.'
        default: false
        type: boolean
      plan:
        description: 'True on a plan run, where the thread is a Spec that is handed back as blocked if the agent goes quiet.'
        default: false
        type: boolean
      kind:
        description: '"fix" on a fix-review run, where the thread is a ready PR that carries the label; empty otherwise (plan decides: a plan or a build).'
        default: ''
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      KINSCAPE_BOT_PAT:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# The npm cache path shared with the container jobs (see ci.yml).
env:
  npm_config_cache: /tmp/npm-cache

jobs:
  # Checks that cost no model run (scripts/agent-gate.mts): a plan stops if an open PR already
  # closes the issue or an issue it is "blocked by" is open; a build stops if the Spec its PR
  # closes is blocked; a fix stops if the PR is no longer open, ready and labelled. On a stop it
  # comments why (a fix and a stale event stop quietly), and `run` is skipped.
  gate:
    # The Actions graph shows this as "<caller job> / Gate".
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      # The script comes from main, like the agent files. It uses only Node's own modules, so no `npm ci`.
      - name: Check out the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check the run can start
        id: gate
        env:
          GH_TOKEN: ${{ secrets.KINSCAPE_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind == 'fix' && 'fix' || inputs.plan && 'plan' || 'build' }}
          NUMBER: ${{ inputs.thread }}
          # The caller's run (the `github` context here is the caller's), linked in the stop comment.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/agent-gate.mts "$KIND" "$NUMBER"

  run:
    # The Actions graph shows this as "<caller job> / Run Claude".
    name: Run Claude
    needs: gate
    if: needs.gate.outputs.go == 'true'
    # One run per thread at a time, shared with claude-respond.yml, so a revision and a build never overlap.
    concurrency: thread-${{ inputs.thread }}
    # A stuck agent stops here; the longest build so far took 17 minutes.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      THREAD: ${{ inputs.thread }}
      # A run ends with its turn, which kills any background work.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      # Checkout, Node, `npm ci` and, when the caller says Claude will run e2e or design:check (a
      # build, or a plan for a UI Spec), the Playwright and Next.js caches: see
      # .github/actions/setup-workspace/action.yml. It runs from main, like run-claude.
      - name: Set up the workspace
        uses: henetiriki/kinscape/.github/actions/setup-workspace@90b8105edc4bfba72baf6a52cd736509ff935c54
        with:
          ref: ${{ inputs.ref }}
          # Otherwise git pushes with GITHUB_TOKEN, not the PAT, and the runs it triggers wait for approval.
          persist-credentials: 'false'
          playwright: ${{ inputs.playwright }}
      # The runner already has Chromium's system packages, so only the browser is installed.
      # A CDN stall on a cache miss can hang the download, so it stops after 3.5 minutes. A failed
      # install doesn't stop the build: Claude reports that e2e couldn't run, and CI runs it.
      - name: Install Playwright
        if: inputs.playwright
        continue-on-error: true
        run: timeout 210 npm run e2e:install
      # Note the start time, so the last step can tell whether Claude commented during this run.
      - name: Note start time
        run: echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      # Agent mode posts nothing until Claude does, so mark the thread as picked up: :eyes: stays, the
      # "Planning"/"Building"/"Fixing" comment is deleted when the run ends. Neither is worth failing the run for.
      - name: Show that the run started
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KINSCAPE_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
          THREAD: ${{ inputs.thread }}
          VERB: ${{ inputs.kind == 'fix' && 'Fixing' || inputs.plan && 'Planning' || 'Building' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPINNER_URL: ${{ github.server_url }}/${{ github.repository }}/raw/main/.github/clauding.gif
        run: |
          gh api "repos/$GH_REPO/issues/$THREAD/reactions" -f content=eyes --silent
          id=$(gh api "repos/$GH_REPO/issues/$THREAD/comments" -f body="$VERB… <img src='$SPINNER_URL' width='14' height='14' alt=''>

          [View run]($RUN_URL)" --jq .id)
          echo "WORKING_COMMENT_ID=$id" >> "$GITHUB_ENV"

      # Loads the agent files, runs Claude Code and uploads its output: see
      # .github/actions/run-claude/action.yml. It runs from main, like claude-respond.yml's copy of this
      # step. The caller's prompt and model flags say what to do.
      - name: Run Claude Code
        id: claude
        uses: henetiriki/kinscape/.github/actions/run-claude@17d2fa2a09bdb76c413ef8e67a63df3ef99001c1
        with:
          files: ${{ inputs.agent_files }}
          prompt: ${{ inputs.prompt }}
          model_args: ${{ inputs.model_args }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_login: ${{ vars.KINSCAPE_BOT_LOGIN }}
          bot_id: ${{ vars.KINSCAPE_BOT_ID }}

      # Before the safety net, which counts the bot's comments and would take this one for Claude's.
      - name: Remove the working comment
        if: always() && env.WORKING_COMMENT_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.KINSCAPE_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$WORKING_COMMENT_ID"

      # Safety net: a stalled or failed run still leaves a trace. This runs even if Claude's
      # step failed. If Claude left no comment, post one pointing at the run, or at the PR it
      # opened. Only a run with neither hands the Spec back as blocked.
      - name: Comment if Claude left none
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KINSCAPE_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
          BOT_LOGIN: ${{ vars.KINSCAPE_BOT_LOGIN }}
          OUTCOME: ${{ steps.claude.outcome }}
          PLAN: ${{ inputs.plan }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Count the bot's comments on this thread since the run started.
          commented=$(gh issue view "$THREAD" --json comments \
            --jq "[.comments[] | select(.author.login == \$ENV.BOT_LOGIN and .createdAt >= \"$STARTED\")] | length")
          # None means Claude went quiet. On a plan run (a Spec was labelled) it may still have
          # opened the plan PR: find a bot PR from this run that closes the Spec.
          if [ "$commented" = 0 ]; then
            pr=""
            if [ "$PLAN" = true ]; then
              pr=$(gh pr list --state all --author "$BOT_LOGIN" --json number,createdAt,closingIssuesReferences \
                --jq "[.[] | select(.createdAt >= \"$STARTED\" and any(.closingIssuesReferences[]; .number == $THREAD))][0].number // empty")
            fi
            if [ -n "$pr" ]; then
              gh issue comment "$THREAD" --body "The agent opened #$pr but left no comment here. See the [run]($RUN_URL)."
            else
              gh issue comment "$THREAD" --body "The agent finished without commenting (step outcome: $OUTCOME). Check the [run]($RUN_URL) and the branch before re-triggering."
              # If this was a plan run, the thread is the Spec itself:
              # swap its "ready-for-agent" label for "blocked" to hand it back to a person.
              if [ "$PLAN" = true ]; then
                gh issue edit "$THREAD" --remove-label "status: ready-for-agent" --add-label "status: blocked"
              fi
            fi
          fi

  # GitHub lists no steps for a job in a called workflow, so the run page would show nothing. This
  # writes the result section shown on that page from Claude's summary (the run-summary action,
  # from main). It runs even when `run` failed, has no secrets, and its script step never fails the job.
  summary:
    # The Actions graph shows this as "<caller job> / Result".
    name: Result
    needs: [gate, run]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@c7cfcaa85fe511b5581b8695449fb1d804e02ca0
