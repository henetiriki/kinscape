name: 'Claude: Run (shared)'

# What the agent paths share: a gate that stops a blocked or duplicate run before any model
# runs, then fetch the repo, load the agent files, run Claude, keep its output, and leave a
# comment if Claude left none, and hand the issue back if the run ended on Claude's turn.
# claude-plan.yml, claude-build.yml, claude-fix-review.yml, claude-resolve-conflict.yml and
# claude-respond.yml call this workflow; each decides when to run and what to ask. It never runs on its own.
#
# A respond run (`kind: respond`) answers an @claude comment in tag mode, where the comment is the
# prompt. It has no gate (it has nothing to check), keeps the App token in git, and leaves the start
# comment and the browser install to Claude.
#
# The `github` context here is the caller's, so `github.event`, `github.run_id` and the rest are
# those of the plan or build run.

on:
  workflow_call:
    inputs:
      thread:
        description: 'The issue or PR number that gets a fallback comment if the agent leaves none.'
        required: true
        type: string
      prompt:
        description: 'What Claude is asked to do. Empty keeps tag mode, where the triggering comment is the prompt.'
        default: ''
        type: string
      model_args:
        description: 'Claude CLI model flags, e.g. "--model sonnet".'
        required: true
        type: string
      agent_files:
        description: 'The files in .github/agent/ joined into the system prompt, space separated, in order.'
        required: true
        type: string
      ref:
        description: 'The branch to fetch. Empty fetches the default branch.'
        default: ''
        type: string
      playwright:
        description: 'Restore the test browser cache; install the browser too, for a run that runs e2e or design:check. A respond run installs it on demand.'
        default: false
        type: boolean
      plan:
        description: 'True on a plan run, where the thread is a Spec that is handed back as blocked if the agent goes quiet.'
        default: false
        type: boolean
      kind:
        description: '"fix" on a fix-review run and "resolve" on a resolve-conflict run, where the thread is a PR that carries the label; "respond" on a reply to an @claude comment; empty otherwise (plan decides: a plan or a build).'
        default: ''
        type: string
      head:
        description: 'The commit the checked-out branch must be at, on a build: the one the approval recorded (scripts/agent-approve.mts). Empty skips the check.'
        default: ''
        type: string
      main_files:
        description: "Repo files Claude reads as main has them, space separated. The run-claude action writes main's copy of each file in the checkout. An empty value changes no file."
        default: ''
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # The bot's GitHub App private key. Each job mints its own one-hour token from it and
      # vars.KINSCAPE_APP_CLIENT_ID, with only the permissions that job needs.
      KINSCAPE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# The npm cache path shared with the container jobs (see ci.yml).
env:
  npm_config_cache: /tmp/npm-cache

jobs:
  # Checks that cost no model run (scripts/agent-gate.mts): a plan stops if an open PR already
  # closes the issue or an issue it is "blocked by" is open; a build stops if the Spec its PR
  # closes is blocked; a fix stops if the PR is no longer open, ready and labelled, a resolve if it
  # is no longer open and labelled. On a stop it comments why (a fix, a resolve and a stale event
  # stop quietly), and `run` is skipped. A respond run has nothing to check, so it skips this job.
  gate:
    # The Actions graph shows this as "<caller job> / Gate".
    name: Gate
    if: inputs.kind != 'respond'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      # The script comes from main, like the agent files. It uses only Node's own modules, so no `npm ci`.
      - name: Fetch the gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-issues: write
          # Write: a stop comments on the PR thread of a build or a fix.
          permission-pull-requests: write
      - name: Check that the run can start
        id: gate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind || inputs.plan && 'plan' || 'build' }}
          NUMBER: ${{ inputs.thread }}
          # The caller's run (the `github` context here is the caller's), linked in the stop comment.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/agent-gate.mts "$KIND" "$NUMBER"

  run:
    # The Actions graph shows this as "<caller job> / Run Claude".
    name: Run Claude
    needs: gate
    # A skipped gate skips its dependants unless the condition names a status function.
    if: ${{ !cancelled() && (inputs.kind == 'respond' || needs.gate.result == 'success' && needs.gate.outputs.go == 'true') }}
    # One run per thread at a time, so a reply, a revision and a build never overlap.
    concurrency: thread-${{ inputs.thread }}
    # A stuck agent stops here; the longest build so far took 17 minutes.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      THREAD: ${{ inputs.thread }}
      # A run ends with its turn, which kills any background work.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    steps:
      # First, because a respond run's checkout needs it; the job's timeout keeps it fresh: it lasts
      # an hour and the job 45 minutes. The commit check below needs it too.
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-actions: read
          # A merge from main can bring in a workflow change, which GitHub refuses to push without
          # this. Only a resolve run gets it; an empty value asks for nothing.
          permission-workflows: ${{ inputs.kind == 'resolve' && 'write' || '' }}

      # Checkout, Node, `npm ci` and, when the caller says Claude will run e2e or design:check (a
      # build, or a plan for a UI Spec), the Playwright and Next.js caches: see
      # .github/actions/setup-workspace/action.yml. It runs from main, like run-claude.
      - name: Prepare the workspace
        uses: henetiriki/kinscape/.github/actions/setup-workspace@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
        with:
          ref: ${{ inputs.ref }}
          token: ${{ steps.bot.outputs.token }}
          # Only a respond run keeps the token in git: claude-code-action fetches the PR branch before it
          # sets up git auth, and a push by GITHUB_TOKEN starts runs that wait for approval. Any other run
          # sets its auth in the action, so a persisted token would only serve a push by hand.
          persist-credentials: ${{ inputs.kind == 'respond' && 'true' || 'false' }}
          playwright: ${{ inputs.playwright }}

      # Note the start time and the head, so the last step can tell whether Claude commented or
      # pushed a commit during this run.
      - name: Note the start time
        run: |
          echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The approval named one commit (scripts/agent-approve.mts). The branch has moved if a push
      # landed since: that is not what the owner read, so the run stops here, before the browser
      # install and any model run, and the `return` job hands the issue back.
      - name: Check that the branch is at the approved commit
        id: head
        if: inputs.head != ''
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ inputs.head }}
        run: |
          now=$(git rev-parse HEAD)
          if [ "$now" != "$HEAD" ]; then
            # Says so when the comment landed: the safety net below then stays quiet. When it
            # didn't, the net speaks instead.
            if gh pr comment "$THREAD" --body "Not built: the branch moved after the approval (\`${HEAD:0:7}\` → \`${now:0:7}\`). Approve the plan again."; then
              echo "commented=true" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          echo "At the approved commit $now."

      # The runner already has Chromium's system packages, so only the browser is installed.
      # A CDN stall on a cache miss can hang the download, so it stops after 3.5 minutes. A failed
      # install doesn't stop the build: Claude reports that e2e couldn't run, and CI runs it.
      # A respond run installs it on demand (`npm run e2e:install`, .github/agent/respond.md); the cache keeps the download.
      - name: Install Playwright
        if: inputs.playwright && inputs.kind != 'respond'
        continue-on-error: true
        run: timeout 210 npm run e2e:install

      # Agent mode posts nothing until Claude does, so mark the thread as picked up: :eyes: stays, the
      # "Planning"/"Building"/"Fixing"/"Resolving" comment is deleted when the run ends. Neither is worth failing the run for.
      # Tag mode, which a respond run uses, posts its own comment and :eyes:.
      - name: Show that the run started
        if: inputs.kind != 'respond'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          THREAD: ${{ inputs.thread }}
          VERB: ${{ inputs.kind == 'fix' && 'Fixing' || inputs.kind == 'resolve' && 'Resolving' || inputs.plan && 'Planning' || 'Building' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPINNER_URL: ${{ github.server_url }}/${{ github.repository }}/raw/main/.github/clauding.gif
        run: |
          gh api "repos/$GH_REPO/issues/$THREAD/reactions" -f content=eyes --silent
          id=$(gh api "repos/$GH_REPO/issues/$THREAD/comments" -f body="$VERB… <img src='$SPINNER_URL' width='14' height='14' alt=''>

          [View run]($RUN_URL)" --jq .id)
          echo "WORKING_COMMENT_ID=$id" >> "$GITHUB_ENV"

      # Loads the agent files, runs Claude Code and uploads its output: see
      # .github/actions/run-claude/action.yml. It runs from main, so the checked-out branch can't
      # change it. The caller's prompt and model flags say what to do.
      - name: Run Claude Code
        id: claude
        uses: henetiriki/kinscape/.github/actions/run-claude@73b145a4543a476b742d9e15ca05788d3b4e9b78
        with:
          files: ${{ inputs.agent_files }}
          prompt: ${{ inputs.prompt }}
          model_args: ${{ inputs.model_args }}
          # Tag mode reads CI results on a PR.
          additional_permissions: "${{ inputs.kind == 'respond' && 'actions: read' || '' }}"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot.outputs.token }}
          bot_login: ${{ vars.KINSCAPE_BOT_LOGIN }}
          bot_id: ${{ vars.KINSCAPE_BOT_ID }}
          team_logins: ${{ vars.KINSCAPE_TEAM_LOGINS }}
          main_files: ${{ inputs.main_files }}

      # Before the safety net, which counts the bot's comments and would take this one for Claude's.
      - name: Remove the working comment
        if: always() && env.WORKING_COMMENT_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/$GH_REPO/issues/comments/$WORKING_COMMENT_ID"

      # Safety net: a stalled or failed run still leaves a trace. This runs even if Claude's
      # step failed, but not when the commit check above stopped the run and commented.
      # If Claude left no comment, post one that points at the run, at the PR it opened, or says
      # it pushed a commit. Only a run with none of these returns the Spec as blocked. A respond
      # run has no safety net: tag mode may reply in a review thread, which this count does not see.
      - name: If Claude left no comment, post one
        if: always() && inputs.kind != 'respond' && steps.head.outputs.commented != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BOT_LOGIN: ${{ vars.KINSCAPE_BOT_LOGIN }}
          OUTCOME: ${{ steps.claude.outcome }}
          PLAN: ${{ inputs.plan }}
          REF: ${{ inputs.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `gh … --json` is GraphQL, which shows an App's bot without its "[bot]" suffix, and
          # `--author` wants "app/<name>" for one. A user account's login is the same in both.
          export GQL_LOGIN=${BOT_LOGIN%\[bot\]}
          author=$([ "$GQL_LOGIN" = "$BOT_LOGIN" ] && echo "$BOT_LOGIN" || echo "app/$GQL_LOGIN")
          # Count the bot's comments on this thread since the run started.
          commented=$(gh issue view "$THREAD" --json comments \
            --jq "[.comments[] | select(.author.login == \$ENV.GQL_LOGIN and .createdAt >= \"$STARTED\")] | length")
          # None means Claude went quiet. On a plan run (a Spec was labelled) it may still have
          # opened the plan PR: find a bot PR from this run that closes the Spec.
          if [ "$commented" = 0 ]; then
            pr=""
            if [ "$PLAN" = true ]; then
              pr=$(gh pr list --state all --author "$author" --json number,createdAt,closingIssuesReferences \
                --jq "[.[] | select(.createdAt >= \"$STARTED\" and any(.closingIssuesReferences[]; .number == $THREAD))][0].number // empty")
            fi
            # A run with a `ref` works on that branch: a new head means it pushed. If the read
            # fails, the net does not report a push. A failed `gh api` writes its error body to
            # stdout, so the exit status decides, not the output.
            pushed=""
            if [ -z "$pr" ] && [ -n "$REF" ]; then
              if ! head=$(gh api "repos/$GH_REPO/branches/$REF" --jq .commit.sha); then
                head=""
              fi
              if [ -n "$head" ] && [ "$head" != "$START_SHA" ]; then
                pushed=true
              fi
            fi
            if [ -n "$pr" ]; then
              gh issue comment "$THREAD" --body "The agent opened #$pr but left no comment here. See the [run]($RUN_URL)."
            elif [ -n "$pushed" ]; then
              gh issue comment "$THREAD" --body "The agent pushed a commit but left no comment (step outcome: $OUTCOME). See the [run]($RUN_URL)."
            else
              gh issue comment "$THREAD" --body "The agent finished without commenting (step outcome: $OUTCOME). Check the [run]($RUN_URL) and the branch before re-triggering."
              # If this was a plan run, the thread is the Spec itself:
              # swap its "ready-for-agent" label for "blocked" to hand it back to a person.
              if [ "$PLAN" = true ]; then
                gh issue edit "$THREAD" --remove-label "status: ready-for-agent" --add-label "status: blocked"
              fi
            fi
          fi

  # Hands the issue back to the tech lead when a plan or build run ends on Claude's turn
  # (scripts/agent-return.mts): a plan with no PR, or a build whose PR is still a draft plan. It
  # follows the gate too, so a stop before `run` is covered. A build's `run` has the PR branch
  # fetched, so this is its own job, with the script from main like the gate. A `run` cancelled
  # by a newer queued one hands nothing back: the newer run is still to come.
  return:
    # The Actions graph shows this as "<caller job> / Return".
    name: Return
    needs: [gate, run]
    if: always() && inputs.kind == '' && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only to fetch main; the bot's App token reads the PR and moves the label.
    permissions:
      contents: read
    steps:
      - name: Fetch the return script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create the bot's token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.KINSCAPE_APP_CLIENT_ID }}
          private-key: ${{ secrets.KINSCAPE_APP_PRIVATE_KEY }}
          permission-issues: write
          # Write: a stop comments on the PR thread of a build or a fix.
          permission-pull-requests: write
      - name: If it is still Claude's turn, return the issue
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ inputs.plan && 'plan' || 'build' }}
          NUMBER: ${{ inputs.thread }}
        run: node scripts/agent-return.mts "$KIND" "$NUMBER"

  # GitHub lists no steps for a job in a called workflow, so the run page would show nothing. This
  # writes the result section shown on that page from Claude's summary (the run-summary action,
  # from main). It runs even when `run` failed, has no secrets, and its script step never fails the job.
  summary:
    # The Actions graph shows this as "<caller job> / Result".
    name: Result
    needs: [gate, run]
    if: always() && (needs.gate.outputs.go == 'true' || inputs.kind == 'respond')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write the result
        uses: henetiriki/kinscape/.github/actions/run-summary@19ef1cd5cc8efc5d2edd4f079376346e9cd84dd4
