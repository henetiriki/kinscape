name: 'Claude: Spec Agent - Plan/Build'

# The title shown for each run in the Actions tab. It names the path the run took:
#   "Plan: <title>"  - a Spec, Bug or Chore was marked ready for the agent, so Claude drafts a plan
#   "Build: <title>" - the tech lead approved a draft plan PR, so Claude builds it
#   "Skipped: <title>" - neither happened, so nothing runs
# This repeats the `if:` of the `plan` and `build` jobs (run-name cannot see job results):
# change them together.
run-name: >-
  ${{
    github.event_name == 'issues' &&
    github.event.issue.state == 'open' &&
    github.event.label.name == 'status: ready-for-agent' &&
    (contains(github.event.issue.labels.*.name, 'type: spec') ||
      contains(github.event.issue.labels.*.name, 'type: bug') ||
      contains(github.event.issue.labels.*.name, 'type: chore')) &&
    github.actor != 'henetiriki-bot' &&
    format('Plan: {0}', github.event.issue.title) ||
    github.event_name == 'pull_request_review' &&
    github.event.review.state == 'approved' &&
    github.event.review.author_association == 'OWNER' &&
    github.event.pull_request.draft &&
    github.event.pull_request.user.login == 'henetiriki-bot' &&
    (startsWith(github.event.pull_request.head.ref, 'spec/') ||
      startsWith(github.event.pull_request.head.ref, 'bug/') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C1') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C2') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C3') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C4') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C5') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C6') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C7') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C8') ||
      startsWith(github.event.pull_request.head.ref, 'chore/C9')) &&
    format('Build: {0}', github.event.pull_request.title) ||
    format('Skipped: {0}', github.event.issue.title || github.event.pull_request.title)
  }}

# Two stages (plans/README.md): a ready-for-agent Spec, Bug or Chore gets a draft plan PR;
# the tech lead's approving review on that PR starts the build.
# `@claude` comments on the plan PR are handled by claude.yml.

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  # Rules for both prompts, appended to each job's PROMPT by the `Run Claude Code` step.
  RULES: >-
    Create and change files with Write and Edit, not heredocs.
    Read several files with `cat a b c` or Read, not `for` loops.
    You start in the repo root; don't `cd`.
    Use `npm run lint -- --fix`, `npm run format`, `npm run typecheck`, `npm run e2e -- <file> -g "<name>"`
    and `npm test -- --coverage.enabled=false <path>`, not `npx`, `node -e`, `python3` or `bash -n`.
    Don't write outside the repo (no `/tmp`).
    Pass PR and issue bodies as `--body-file - <<'EOF' … EOF`, never inline `--body`.
    Run commands in the foreground, don't start subagents, and never end your turn to wait: the run ends when your turn does.
    If a command is denied, name it in your comment.

jobs:
  # Path 1: draft a plan. Runs when someone adds the "status: ready-for-agent" label to an open Spec
  # (not to a closed Spec or any other kind of issue) and that person isn't Claude's own bot.
  # Claude writes the plan and opens a draft PR, then stops to wait for the tech lead.
  plan:
    # Only open Specs get a plan, whatever else carries the label.
    if: |
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'status: ready-for-agent' &&
      (contains(github.event.issue.labels.*.name, 'type: spec') ||
        contains(github.event.issue.labels.*.name, 'type: bug') ||
        contains(github.event.issue.labels.*.name, 'type: chore')) &&
      github.actor != 'henetiriki-bot'
    concurrency: thread-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    env:
      # The issue or PR that gets a fallback comment if the agent leaves none.
      THREAD: ${{ github.event.issue.number }}
      PROMPT: >-
        Pick up Spec, Bug or Chore #${{ github.event.issue.number }}. Draft the plan only. Follow plans/README.md.
        A Spec's id is on the Spec (`M1.4`) and its branch is spec/<id>-<slug>.
        A Bug's id is B${{ github.event.issue.number }} and its branch is bug/B${{ github.event.issue.number }}-<slug>.
        A Chore's id is C${{ github.event.issue.number }}, its branch is chore/C${{ github.event.issue.number }}-<slug>
        and its plan is plans/chores/C${{ github.event.issue.number }}-<slug>.md. Hand it back as plans/README.md rule 4 says.
        Write each open choice as a decision in the format in docs/how-we-work.md.
        Push before you stop, then comment on the Spec with a link to the plan PR.
        If you're blocked, comment on the Spec saying why,
        then swap its status label for `status: blocked`.
        Run `npm run words` once after drafting, not after every edit.
      MODEL_ARGS: --model opus --effort high
    # The steps below are shared: the `build` job reuses them as-is (`*steps`). The first one
    # downloads the repo's code; on a plan PR it takes that PR's branch.
    steps: &steps
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on `issues` events, so the default branch is checked out.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          # Otherwise git pushes with GITHUB_TOKEN, not the PAT, and the runs it triggers wait for approval.
          persist-credentials: false

      # Install the project's tools so Claude can run lint and tests.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      # Install the test browser, but only on a build (a PR review), when Claude runs the
      # end-to-end tests. Plan runs don't build. The cache keeps the browser between runs.
      # The runner already has Chromium's system packages, so only the browser is installed.
      - name: Read Playwright version
        id: playwright
        if: github.event_name == 'pull_request_review'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        if: github.event_name == 'pull_request_review'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright
      # A CDN stall on a cache miss can hang the download, so it stops after 3.5 minutes. A failed
      # install doesn't stop the build: Claude reports that e2e couldn't run, and CI runs it.
      - name: Install Playwright
        if: github.event_name == 'pull_request_review'
        continue-on-error: true
        run: timeout 210 npm run e2e:install
      # Note the start time, so the last step can tell whether Claude commented during this run.
      - name: Note start time
        run: echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      # Hand the job to Claude: the PROMPT and MODEL_ARGS set on each job say what to do.
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          prompt: ${{ env.PROMPT }} ${{ env.RULES }}
          # The repo is private; turn off once runs are reliable.
          show_full_output: true
          # The allowed tools let Claude edit files and run npm scripts, git, and GitHub commands.
          claude_args: '${{ env.MODEL_ARGS }} --allowed-tools "Edit,Write,Bash(npm run:*),Bash(npm test:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm i:*),Bash(npm view:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh api:*),Bash(curl:*),Bash(sed:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)" --disallowed-tools "Agent"'

      # The Actions log can stop at an image read and lose the final result; the full output survives here.
      - name: Upload Claude's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14

      # Safety net: a stalled or failed run still leaves a trace. This runs even if Claude's
      # step failed. If Claude left no comment, post one pointing at the run, or at the PR it
      # opened. Only a run with neither hands the Spec back as blocked.
      - name: Comment if Claude left none
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KINSCAPE_BOT_PAT }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.claude.outcome }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Count the bot's comments on this thread since the run started.
          commented=$(gh issue view "$THREAD" --json comments \
            --jq "[.comments[] | select(.author.login == \"henetiriki-bot\" and .createdAt >= \"$STARTED\")] | length")
          # None means Claude went quiet. On a plan run (a Spec was labelled) it may still have
          # opened the plan PR: find a bot PR from this run that closes the Spec.
          if [ "$commented" = 0 ]; then
            pr=""
            if [ "$EVENT" = issues ]; then
              pr=$(gh pr list --state all --author henetiriki-bot --json number,createdAt,closingIssuesReferences \
                --jq "[.[] | select(.createdAt >= \"$STARTED\" and any(.closingIssuesReferences[]; .number == $THREAD))][0].number // empty")
            fi
            if [ -n "$pr" ]; then
              gh issue comment "$THREAD" --body "The agent opened #$pr but left no comment here. See the [run]($RUN_URL)."
            else
              gh issue comment "$THREAD" --body "The agent finished without commenting (step outcome: $OUTCOME). Check the [run]($RUN_URL) and the branch before re-triggering."
              # If this was a plan run, the thread is the Spec itself:
              # swap its "ready-for-agent" label for "blocked" to hand it back to a person.
              if [ "$EVENT" = issues ]; then
                gh issue edit "$THREAD" --remove-label "status: ready-for-agent" --add-label "status: blocked"
              fi
            fi
          fi

  # Path 2: build the approved plan. Runs when the repo owner approves a review on a draft PR
  # that Claude's bot opened from a branch starting with `spec/` (a plan PR). Claude then
  # builds what the plan describes and comments on the PR with the result.
  build:
    # The bot opens quick-chore PRs too: only a draft on a spec/, bug/ or chore/C<n> branch is a plan PR.
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'henetiriki-bot' &&
      (startsWith(github.event.pull_request.head.ref, 'spec/') ||
        startsWith(github.event.pull_request.head.ref, 'bug/') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C1') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C2') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C3') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C4') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C5') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C6') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C7') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C8') ||
        startsWith(github.event.pull_request.head.ref, 'chore/C9'))
    # Shared with claude.yml, so a plan revision finishes before the build starts.
    concurrency: thread-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    env:
      THREAD: ${{ github.event.pull_request.number }}
      PROMPT: >-
        @${{ github.event.review.user.login }} approved the plan on PR #${{ github.event.pull_request.number }}. Build it. Follow plans/README.md.
        Your first command is `gh pr view ${{ github.event.pull_request.number }} --json title,body,comments,reviews,headRefName`
        (`--comments` can't be combined with `--json`).
        Answers to the plan's open decisions are in the review body and the PR comments,
        as `D<n>: <option>` (older plans: free-form). Record the approval and the answers in the approval commit with
        `npm run plan-approve -- <plan> ${{ github.event.review.user.login }} D1=A "D2=other: <text>" …`.
        If this is a Chore plan PR, hand it back as plans/README.md rule 4 says instead of building where it applies.
        If a decision is still unanswered, comment asking for it and stop without building.
        While iterating, run only the affected test file; run the full `npm test` and `npm run e2e` once, before pushing.
        When a test fails, read the error and fix it; don't add temporary debug output.
        Push before you stop. If you built, set the PR title and body to describe the work as it would merge now (plans/README.md rule 3).
        Then comment on the PR saying what you did or what blocked you.
      MODEL_ARGS: --model sonnet
    steps: *steps
