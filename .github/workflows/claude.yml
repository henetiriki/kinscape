name: 'Claude: Code'

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Decides whether to run and on which model. Event text arrives through env,
  # never interpolated into the script.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.decide.outputs.run }}
      model_args: ${{ steps.decide.outputs.model_args }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DRAFT: ${{ github.event.pull_request.draft || github.event.issue.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          case "$EVENT" in
            issue_comment | pull_request_review_comment) text=$COMMENT ;;
            pull_request_review) text=$REVIEW ;;
            issues) text="$ISSUE_TITLE $ISSUE_BODY" ;;
          esac

          # The spec agent's build job owns approving reviews on a plan PR.
          if [ "$EVENT" = pull_request_review ] && [ "$REVIEW_STATE" = approved ] &&
            [ "$DRAFT" = true ] && [[ $HEAD_REF == spec/* ]]; then
            text=
          fi

          # Claude posts as henetiriki-bot; its own comments never start a run.
          run=false
          if [ "$ACTOR" != henetiriki-bot ] && [[ $text == *@claude* ]]; then
            run=true
          fi

          # A draft PR is a plan PR: plan on Opus, everything else on Sonnet.
          model_args='--model sonnet'
          if [ "$DRAFT" = true ]; then
            model_args='--model opus --effort high'
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "model_args=$model_args" >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Shared with the spec agent's jobs, so a revision and a build never overlap.
    concurrency: thread-${{ github.event.pull_request.number || github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Persist the PAT, not GITHUB_TOKEN: the action fetches the PR branch before it sets up git auth,
          # and runs triggered by a GITHUB_TOKEN push wait for approval.
          token: ${{ secrets.KINSCAPE_BOT_PAT }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      # The agent can't install it: npx isn't in its allowed tools.
      - run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          additional_permissions: |
            actions: read
          # The repo is private; turn off once runs are reliable.
          show_full_output: true
          claude_args: '${{ needs.gate.outputs.model_args }} --allowed-tools "Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"'
