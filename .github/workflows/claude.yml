name: 'Claude: Code'

# This workflow lets people talk to Claude by writing "@claude" in an
# issue, a comment or a PR review.
#
# The title shown for each run in the Actions tab. It reads "Respond: <title>" when Claude
# will answer, and "Skipped: <title>" when it won't. Claude answers when all of these hold:
#   - the author is not Claude's own bot account (so Claude never answers itself)
#   - it is not the tech lead approving a draft plan PR (the spec agent handles those)
#   - the text mentions "@claude"
# This repeats the `gate` job below (run-name cannot see job results): change them together.
# `contains` ignores case, the gate does not.
run-name: >-
  ${{
    github.actor != 'henetiriki-bot' &&
    !(github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft &&
      startsWith(github.event.pull_request.head.ref, 'spec/')) &&
    contains(
      github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
      github.event_name == 'pull_request_review' && github.event.review.body ||
      github.event.comment.body,
      '@claude') &&
    format('Respond: {0}', github.event.issue.title || github.event.pull_request.title) ||
    format('Skipped: {0}', github.event.issue.title || github.event.pull_request.title)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Step 1: decide whether Claude should answer at all, and which model it should use.
  # Event text arrives through env, never interpolated into the script.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.decide.outputs.run }}
      model_args: ${{ steps.decide.outputs.model_args }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMMENT: ${{ github.event.comment.body }}
          REVIEW: ${{ github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DRAFT: ${{ github.event.pull_request.draft || github.event.issue.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 1. Pick the text to search for "@claude", based on what just happened:
          #    a comment, a PR review, or a newly opened or assigned issue.
          case "$EVENT" in
            issue_comment | pull_request_review_comment) text=$COMMENT ;;
            pull_request_review) text=$REVIEW ;;
            issues) text="$ISSUE_TITLE $ISSUE_BODY" ;;
          esac

          # 2. If the tech lead approved a draft plan PR, discard the text: the spec agent's
          #    build job owns that review and starts the build, so Claude must not also answer.
          if [ "$EVENT" = pull_request_review ] && [ "$REVIEW_STATE" = approved ] &&
            [ "$DRAFT" = true ] && [[ $HEAD_REF == spec/* ]]; then
            text=
          fi

          # 3. Answer only if "@claude" appears in the text and the author isn't Claude itself.
          # Claude posts as henetiriki-bot; its own comments never start a run.
          run=false
          if [ "$ACTOR" != henetiriki-bot ] && [[ $text == *@claude* ]]; then
            run=true
          fi

          # 4. Choose the model. Planning is the hard thinking, so a draft PR (a plan PR) gets
          #    the stronger Opus model; everything else gets the faster Sonnet model.
          model_args='--model sonnet'
          if [ "$DRAFT" = true ]; then
            model_args='--model opus --effort high'
          fi

          # 5. Hand both answers to the next job.
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "model_args=$model_args" >> "$GITHUB_OUTPUT"

  # Step 2: let Claude read the request, work in the repo and reply. It starts only when the
  # `gate` job above said yes; otherwise this job is skipped.
  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Shared with the spec agent's jobs, so a revision and a build never overlap.
    concurrency: thread-${{ github.event.pull_request.number || github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Persist the PAT, not GITHUB_TOKEN: the action fetches the PR branch before it sets up git auth,
          # and runs triggered by a GITHUB_TOKEN push wait for approval.
          token: ${{ secrets.KINSCAPE_BOT_PAT }}

      # Install the project's tools so Claude can run lint and tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      # The agent can't install it: npx isn't in its allowed tools.
      - run: npx playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          additional_permissions: |
            actions: read
          # Model choice comes from the gate job; the allowed tools limit Claude to npm scripts,
          # git, and GitHub PR and issue commands.
          claude_args: '${{ needs.gate.outputs.model_args }} --allowed-tools "Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"'
