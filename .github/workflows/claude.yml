name: 'Claude: Code'

# This workflow lets people talk to Claude by writing "@claude" in an
# issue, a comment or a PR review.
#
# The title shown for each run in the Actions tab. It reads "Respond: <title>" when Claude
# will answer, and "Skipped: <title>" when it won't. Claude answers when all of these hold:
#   - the author is not Claude's own bot account (so Claude never answers itself)
#   - it is not the repo owner approving a draft plan PR that the bot opened (claude-build.yml
#     handles those; an approval from anyone else is answered here, as feedback)
#   - the text mentions "@claude"
# This repeats the `if:` of the `claude` job below (run-name cannot see job results): change them together.
run-name: >-
  ${{
    github.actor != 'henetiriki-bot' &&
    !(github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'henetiriki-bot' &&
      endsWith(github.event.pull_request.title, '(plan)')) &&
    contains(
      github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
      github.event_name == 'pull_request_review' && github.event.review.body ||
      github.event.comment.body,
      '@claude') &&
    format('Respond: {0}', github.event.issue.title || github.event.pull_request.title) ||
    format('Skipped: {0}', github.event.issue.title || github.event.pull_request.title)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# The npm cache path shared with the container jobs (see ci.yml).
env:
  npm_config_cache: /tmp/npm-cache

jobs:
  # Let Claude read the request, work in the repo and reply. A run that fails any of the checks
  # in the `run-name` comment above skips this job, so the Actions tab shows the skipped icon.
  claude:
    if: >-
      github.actor != 'henetiriki-bot' &&
      !(github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.review.author_association == 'OWNER' &&
        github.event.pull_request.draft &&
        github.event.pull_request.user.login == 'henetiriki-bot' &&
        endsWith(github.event.pull_request.title, '(plan)')) &&
      contains(
        github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
        github.event_name == 'pull_request_review' && github.event.review.body ||
        github.event.comment.body,
        '@claude')
    # Shared with the plan and build runs (claude-run.yml), so a revision and a build never overlap.
    concurrency: thread-${{ github.event.pull_request.number || github.event.issue.number }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      # A run ends with its turn, which kills any background work.
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Persist the PAT, not GITHUB_TOKEN: the action fetches the PR branch before it sets up git auth,
          # and runs triggered by a GITHUB_TOKEN push wait for approval.
          token: ${{ secrets.KINSCAPE_BOT_PAT }}

      # Install the project's tools so Claude can run lint and tests.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      # Most runs never open a browser, so Claude installs it when it needs one (`npm run e2e:install`,
      # see .github/agent/respond.md). The cache keeps the download between runs.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright
      # Start the build from the cache that ci.yml's e2e job saves on main. Restore only: a run started
      # by an issue or a comment has a read-only cache token (`Cache mode: read` in its log),
      # whatever the job's token permissions, so it can't save to main's cache. The key is the
      # e2e job's restore-keys prefix (scripts/__tests__/next-build-cache.test.ts keeps them equal).
      - name: Restore Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
          path: .next/cache

      # From main, not this branch (see the action). claude-run.yml, the plan and build runs, loads the same files.
      - name: Load agent files
        uses: henetiriki/kinscape/.github/actions/load-agent-files@main
        with:
          # The files in .github/agent/ that become the system prompt. The order matters: respond.md
          # points to build.md "below", so build.md comes after it.
          files: rules.md respond.md build.md
          token: ${{ secrets.KINSCAPE_BOT_PAT }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          additional_permissions: |
            actions: read
          # Off: the full output includes every screenshot Claude reads, as base64, and the log
          # stopped at the first of them. The transcript is in the artifact below.
          show_full_output: false
          # Same tools, denials and Bash timeout as the CI agent (settings.json); the rules and the
          # respond and build instructions are the system prompt. Planning is the hard thinking, so a
          # plan PR (its title ends "(plan)") gets the stronger Opus model and everything else Sonnet.
          settings: ${{ runner.temp }}/agent/settings.json
          claude_args: >-
            ${{ contains(github.event.issue.title || github.event.pull_request.title, '(plan)') && '--model opus --effort high' || '--model sonnet' }}
            --append-system-prompt-file ${{ runner.temp }}/agent/system.md

      # The Actions log can stop at an image read and lose the final result; the full output survives here.
      - name: Upload Claude's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 14

  # With show_full_output off, the log above stops at the start of the run. This writes the run page
  # from Claude's transcript (scripts/run-summary.mts, from main, so the checked-out branch can't
  # change it), as claude-run.yml does for plan and build runs. It has no secrets and never fails the run.
  summary:
    needs: claude
    if: always() && needs.claude.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the summary script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The artifact is missing if the run stopped before Claude started; the script says so.
      - name: Download Claude's output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-output
      - name: Write the summary
        continue-on-error: true
        run: node scripts/run-summary.mts "$RUNNER_TEMP/claude-output/claude-execution-output.json"
