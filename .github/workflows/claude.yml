name: 'Claude: Code'

# This workflow lets people talk to Claude by writing "@claude" in an
# issue, a comment or a PR review.
#
# The title shown for each run in the Actions tab. It reads "Respond: <title>" when Claude
# will answer, and "Skipped: <title>" when it won't. Claude answers when all of these hold:
#   - the author is not Claude's own bot account (so Claude never answers itself)
#   - it is not the tech lead approving a draft plan PR (the spec agent handles those)
#   - the text mentions "@claude"
# This repeats the `if:` of the `claude` job below (run-name cannot see job results): change them together.
run-name: >-
  ${{
    github.actor != 'henetiriki-bot' &&
    !(github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft &&
      (startsWith(github.event.pull_request.head.ref, 'spec/') ||
        startsWith(github.event.pull_request.head.ref, 'bug/'))) &&
    contains(
      github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
      github.event_name == 'pull_request_review' && github.event.review.body ||
      github.event.comment.body,
      '@claude') &&
    format('Respond: {0}', github.event.issue.title || github.event.pull_request.title) ||
    format('Skipped: {0}', github.event.issue.title || github.event.pull_request.title)
  }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Let Claude read the request, work in the repo and reply. A run that fails any of the checks
  # in the `run-name` comment above skips this job, so the Actions tab shows the skipped icon.
  claude:
    if: >-
      github.actor != 'henetiriki-bot' &&
      !(github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        github.event.pull_request.draft &&
        (startsWith(github.event.pull_request.head.ref, 'spec/') ||
          startsWith(github.event.pull_request.head.ref, 'bug/'))) &&
      contains(
        github.event_name == 'issues' && format('{0} {1}', github.event.issue.title, github.event.issue.body) ||
        github.event_name == 'pull_request_review' && github.event.review.body ||
        github.event.comment.body,
        '@claude')
    # Shared with the spec agent's jobs, so a revision and a build never overlap.
    concurrency: thread-${{ github.event.pull_request.number || github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Persist the PAT, not GITHUB_TOKEN: the action fetches the PR branch before it sets up git auth,
          # and runs triggered by a GITHUB_TOKEN push wait for approval.
          token: ${{ secrets.KINSCAPE_BOT_PAT }}

      # Install the project's tools so Claude can run lint and tests.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      # Most runs never open a browser, so Claude installs it when it needs one (`npm run e2e:install`,
      # see the system prompt below). The cache keeps the download between runs.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          additional_permissions: |
            actions: read
          # The repo is private; turn off once runs are reliable.
          show_full_output: true
          # Planning is the hard thinking, so a draft PR (a plan PR) gets the stronger Opus model and
          # everything else gets the faster Sonnet model. The allowed tools limit Claude to npm scripts,
          # git, and GitHub PR and issue commands. A denied part denies the whole command, so the
          # system prompt tells Claude to run each command alone and pass a PR body inline.
          claude_args: >-
            ${{ (github.event.issue.draft || github.event.pull_request.draft) && '--model opus --effort high' || '--model sonnet' }}
            --allowed-tools "Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
            --append-system-prompt "Run each allowed command on its own: no pipes, &&, heredocs or temp files.
            Pass a PR body inline: gh pr edit <n> --body '<text>' (single quotes, so backticks stay literal).
            If npm run e2e or npm run design:check fails because Chromium is missing,
            run npm run e2e:install, then retry."
