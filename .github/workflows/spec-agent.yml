name: Spec agent

# Two stages (AGENTS.md › Plans): a ready-for-dev Spec gets a draft plan PR;
# the tech lead's approving review on that PR starts the build.
# `@claude` comments on the plan PR are handled by claude.yml.

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  plan:
    if: |
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      github.event.label.name == 'status: ready-for-dev' &&
      contains(github.event.issue.labels.*.name, 'type: spec') &&
      github.actor != 'henetiriki-bot'
    concurrency: spec-issue-${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          prompt: 'Pick up Spec #${{ github.event.issue.number }}. Draft the plan only.'
          claude_args: '--allowed-tools "Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"'

  build:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER' &&
      github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'henetiriki-bot' &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    concurrency: spec-pr-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.KINSCAPE_BOT_PAT }}
          bot_name: henetiriki-bot
          bot_id: '344434370'
          prompt: '@${{ github.event.review.user.login }} approved the plan on PR #${{ github.event.pull_request.number }}. Build it.'
          claude_args: '--allowed-tools "Bash(npm run:*),Bash(npm test:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"'
