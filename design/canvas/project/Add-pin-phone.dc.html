<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Add a pin, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<script src="./board-helpers.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">
  <x-import component-from-global-scope="KinScape.MapLayout" panel="{{panel}}"></x-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const events = [
      ['birth', 'Birth'], ['baptism', 'Baptism'], ['residence', 'Residence'], ['marriage', 'Marriage'], ['divorce', 'Divorce'],
      ['death', 'Death'], ['burial', 'Burial'], ['land', 'Land'], ['occupation', 'Occupation'], ['other', 'Other']
    ].map((e) => ({ glyph: e[0], label: e[1], value: e[0] }));
    const React = window.React;
    const K = window.KinScape;

    if (!React || !K) return {};

    const h = React.createElement;
    const { mount } = window.KinScapeBoard;
    const noop = () => {};
    // The exporter reads a named prop only from renderVals, so the panel is built here. A part whose props are
    // all text is markup for mount. ChipGroup, DateField and a Button that fills its box take other props, so each is an h call.
    const panel = h('section', { 'aria-labelledby': 'add-pin-phone-title', style: { flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', background: 'var(--surface)', borderRadius: 'var(--radius-sheet) var(--radius-sheet) 0 0', boxShadow: 'var(--shadow-sheet)', overflow: 'hidden' } },
      mount(`<div style="padding: var(--space-20) var(--size-gutter-phone) var(--space-16)"><x-import component-from-global-scope="KinScape.Text" variant="h2" as="h2" id="add-pin-phone-title">Add a pin</x-import></div>`),
      h('div', { style: { flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 'var(--space-16)', padding: '0 var(--size-gutter-phone) var(--space-16)' } },
        mount(`<x-import component-from-global-scope="KinScape.TextField" label="Person" helper="Search the Tree" default-value="Example Person"></x-import><x-import component-from-global-scope="KinScape.TextField" type="search" label="Place" helper="Search a known place, or click the map." default-value="Example Farm"></x-import><x-import component-from-global-scope="KinScape.TextField" label="Address as recorded" helper="Type it exactly as the record reads." default-value="Farm Example, district Example"></x-import>`),
        h(K.ChipGroup, { label: 'Event type', onToggle: noop, options: events, selected: ['residence'] }),
        h('fieldset', { style: { margin: 0, padding: 0, border: 0, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 'var(--space-8)' } },
          mount(`<legend class="label" style="padding: 0; margin-bottom: var(--space-8); color: var(--ink)">From</legend>`),
          // A Day counts days since 1652-01-01: 91109 is 1901-06-14 and 136894 is 2026-10-21.
          h(K.DateField, { day: 91109, defaultText: '1901-02-30', fill: true, max: 136894, min: 0, onChange: noop, placement: 'below', precision: 'day' })
        ),
        mount(`<x-import component-from-global-scope="KinScape.Alert" tone="warning" title="Overlaps another residence">Example Person already lives at Example Farm from 1840 to 1855.</x-import>`)
      ),
      h('div', { style: { display: 'flex', gap: 'var(--space-8)', padding: 'var(--space-12) var(--size-gutter-phone) var(--space-20)' } },
        h('div', { style: { flex: 1 } }, h(K.Button, { full: true, variant: 'primary' }, 'Save pin')),
        h('div', { style: { flex: 1 } }, h(K.Button, { full: true, variant: 'secondary' }, 'Cancel'))
      )
    );

    return { panel };
  }
}
</script>
</body>
</html>
