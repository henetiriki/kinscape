<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Draft, Add a pin button</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<script src="./board-helpers.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 760px; height: 440px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">
<div style="padding: 32px 32px 0; display: flex; flex-direction: column; gap: var(--space-4)">
  <x-import component-from-global-scope="KinScape.Text" variant="h2" as="h2">Add a pin button</x-import>
  <x-import component-from-global-scope="KinScape.Text" variant="body" as="span">A desktop map shows it at the top right, 12 px left of the account control and level with it. It is the primary Button, 44 px high. A phone has no such button.</x-import>
</div>
<span style="position: absolute; left: 32px; top: 128px"><x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">In its place</x-import></span>
<div style="position: absolute; left: 32px; top: 156px; width: 696px; height: 96px; box-sizing: border-box; overflow: hidden; border-radius: var(--radius-panel); background: var(--map-land)">
  <div style="position: absolute; right: 24px; top: 24px"><x-import component-from-global-scope="KinScape.Avatar" initial="R"></x-import></div>
  <div style="position: absolute; right: 80px; top: 24px"><x-import component-from-global-scope="KinScape.Button" variant="primary">Add a pin</x-import></div>
</div>
<span style="position: absolute; left: 32px; top: 280px"><x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Looks</x-import></span>
<div style="position: absolute; left: 32px; top: 308px; width: 696px">
  <x-import component-from-global-scope="KinScape.Surface" level="raised" children="{{looks}}"></x-import>
</div>
<span style="position: absolute; left: 32px; top: 412px"><x-import component-from-global-scope="KinScape.Text" variant="small" as="span">Accessible name: “Add a pin”. It opens the empty panel.</x-import></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    if (!window.React || !window.KinScape) return {};

    const { mount } = window.KinScapeBoard;
    // The primary Button, as the card of its component draws each look. The pressed look is the Button with its pressed
    // declarations written on the element: the exporter cannot read the matrix() of a pressed Button.
    const look = (name, extra) => `<span style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-8)"><x-import component-from-global-scope="KinScape.Button" variant="primary"${extra}>Add a pin</x-import><x-import component-from-global-scope="KinScape.Text" variant="caption" as="span">${name}</x-import></span>`;

    return {
      looks: mount(`<div style="display: flex; justify-content: space-between; padding: var(--space-16) var(--space-20)">${look('Default', '')}${look('Hover', ' state="hover"')}${look('Focus', ' state="focus"')}${look('Pressed', ' style="transform: translateY(1px); background: var(--brand-pressed)"')}</div>`)
    };
  }
}
</script>
</body>
</html>
