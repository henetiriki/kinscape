<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Draft, Pin popup, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<script src="./board-helpers.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 360px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">
<div style="padding: 24px 16px 0"><x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Pin popup as a sheet on a phone</x-import></div>
<section aria-label="Pin details" style="position: absolute; left: 0; right: 0; bottom: 0; height: 296px; box-sizing: border-box; padding: 8px 16px 20px; background: var(--surface); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); display: flex; flex-direction: column; gap: var(--space-12)">
  <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong)"></span>
  <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-8)"><div style="display: flex; flex-direction: column; gap: var(--space-4)"><span style="display: flex; align-items: center; gap: var(--space-8); color: var(--pin); font-size: 16px"><x-import component-from-global-scope="KinScape.EventGlyph" event="residence"></x-import><x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Residence</x-import></span><x-import component-from-global-scope="KinScape.Text" variant="h3" as="span">Example Person</x-import></div><x-import component-from-global-scope="KinScape.IconButton" label="Close" style="margin: -8px -8px 0 0"><x-import component-from-global-scope="KinScape.Icon" name="close" size="20"></x-import></x-import></div><div style="display: flex; flex-direction: column; gap: 2px"><x-import component-from-global-scope="KinScape.Text" variant="title" as="span">From 1890 to 1905</x-import><x-import component-from-global-scope="KinScape.Text" variant="mono" as="span">FROM 1890 TO 1905</x-import></div><div style="display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-12); border-radius: var(--radius-control); background: var(--surface-2)"><x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Address as recorded</x-import><x-import component-from-global-scope="KinScape.Text" variant="body" as="span">Farm Example, district Example</x-import></div>
  <p style="margin: auto 0 0; font-size: 12.5px; color: var(--ink-3)">Look-up only on a phone. Add people and pins on a tablet or computer.</p>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
