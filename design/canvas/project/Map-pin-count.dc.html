<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Map, count marker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<script src="./board-helpers.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--map-sea); font-family: var(--font-body); color: var(--ink)">
  <x-import component-from-global-scope="KinScape.MapLayout" children="{{map}}" search="{{search}}" account="{{account}}" zoom="{{zoom}}" panel="{{panel}}" dock="{{dock}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["count","fan","popup","loading","failed"],"default":"count"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const React = window.React;
    const K = window.KinScape;

    if (!React || !K) return {};

    const h = React.createElement;
    const { drawn, mount } = window.KinScapeBoard;
    const noop = () => {};
    const variant = this.props.variant ?? 'count';
    // Example Farm, in board pixels. The board places the marker, the fan and the popup from this point.
    const P = { x: 940, y: 400 };
    const TEXT = (variant, text, as) => `<x-import component-from-global-scope="KinScape.Text" variant="${variant}" as="${as || 'span'}">${text}</x-import>`;
    const BUTTON = (text, kind, extra) => `<x-import component-from-global-scope="KinScape.Button" variant="${kind}"${extra || ''}>${text}</x-import>`;

    // The count marker, drawn by KinScape.CountMarker on its 44px target. A look of the card is its `state`: pressed is "active".
    const marker = (look, place) => {
      const props = look === "selected" ? ' selected="true"' : look === "default" ? "" : ` state="${look === "pressed" ? "active" : look}"`;
      const tag = `<x-import component-from-global-scope="KinScape.CountMarker" count="3"${props}></x-import>`;
      return place ? `<div style="position: absolute; left: ${place.x - 22}px; top: ${place.y - 22}px">${tag}</div>` : tag;
    };

    // The Pin popup. Event type and the reading of the date come with the Pin on the map. The Person and the address load when the popup opens.
    // It sits 30px left of the Pin, not the 14px of layout.popup-gap: the Pin glyph is 22px wide, and the pointer must clear it.
    const bar = width => `<span aria-hidden="true" style="display: block; width: ${width}px; max-width: 100%; height: 20px; border-radius: var(--radius-small); background: var(--line)"></span>`;
    const popup = state => {
      const loaded = state === 'loaded';
      const failed = state === 'failed';
      const person = failed ? '' : loaded ? TEXT('h3', 'Example Person') : bar(168);
      const address = failed ? '' : [
        `<div style="display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-12); border-radius: var(--radius-control); background: var(--surface-2)">`,
        TEXT('overline', 'Address as recorded'),
        loaded ? TEXT('body', 'Farm Example, district Example') : bar(220),
        `</div>`
      ].join('');
      const alert = failed ? `<x-import component-from-global-scope="KinScape.Alert" tone="error" title="Couldn't load this Pin">The details didn't load.</x-import>` : '';
      const buttons = failed
        ? BUTTON('Try again', 'secondary')
        : `${BUTTON('Add a pin here', 'primary', loaded ? '' : ' disabled="true"')}${BUTTON('Edit', 'secondary', loaded ? '' : ' disabled="true"')}`;
      return [
        `<div role="dialog" aria-label="Pin details"${loaded ? '' : failed ? '' : ' aria-busy="true"'} style="position: absolute; left: ${P.x - 30 - 304}px; top: ${P.y - 114}px; width: 304px; box-sizing: border-box; background: var(--surface); border-radius: var(--radius-panel); box-shadow: var(--shadow-floating)">`,
        `<span aria-hidden="true" style="position: absolute; right: -8px; top: 106px; width: 16px; height: 16px; background: var(--surface); transform: rotate(45deg); border-radius: 2px"></span>`,
        `<div style="position: relative; padding: var(--space-16); display: flex; flex-direction: column; gap: var(--space-12)">`,
        `<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-8)">`,
        `<div style="display: flex; flex-direction: column; gap: var(--space-4)">`,
        `<span style="display: flex; align-items: center; gap: var(--space-8); color: var(--pin); font-size: 16px"><x-import component-from-global-scope="KinScape.EventGlyph" event="residence"></x-import>${TEXT('overline', 'Residence')}</span>`,
        person,
        `</div>`,
        `<x-import component-from-global-scope="KinScape.IconButton" label="Close" style="margin: -8px -8px 0 0"><x-import component-from-global-scope="KinScape.Icon" name="close" size="20"></x-import></x-import>`,
        `</div>`,
        `<div style="display: flex; flex-direction: column; gap: 2px">${TEXT('title', 'From 1890 to 1905')}${TEXT('mono', 'FROM 1890 TO 1905')}</div>`,
        address,
        alert,
        `<div style="display: flex; gap: var(--space-8)">${buttons}</div>`,
        `</div>`,
        `</div>`
      ].join('');
    };

    // A single Pin on the map, as the layer draws it: the glyph in --pin with a white halo.
    const pin = (x, y) => `<path transform="translate(${x - 11} ${y - 11}) scale(0.9167)" d="M6 18V6H18V18Z" fill="#9A3B12" stroke="#ffffff" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" paint-order="stroke"></path>`;
    const others = [pin(1150, 318), pin(1262, 566), pin(560, 250)].join('');
    const selected = `<circle cx="${P.x}" cy="${P.y}" r="16" fill="none" stroke="#264F29" stroke-width="2.5"></circle><circle cx="${P.x}" cy="${P.y}" r="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"></circle>`;

    // The fan, drawn by KinScape.PinFan around the marker: its rings, its lines and the Pins, the first below the Place. The pointer is on Birth.
    // The fan box is 78px from the Place to its edge: ring 1 of 56px and half a 44px target.
    const fan = h('div', { style: { position: 'absolute', left: P.x - 78, top: P.y - 78 } },
      h(K.PinFan, {
        looks: { birth: 'hover' },
        onOpen: noop,
        pins: [
          { event: 'marriage', id: 'marriage', reading: 'In 1899' },
          { event: 'residence', id: 'residence', reading: 'From 1890 to 1905' },
          { event: 'birth', id: 'birth', reading: 'In 1901' }
        ]
      }, h(K.CountMarker, { count: 3 })));

    let below = others;
    let above = '';

    if (variant === 'count') {
      const looks = [['default', 'Default'], ['hover', 'Hover'], ['focus', 'Focus'], ['pressed', 'Pressed'], ['selected', 'Selected']];
      above = [
        marker('default', P),
        `<section aria-label="Count marker looks" style="position: absolute; left: 400px; top: 130px; width: 400px; box-sizing: border-box; padding: var(--space-16); background: var(--surface); border-radius: var(--radius-panel); box-shadow: var(--shadow-raised); display: flex; flex-direction: column; gap: var(--space-12)">`,
        TEXT('overline', 'Count marker looks'),
        `<div style="display: flex; justify-content: space-between">`,
        ...looks.map(([look, name]) => `<span style="display: flex; flex-direction: column; align-items: center; gap: var(--space-4)"><span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: var(--radius-control); background: var(--map-land)">${marker(look)}</span>${TEXT('caption', name)}</span>`),
        `</div>`,
        TEXT('small', 'Accessible name: “3 Pins”.'),
        `</section>`
      ].join('');
    } else if (variant === 'fan') {
      above = '';
    } else {
      below += pin(P.x, P.y) + selected;
      above = popup(variant === 'popup' ? 'loaded' : variant);
    }

    const label = 'Map of South Africa on 1901 around Example Farm in the Orange Free State';
    const svg = `<svg viewBox="292.7 363.2 654.5 409.1" width="1440" height="900" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="${label}">
    <defs>
      <filter id="hsP" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="5" seed="11"></feTurbulence>
        <feDiffuseLighting surfaceScale="3" lighting-color="#ffffff" diffuseConstant="1.1"><feDistantLight azimuth="315" elevation="38"></feDistantLight></feDiffuseLighting>
      </filter>
      <pattern id="hatchP" patternUnits="userSpaceOnUse" width="4.1" height="4.1" patternTransform="rotate(45)"><rect width="1.4" height="4.1" fill="#8B4A1C" fill-opacity="0.34"></rect></pattern>
      <path id="rvp-vaal" d="M691 445 L714 429 L770 389 L808 381"></path>
      <path id="rvp-orange" d="M665 575 L706 608 L733 600 L772 611"></path>
    </defs>
    <rect x="200" y="300" width="800" height="560" fill="#C9D5D2"></rect>
    <path id="landP" d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699 L921 668 L945 645 L955 635 L969 614 L987 582 L999 562 L1018 534 L1037 507 L1052 498 L1071 473 L1082 426 L1097 382 L1098 348 L1082 328 L1102 294 L1144 270 L1197 246 L1228 210 L1234 150 L1228 96 L1218 54 L1202 0 L1202 -90 L63 -90 L63 0 L234 488 Z" fill="#E9EBE2"></path>
    <clipPath id="landClipP"><path d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699 L921 668 L945 645 L955 635 L969 614 L987 582 L999 562 L1018 534 L1037 507 L1052 498 L1071 473 L1082 426 L1097 382 L1098 348 L1082 328 L1102 294 L1144 270 L1197 246 L1228 210 L1234 150 L1228 96 L1218 54 L1202 0 L1202 -90 L63 -90 L63 0 L234 488 Z"></path></clipPath>
    <path d="M234 488 L283 495 L325 504 L368 507 L399 486 L420 474 L420 256 L441 306 L456 383 L515 372 L567 330 L620 306 L672 318 L714 312 L703 366 L690 414 L691 445 L694 472 L684 500 L634 547 L665 575 L706 608 L733 600 L772 611 L798 603 L808 600 L840 611 L877 594 L903 567 L924 594 L955 635 L945 645 L921 668 L892 699 L866 726 L835 751 L814 765 L782 786 L761 795 L722 798 L714 808 L682 809 L674 822 L640 817 L598 813 L580 815 L557 812 L532 821 L504 833 L478 834 L446 837 L420 860 Z" fill="#D3DCC4"></path>
    <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z" fill="#E3D2B2"></path>
    <path d="M691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L935 438 L1005 402 L1048 327 L1047 240 L1013 115 L756 255 L714 312 L703 366 L690 414 Z" fill="#D9CFBA"></path>
    <path d="M790 552 L811 531 L840 501 L872 484 L898 504 L916 534 L903 567 L877 594 L840 611 L808 600 L788 582 Z" fill="#D9CFD9"></path>
    <g fill="url(#hatchP)">
      <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z"></path>
      <path d="M691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L935 438 L1005 402 L1048 327 L1047 240 L1013 115 L756 255 L714 312 L703 366 L690 414 Z"></path>
    </g>
    <g clip-path="url(#landClipP)"><rect x="200" y="300" width="800" height="560" filter="url(#hsP)" style="mix-blend-mode: multiply" opacity="0.28"></rect></g>
    <path d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699" fill="none" stroke="#7E9A98" stroke-width="1" vector-effect="non-scaling-stroke"></path>
    <g fill="none" stroke="#6E99A3" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round">
      <path d="M887 516 L877 546 L861 576 L835 600 L798 603 L772 611 L733 600 L706 608 L665 575 L634 547 L625 514 L598 534 L564 550 L525 504"></path>
      <path d="M950 369 L929 381 L905 387 L872 378 L836 370 L808 381 L770 389 L714 429 L691 445 L662 483 L625 514"></path>
    </g>
    <g fill="none" stroke="#3B3A2F" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round">
      <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z"></path>
      <path d="M690 414 L703 366 L714 312"></path>
      <path d="M790 552 L811 531 L840 501 L872 484 L898 504 L916 534"></path>
    </g>
    <g font-family="Public Sans, sans-serif" stroke="#E9EBE2" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke">
      <g font-size="5" font-style="italic" fill="#3F646C">
        <text dy="-2"><textPath href="#rvp-vaal" startOffset="50%" text-anchor="middle">Vaal</textPath></text>
        <text dy="-2"><textPath href="#rvp-orange" startOffset="50%" text-anchor="middle">Orange</textPath></text>
      </g>
      <g fill="#2E2C22" font-weight="600" font-size="5.9" style="letter-spacing: 0.9px">
        <text x="800" y="452" text-anchor="middle">ORANGE FREE STATE</text>
        <text x="520" y="650" text-anchor="middle">CAPE COLONY</text>
      </g>
      <text x="852" y="576" text-anchor="middle" fill="#2E2C22" font-weight="600" font-size="5.2" style="letter-spacing: 0.7px">BASUTOLAND</text>
    </g>
    <g transform="translate(292.7 363.2) scale(${654.5 / 1440} ${409.1 / 900})">${below}</g>
  </svg>`;

    const rows = (items, size) => items.map(([id, name, description, checked]) => ({ checked, description, id, label: name, onChange: noop, size }));

    return {
      account: h(K.Avatar, { initial: 'R' }),
      dock: h(K.DateDock, {
        contestedCount: 2,
        contestedYears: [{ from: 1900, to: 1901 }],
        day: 91109,
        epochs: [1652, 1806, 1854, 1880, 1902, 1910, 1976, 1994].map(year => ({ year })).concat([{ label: 'Today', year: 2026 }]),
        lastDay: 136894,
        onChange: noop,
        onPlay: noop
      }),
      map: h(React.Fragment, null,
        drawn(svg),
        h('div', { style: { position: 'absolute', left: 0, top: 0, width: 1440, height: 900 } }, mount(above), variant === 'fan' ? fan : null)
      ),
      panel: h(K.Panel, {
        bodyId: 'map-panel-body',
        end: h(K.Legend),
        gap: 14,
        label: 'Layers and filters',
        onSelect: noop,
        selected: 'layers',
        tabs: [{ controls: 'map-panel-body', label: 'Layers', value: 'layers' }, { controls: 'map-panel-body', count: 1, label: 'Filters', value: 'filters' }]
      },
        h(K.LayerGroup, { heading: 'Boundaries', rows: rows([['polities', 'Polities', 'Colonies, republics, provinces, homelands', true], ['districts', 'Districts', 'Drostdy and magisterial districts', false]]) }),
        h(K.LayerGroup, { heading: 'Basemap', rows: rows([['names', 'Place names', 'As they were on the map date', true], ['rivers', 'Rivers', 'Many early borders follow them', true], ['terrain', 'Terrain', 'Hillshade, no modern borders', true]], 'm') }),
        h(K.LayerGroup, { heading: 'Pins', rows: rows([['pins', 'Pins', '8 of 214 true on this date', true], ['halos', 'Uncertainty halos', 'Grow with the date range', true]], 'm') })
      ),
      search: h(K.SearchBar, { form: 'bar' }),
      zoom: h(K.ZoomControls)
    };
  }
}
</script>
</body>
</html>
