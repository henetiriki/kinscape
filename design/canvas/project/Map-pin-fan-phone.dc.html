<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Map, phone, fanned Pins</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<script src="./board-helpers.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font:inherit}
/* The snapshot drops the bundle CSS, and the exporter cannot inline a ::placeholder rule, so the board sets it. */
input[aria-label="Search people and places"]::placeholder{color:#4A544C}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--map-sea); font-family: var(--font-body); color: var(--ink)">
  <x-import component-from-global-scope="KinScape.MapLayout" children="{{map}}" search="{{search}}" layers="{{layers}}" dock="{{dock}}"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["fan","popup"],"default":"fan"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const React = window.React;
    const K = window.KinScape;

    if (!React || !K) return { dock: null, layers: null, map: null, search: null };

    const h = React.createElement;
    const { drawn, mount } = window.KinScapeBoard;
    const noop = () => {};
    const variant = this.props.variant ?? 'fan';
    // Example Farm, in board pixels.
    const P = { x: 264, y: 310 };
    const TEXT = (kind, text) => `<x-import component-from-global-scope="KinScape.Text" variant="${kind}" as="span">${text}</x-import>`;

    // The count marker and the Pins of the fan. A phone shows the same looks as a desktop.
    const marker = (count, label, place) => [
      `<button type="button" aria-label="${label}" style="position: absolute; left: ${place.x - 22}px; top: ${place.y - 22}px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">`,
      `<span style="position: relative; width: 32px; height: 32px; box-sizing: border-box; border: 2px solid var(--white); border-radius: 16px; background: var(--pin); color: var(--white); display: flex; align-items: center; justify-content: center; font-family: var(--font-body); font-size: 14px; line-height: 1; font-weight: 600">${count}</span>`,
      `</button>`
    ].join('');
    const fanPin = (event, label, at) => [
      `<button type="button" aria-label="${label}" style="position: absolute; left: ${at.x - 22}px; top: ${at.y - 22}px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">`,
      `<span style="position: relative; width: 36px; height: 36px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-raised); color: var(--pin); font-size: 22px; display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="KinScape.EventGlyph" event="${event}"></x-import></span>`,
      `</button>`
    ].join('');

    const pin = (x, y) => `<path transform="translate(${x - 11} ${y - 11}) scale(0.9167)" d="M6 18V6H18V18Z" fill="#9A3B12" stroke="#ffffff" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linejoin="round" paint-order="stroke"></path>`;
    let below = pin(96, 300) + pin(345, 470);
    let above = '';

    if (variant === 'fan') {
      const R = 56;
      const around = deg => ({ x: Math.round(P.x + R * Math.cos(deg * Math.PI / 180)), y: Math.round(P.y + R * Math.sin(deg * Math.PI / 180)) });
      const fan = [['residence', 'Residence, 1890 to 1905', around(-150)], ['birth', 'Birth, 1901', around(-30)], ['marriage', 'Marriage, 1899', around(90)]];
      below += fan.map(([, , at]) => `<line x1="${P.x}" y1="${P.y}" x2="${at.x}" y2="${at.y}" stroke="#9A3B12" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"></line>`).join('');
      above = [marker(3, '3 Pins at Example Farm', P), ...fan.map(([event, label, at]) => fanPin(event, label, at))].join('');
    } else {
      below += pin(P.x, P.y) + `<circle cx="${P.x}" cy="${P.y}" r="16" fill="none" stroke="#264F29" stroke-width="2.5"></circle><circle cx="${P.x}" cy="${P.y}" r="20.5" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"></circle>`;
    }

    const svg = `<svg viewBox="531 323 279 603" width="390" height="844" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Map around Example Farm in the Orange Free State in 1901">
    <defs>
      <filter id="hsP" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="11"></feTurbulence>
        <feDiffuseLighting surfaceScale="3" lighting-color="#ffffff" diffuseConstant="1.1"><feDistantLight azimuth="315" elevation="38"></feDistantLight></feDiffuseLighting>
      </filter>
      <pattern id="hatchP" patternUnits="userSpaceOnUse" width="6.5" height="6.5" patternTransform="rotate(45)"><rect width="2.2" height="6.5" fill="#8B4A1C" fill-opacity="0.34"></rect></pattern>
      <path id="rvp-vaal" d="M691 445 L714 429 L770 389 L808 381"></path>
    </defs>
    <rect x="500" y="300" width="360" height="660" fill="#C9D5D2"></rect>
    <path id="landP" d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699 L921 668 L945 645 L955 635 L969 614 L987 582 L999 562 L1018 534 L1037 507 L1052 498 L1071 473 L1082 426 L1097 382 L1098 348 L1082 328 L1102 294 L1144 270 L1197 246 L1228 210 L1234 150 L1228 96 L1218 54 L1202 0 L1202 -90 L63 -90 L63 0 L234 488 Z" fill="#E9EBE2"></path>
    <clipPath id="landClipP"><path d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699 L921 668 L945 645 L955 635 L969 614 L987 582 L999 562 L1018 534 L1037 507 L1052 498 L1071 473 L1082 426 L1097 382 L1098 348 L1082 328 L1102 294 L1144 270 L1197 246 L1228 210 L1234 150 L1228 96 L1218 54 L1202 0 L1202 -90 L63 -90 L63 0 L234 488 Z"></path></clipPath>
    <path d="M234 488 L283 495 L325 504 L368 507 L399 486 L420 474 L420 256 L441 306 L456 383 L515 372 L567 330 L620 306 L672 318 L714 312 L703 366 L690 414 L691 445 L694 472 L684 500 L634 547 L665 575 L706 608 L733 600 L772 611 L798 603 L808 600 L840 611 L877 594 L903 567 L924 594 L955 635 L945 645 L921 668 L892 699 L866 726 L835 751 L814 765 L782 786 L761 795 L722 798 L714 808 L682 809 L674 822 L640 817 L598 813 L580 815 L557 812 L532 821 L504 833 L478 834 L446 837 L420 860 Z" fill="#D3DCC4"></path>
    <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z" fill="#E3D2B2"></path>
    <path d="M691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L935 438 L1005 402 L1048 327 L1047 240 L1013 115 L756 255 L714 312 L703 366 L690 414 Z" fill="#D9CFBA"></path>
    <path d="M790 552 L811 531 L840 501 L872 484 L898 504 L916 534 L903 567 L877 594 L840 611 L808 600 L788 582 Z" fill="#D9CFD9"></path>
    <g fill="url(#hatchP)">
      <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z"></path>
      <path d="M691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L935 438 L1005 402 L1048 327 L1047 240 L1013 115 L756 255 L714 312 L703 366 L690 414 Z"></path>
    </g>
    <g clip-path="url(#landClipP)"><rect x="500" y="300" width="360" height="660" filter="url(#hsP)" style="mix-blend-mode: multiply" opacity="0.28"></rect></g>
    <path d="M234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699" fill="none" stroke="#7E9A98" stroke-width="1" vector-effect="non-scaling-stroke"></path>
    <g fill="none" stroke="#6E99A3" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round">
      <path d="M887 516 L877 546 L861 576 L835 600 L798 603 L772 611 L733 600 L706 608 L665 575 L634 547 L625 514 L598 534 L564 550 L525 504"></path>
      <path d="M950 369 L929 381 L905 387 L872 378 L836 370 L808 381 L770 389 L714 429 L691 445 L662 483 L625 514"></path>
    </g>
    <g fill="none" stroke="#3B3A2F" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round">
      <path d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z"></path>
      <path d="M690 414 L703 366 L714 312"></path>
      <path d="M790 552 L811 531 L840 501 L872 484 L898 504 L916 534"></path>
    </g>
    <g font-family="Public Sans, sans-serif" stroke="#E9EBE2" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
      <g font-size="8" font-style="italic" fill="#3F646C">
        <text dy="-3"><textPath href="#rvp-vaal" startOffset="55%" text-anchor="middle">Vaal</textPath></text>
      </g>
      <g fill="#2E2C22" font-weight="600" font-size="8.6" style="letter-spacing: 1.2px">
        <text x="742" y="452" text-anchor="middle">ORANGE FREE STATE</text>
        <text x="585" y="600" text-anchor="middle">CAPE COLONY</text>
      </g>
      <text x="742" y="463" text-anchor="middle" fill="#6B3412" font-style="italic" font-size="7.9">contested · Orange River Colony</text>
    </g>
  </svg>`;
    const overlayBelow = `<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0; display: block" aria-hidden="true">${below}</svg>`;

    const STEP = 'width: 44px; height: 44px; border: 1px solid #C9CFC5; border-radius: 8px; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center';
    const LABEL = 'font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4A544C';
    const MONO = "font-family: 'JetBrains Mono', monospace; color: #4A544C";
    // The Pin popup as a sheet, like the look-up sheet of the Jurisdiction popup. It has no "Add a pin here" and no "Edit" (NFR-05).
    // The lines join with no space between them. A space between two tags makes a text node, and the sheet has no text node there.
    const sheet = mount([
      `<section aria-label="Map date and Pin details" style="position: absolute; left: 0; right: 0; bottom: 0; height: 432px; box-sizing: border-box; padding: 8px 16px 20px; background: #FFFFFF; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(24,33,27,0.16); display: flex; flex-direction: column; gap: 12px">`,
      `<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9CFC5"></span>`,
      `<div style="display: flex; align-items: center; gap: 6px">`,
      `<button type="button" aria-label="Back one year" style="${STEP}"><x-import component-from-global-scope="KinScape.Icon" name="back" size="16"></x-import></button>`,
      `<input aria-label="Map date" value="1901" readonly style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; text-align: center; border: 1px solid #C9CFC5; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: #18211B">`,
      `<button type="button" aria-label="Forward one year" style="${STEP}"><x-import component-from-global-scope="KinScape.Icon" name="forward" size="16"></x-import></button>`,
      `<button type="button" aria-label="Play through time" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #264F29; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: 4px"><x-import component-from-global-scope="KinScape.Icon" name="play" size="16"></x-import></button>`,
      `</div>`,
      `<div style="position: relative; height: 34px">`,
      `<span style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: #D6DAD2"></span>`,
      `<button type="button" aria-label="Map date slider, 1901" style="position: absolute; left: calc(66.4% - 13px); top: 1px; width: 26px; height: 26px; padding: 0; border-radius: 13px; border: 4px solid #FFFFFF; background: #264F29; box-shadow: 0 0 0 1px #264F29, 0 2px 6px rgba(24,33,27,0.3)"></button>`,
      `<span style="position: absolute; left: 0; top: 22px; font-size: 11px; ${MONO}">1652</span>`,
      `<span style="position: absolute; right: 0; top: 22px; font-size: 11px; ${MONO}">Today</span>`,
      `</div>`,
      `<div style="height: 1px; background: #E2E5DD"></div>`,
      `<div role="group" aria-label="Pin details" style="display: flex; flex-direction: column; gap: 12px">`,
      `<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">`,
      `<div style="display: flex; flex-direction: column; gap: 4px">`,
      `<span style="display: flex; align-items: center; gap: 8px; color: #9A3B12; font-size: 16px"><x-import component-from-global-scope="KinScape.EventGlyph" event="residence"></x-import>${TEXT('overline', 'Residence')}</span>`,
      TEXT('h3', 'Example Person'),
      `</div>`,
      `<x-import component-from-global-scope="KinScape.IconButton" label="Close" style="margin: -8px -8px 0 0"><x-import component-from-global-scope="KinScape.Icon" name="close" size="20"></x-import></x-import>`,
      `</div>`,
      `<div style="display: flex; flex-direction: column; gap: 2px">${TEXT('title', 'From 1890 to 1905')}${TEXT('mono', 'FROM 1890 TO 1905')}</div>`,
      `<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 8px; background: #F4F5F0">${TEXT('overline', 'Address as recorded')}${TEXT('body', 'Farm Example, district Example')}</div>`,
      `</div>`,
      `<p style="margin: auto 0 0; font-size: 12.5px; color: #4A544C">Look-up only on a phone. Add people and pins on a tablet or computer.</p>`,
      `</section>`
    ].join(''));

    // A Day counts days since 1652-01-01: 91109 is 1901-06-14 and 136894 is 2026-10-21.
    const collapsed = h(K.DateDock, { day: 91109, lastDay: 136894, onChange: noop, onPlay: noop, sheet: { expanded: false, onExpandedChange: noop } });

    return {
      dock: variant === 'popup' ? sheet : collapsed,
      layers: h(K.LayersButton),
      map: h(React.Fragment, null,
        drawn(svg),
        h('div', { style: { position: 'absolute', left: 0, top: 0, width: 390, height: 844 } }, drawn(overlayBelow), mount(above))
      ),
      search: h(K.SearchBar, { account: h(K.Avatar, { initial: 'R' }), form: 'pill' })
    };
  }
}
</script>
</body>
</html>
