<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — People</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">

  <x-import component-from-global-scope="KinScape.ColumnLayout" column="list" header="{{header}}">

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-24)">
        <div style="display: flex; flex-direction: column; gap: var(--space-4)">
          <x-import component-from-global-scope="KinScape.Text" variant="h1" as="h1">People</x-import>
          <sc-if value="{{showCount}}" hint-placeholder-val="{{ true }}">
            <x-import component-from-global-scope="KinScape.Text" variant="small" as="p" role="status">{{countText}}</x-import>
          </sc-if>
        </div>
        <x-import component-from-global-scope="KinScape.Button" variant="primary" href="Person-new.dc.html">Add a person</x-import>
      </div>

      <sc-if value="{{showFilter}}" hint-placeholder-val="{{ true }}">
        <div style="width: 480px"><x-import component-from-global-scope="KinScape.TextField" type="search" label="Find a person" helper="Matches given names, surnames, maiden names and spelling variants." shortcut="/" value="{{query}}" on-change="{{onQuery}}" disabled="{{filterOff}}"></x-import></div>
      </sc-if>

      <sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
        <section aria-label="People, by surname" style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); overflow: hidden">
          <div aria-hidden="true" style="display: grid; grid-template-columns: minmax(0, 1fr) 200px 72px max-content; gap: var(--space-16); padding: var(--space-12) var(--space-20); text-transform: uppercase; color: var(--ink-3)">
            <x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Name</x-import>
            <x-import component-from-global-scope="KinScape.Text" variant="overline" as="span">Dates</x-import>
            <span></span>
            <span class="link" style="padding-left: var(--space-20); text-transform: none; visibility: hidden">Relationships</span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0">
            <sc-for list="{{rows}}" as="p" hint-placeholder-count="8">
              <li style="border-top: 1px solid var(--line)">
                <x-import component-from-global-scope="KinScape.PersonRow" href="Person-edit.dc.html" relationships-href="Person-relationships.dc.html" surname="{{p.surname}}" given-names="{{p.givenNames}}" maiden-name="{{p.maidenName}}" matched-variant="{{p.matchedVariant}}" born="{{p.born}}" born-reading="{{p.bornReading}}" died="{{p.died}}" died-reading="{{p.diedReading}}" deceased="{{p.deceased}}"></x-import>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-if>

      <sc-if value="{{showNoMatch}}" hint-placeholder-val="{{ false }}">
        <div style="width: 420px; align-self: flex-start"><x-import component-from-global-scope="KinScape.NoticeCard" icon="search" title="{{noMatchTitle}}" actions="{{noMatchActions}}">Check the spelling, or add them with Add a person.</x-import></div>
      </sc-if>

      <sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; justify-content: center; padding-top: var(--space-64)"><x-import component-from-global-scope="KinScape.NoticeCard" size="large" icon="people" title="No people yet">Use Add a person to start your Tree. Once people are in it, you can pin their lives to the map.</x-import></div>
      </sc-if>

      <sc-if value="{{showFailed}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-16); width: 560px">
          <x-import component-from-global-scope="KinScape.Alert" tone="error" title="People didn't load">Check your connection, then try again. Nothing in your Tree has changed.</x-import>
          <x-import component-from-global-scope="KinScape.Button" variant="secondary" on-click="{{retry}}">Try again</x-import>
        </div>
      </sc-if>

  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["list","no-match","empty","failed"],"default":"list"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const v = (props && props.variant) || 'list';
    this.state = { view: v, query: v === 'no-match' ? 'Pretorius' : '' };
  }
  renderVals() {
    const PEOPLE = [
      { g: 'Hendrik Willem', s: 'Botha', m: '', v: ['Bota'], b: '1832', d: '1899' },
      { g: 'Susanna', s: 'Botha', m: 'Fourie', v: [], b: 'c. 1835', d: '1901' },
      { g: 'Hendrik Willem', s: 'du Toit', m: '', v: [], b: '1878', d: '1951' },
      { g: 'Maria Magdalena', s: 'du Toit', m: 'Rossouw', v: ['Du Toit', 'Dutoit', 'Du Tois'], b: 'c. 1856', d: '1930' },
      { g: 'Susanna', s: 'du Toit', m: '', v: [], b: '1881', d: '1948' },
      { g: 'Pieter', s: 'Fourie', m: '', v: ['Fouri'], b: 'bef. 1840', d: 'Deceased' },
      { g: 'Maria Elizabeth', s: 'Foury', m: '', v: ['Fourie'], b: '1858', d: '1933' },
      { g: 'Anna Catharina', s: 'le Roux', m: '', v: ['Leroux', 'Le Rous'], b: '1871', d: '1948' },
      { g: 'Cornelis Johannes', s: 'Nel', m: '', v: ['Nell'], b: '1868', d: 'aft. 1920' },
      { g: 'Johanna Petronella', s: 'Nel', m: '', v: [], b: 'c. 1828', d: '1901' },
      { g: 'Jacobus', s: 'Rossouw', m: '', v: [], b: '1822', d: '1889' },
      { g: 'Gerrit', s: 'van Wyk', m: '', v: ['Van Wijk', 'Vanwyk'], b: '1845', d: '1910' },
      { g: 'Cornelis', s: 'Visser', m: '', v: [], b: '1819', d: '1890' }
    ];
    const reading = (short) => {
      const parts = short.split('–');
      if (parts[1]) return 'Between ' + parts[0] + ' and ' + parts[1];
      if (short.indexOf('c. ') === 0) return 'About ' + short.slice(3);
      if (short.indexOf('bef. ') === 0) return 'Before ' + short.slice(5);
      if (short.indexOf('aft. ') === 0) return 'After ' + short.slice(5);
      return short && 'In ' + short;
    };
    const view = this.state.view;
    const cmp = (a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' });
    const all = view === 'empty' ? [] : PEOPLE.slice().sort((a, b) => cmp(a.s, b.s) || cmp(a.g, b.g));
    const q = this.state.query.trim().toLowerCase();
    const has = (t) => !!t && t.toLowerCase().indexOf(q) >= 0;
    const rows = [];
    all.forEach((p) => {
      let matchedVariant;
      if (q) {
        const byName = has(p.g) || has(p.s) || has(p.g + ' ' + p.s) || has(p.s + ', ' + p.g);
        const byMaiden = has(p.m);
        const variant = p.v.filter((x) => has(x))[0];
        if (!byName && !byMaiden && !variant) return;
        if (!byName && !byMaiden) matchedVariant = variant;
      }
      const dated = p.d !== '—' && p.d !== 'Deceased';
      rows.push({ surname: p.s, givenNames: p.g, maidenName: p.m || undefined, matchedVariant: matchedVariant, born: p.b, bornReading: reading(p.b), died: dated ? p.d : '', diedReading: dated ? reading(p.d) : '', deceased: p.d === 'Deceased' });
    });
    const failed = view === 'failed';
    return {
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      retry: () => this.setState({ view: 'list' }),
      rows: rows,
      showCount: !failed && all.length > 0,
      countText: q ? rows.length + ' of ' + all.length + ' people match' : all.length + ' people in this Tree, by surname',
      showFilter: view !== 'empty',
      filterOff: failed,
      showList: !failed && rows.length > 0,
      showNoMatch: !failed && all.length > 0 && rows.length === 0,
      noMatchTitle: 'No one matches “' + this.state.query.trim() + '”',
      noMatchActions: [{ label: 'Clear the filter', onClick: () => this.setState({ query: '' }) }],
      showEmpty: view === 'empty',
      showFailed: failed,
      header: (window.React && window.KinScape) ? window.React.createElement(window.KinScape.PageHeader, { backHref: 'Map.dc.html', backLabel: 'Map', avatar: window.React.createElement(window.KinScape.Menu, { email: 'researcher@example.com', initial: 'R', groups: [[{ icon: 'signOut', id: 'sign-out', label: 'Sign out' }]], onSelect: () => {} }) }) : null
    };
  }
}
</script>
</body>
</html>
