<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Edit people on a computer (phone)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 60px; box-sizing: border-box; padding: 0 var(--space-16); display: flex; align-items: center; gap: var(--space-8); background: var(--surface); border-bottom: 1px solid var(--line)">
    <x-import component-from-global-scope="KinScape.Wordmark" icon-only="{{ true }}" size="32"></x-import>
    <a href="People-list-phone.dc.html" class="control" style="height: 44px; display: inline-flex; align-items: center; gap: var(--space-8); padding: 0 var(--space-12) 0 var(--space-8); border-radius: var(--radius-control); color: var(--ink); text-decoration: none"><x-import component-from-global-scope="KinScape.Icon" name="back" size="16"></x-import>People</a>
    <span style="flex: 1"></span>
    <x-import component-from-global-scope="KinScape.Avatar" initial="L"></x-import>
  </header>

  <main style="position: absolute; left: 0; right: 0; top: 60px; bottom: 0; box-sizing: border-box; padding: var(--space-64) var(--space-16) 0; display: flex; flex-direction: column; align-items: center">
    <x-import component-from-global-scope="KinScape.NoticeCard" phone="{{ true }}" title="Edit people on a computer" actions="{{actions}}">People are added and edited on a larger screen. On a phone you can look them up.</x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { actions: [{ label: 'See all people' }] };
  }
}
</script>
</body>
</html>
