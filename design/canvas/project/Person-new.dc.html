<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KinScape — Add a person</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/kinscape/components/bundle.css">
<script src="ds/kinscape/components/bundle.js"></script>
<link rel="stylesheet" href="ds/kinscape/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: var(--surface-2); font-family: var(--font-body); color: var(--ink)">

  <x-import component-from-global-scope="KinScape.PageHeader" back-href="People-list.dc.html" back-label="People" avatar="{{avatar}}"></x-import>

  <main style="position: absolute; left: 0; right: 0; top: 64px; bottom: 72px; overflow-y: auto">
    <div style="width: 1088px; margin: 0 auto; padding: var(--space-20) 0 var(--space-24); display: flex; flex-direction: column; gap: var(--space-16)">

      <div style="display: flex; flex-direction: column; gap: var(--space-4)">
        <x-import component-from-global-scope="KinScape.Text" variant="h1" as="h1">{{title}}</x-import>
        <x-import component-from-global-scope="KinScape.Text" variant="small" as="p">Given names and surname are required. Everything else can wait.</x-import>
      </div>

      <sc-if value="{{showSummary}}" hint-placeholder-val="{{ false }}">
        <div style="width: 640px"><x-import component-from-global-scope="KinScape.Alert" tone="error" title="{{summaryTitle}}">Nothing was saved. Each problem is marked at its field.</x-import></div>
      </sc-if>

      <sc-if value="{{showConflict}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: var(--space-12)">
          <div style="width: 640px"><x-import component-from-global-scope="KinScape.Alert" tone="error" title="This person changed while you were editing">Nothing was saved. Reload to see the latest version, then make your changes again.</x-import></div>
          <x-import component-from-global-scope="KinScape.Button" variant="secondary" on-click="{{reload}}">Reload</x-import>
        </div>
      </sc-if>

      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-panel); padding: var(--space-24); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); column-gap: var(--space-40); row-gap: var(--space-16)">

        <div role="group" aria-labelledby="p-group-name" style="grid-column: 1; grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; align-items: start; min-width: 0">
            <x-import component-from-global-scope="KinScape.Text" variant="title" as="span" id="p-group-name">Name</x-import>
            <x-import component-from-global-scope="KinScape.TextField" label="Given names" aria-required="true" autocomplete="off" value="{{given}}" error="{{givenErr}}" on-change="{{onGiven}}" on-blur="{{blurGiven}}"></x-import>
            <x-import component-from-global-scope="KinScape.TextField" label="Surname" aria-required="true" autocomplete="off" value="{{surname}}" error="{{surnameErr}}" on-change="{{onSurname}}" on-blur="{{blurSurname}}"></x-import>
            <x-import component-from-global-scope="KinScape.TextField" label="Maiden name" helper="Surname at birth, if it changed." autocomplete="off" value="{{maiden}}" on-change="{{onMaiden}}"></x-import>
            <x-import component-from-global-scope="KinScape.TokenField" label="Spelling variants" helper="Other spellings in the records, up to 20. Press Enter after each." placeholder="Add a spelling" default-values="{{variants}}"></x-import>
        </div>

        <div role="group" aria-labelledby="p-group-life" style="grid-column: 2; grid-row: 1 / span 5; display: grid; grid-template-rows: subgrid; align-items: start; min-width: 0">
            <x-import component-from-global-scope="KinScape.Text" variant="title" as="span" id="p-group-life">Life</x-import>
            <x-import component-from-global-scope="KinScape.SelectField" label="Sex" options="{{sexOptions}}" default-value="{{sex}}" on-change="{{onSex}}"></x-import>

            <x-import component-from-global-scope="KinScape.FuzzyDateField" label="Birth" helper="For example 1850, ABT 1850 or BET 1850 AND 1855." default-value="{{birthStart}}" autocomplete="off" spell-check="false" on-input="{{onBirth}}"></x-import>
            <x-import component-from-global-scope="KinScape.FuzzyDateField" label="Death" helper="Leave it empty if you don't know." default-value="{{deathStart}}" autocomplete="off" spell-check="false" on-input="{{onDeath}}"></x-import>

            <x-import component-from-global-scope="KinScape.CheckboxField" label="Deceased" description="{{deceasedNote}}" checked="{{deceased}}" disabled="{{deceasedLocked}}" on-change="{{toggleDeceased}}"></x-import>
        </div>

        <div style="grid-column: 3; grid-row: 2 / span 4; display: flex; flex-direction: column; gap: var(--space-8); min-width: 0">
          <x-import component-from-global-scope="KinScape.TextAreaField" label="Notes" helper="Sources, stories, anything the fields can't hold." value="{{notes}}" on-change="{{onNotes}}"></x-import>
        </div>

      </div>
    </div>
  </main>

  <x-import component-from-global-scope="KinScape.ActionBar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; contain: layout">
    <x-import component-from-global-scope="KinScape.Button" variant="primary" on-click="{{save}}">Save</x-import>
    <x-import component-from-global-scope="KinScape.Button" variant="secondary" href="People-list.dc.html">Cancel</x-import>
  </x-import>

  <sc-if value="{{showToast}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%)"><x-import component-from-global-scope="KinScape.Toast" tone="{{toast.tone}}" action="{{toast.action}}" on-action="{{toast.onAction}}" on-dismiss="{{toast.onDismiss}}">{{toast.text}}</x-import></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["new","edit","errors","save-failed","conflict"],"default":"new"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const v = (props && props.variant) || 'new';
    const filled = {
      given: 'Maria Magdalena', surname: 'du Toit', maiden: 'Rossouw', variants: ['Du Toit', 'Dutoit', 'Du Tois'],
      sex: 'female', birth: 'ABT 1856', death: '14 MAR 1930', deceased: true,
      notes: 'Her baptism record spells the family name Rossau.'
    };
    const blank = { given: '', surname: '', maiden: '', variants: [], sex: 'unknown', birth: '', death: '', deceased: false, notes: '' };
    const b = (v === 'edit' || v === 'save-failed' || v === 'conflict') ? filled : blank;
    const st = {
      given: b.given, surname: b.surname, maiden: b.maiden, variants: b.variants, sex: b.sex, deceased: b.deceased, notes: b.notes,
      birth: b.birth, death: b.death, birthErr: false, deathErr: false,
      givenErr: '', surnameErr: '', givenDirty: false, surnameDirty: false, summary: false,
      toast: v === 'save-failed' ? 'failed' : '',
      conflict: v === 'conflict'
    };
    if (v === 'errors') {
      st.birth = 'ABT 1850';
      st.death = '31 FEB 1850';
      st.deathErr = !!this.parseDate(st.death).error;
      st.givenErr = 'Enter the given names.';
      st.surnameErr = 'Enter the surname.';
      st.summary = true;
    }
    if (v === 'conflict') {
      st.notes = 'Her baptism record spells the family name Rossau. Six children are named in the family Bible.';
    }
    this.state = st;
    // The fields take these once; after that each keeps its own text.
    this.start = { birth: st.birth, death: st.death };
    this.variant = v;
  }

  parseDate(raw) {
    const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const NAME = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const FORMAT = 'Use a date like 1850, 14 MAR 1850, ABT 1850 or BET 1850 AND 1855.';
    const s = String(raw || '').trim().toUpperCase().replace(/\s+/g, ' ');
    if (!s) return { empty: true };
    const one = (t) => {
      const p = t.split(' ');
      let d = 0;
      let m = 0;
      let y = 0;
      if (p.length === 1 && /^\d{1,4}$/.test(p[0])) { y = +p[0]; }
      else if (p.length === 2 && MON.indexOf(p[0]) >= 0 && /^\d{1,4}$/.test(p[1])) { m = MON.indexOf(p[0]) + 1; y = +p[1]; }
      else if (p.length === 3 && /^\d{1,2}$/.test(p[0]) && MON.indexOf(p[1]) >= 0 && /^\d{1,4}$/.test(p[2])) { d = +p[0]; m = MON.indexOf(p[1]) + 1; y = +p[2]; }
      else return { error: FORMAT };
      if (y < 1000 || y > 2999) return { error: 'Use a year from 1000 to 2999.' };
      if (d) {
        const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
        const days = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
        if (d < 1 || d > days) return { error: NAME[m - 1] + ' ' + y + ' has ' + days + ' days.' };
      }
      return { words: (d ? d + ' ' : '') + (m ? NAME[m - 1] + ' ' : '') + y, key: y * 10000 + m * 100 + d, day: !!d, text: t };
    };
    let mm = s.match(/^(BET) (.+) AND (.+)$/) || s.match(/^(FROM) (.+) TO (.+)$/);
    if (mm) {
      const a = one(mm[2]);
      const z = one(mm[3]);
      if (a.error) return a;
      if (z.error) return z;
      const join = mm[1] === 'BET' ? 'AND' : 'TO';
      if (a.key > z.key) return { error: 'Put the earlier date first: ' + mm[1] + ' ' + z.text + ' ' + join + ' ' + a.text + '.' };
      return { reading: (mm[1] === 'BET' ? 'Between ' : 'From ') + a.words + (mm[1] === 'BET' ? ' and ' : ' to ') + z.words };
    }
    mm = s.match(/^(ABT|BEF|AFT|EST|CAL) (.+)$/);
    if (mm) {
      const a = one(mm[2]);
      if (a.error) return a;
      const lead = { ABT: 'About ', BEF: 'Before ', AFT: 'After ', EST: 'Estimated as ', CAL: 'Calculated as ' }[mm[1]];
      return { reading: lead + a.words };
    }
    const a = one(s);
    if (a.error) return a;
    return { reading: (a.day ? 'On ' : 'In ') + a.words };
  }

  renderVals() {
    const s = this.state;
    const deathTyped = s.death.trim() !== '';
    const errCount = [s.givenErr, s.surnameErr, s.birthErr, s.deathErr].filter(Boolean).length;
    const fullName = (s.given.trim() + ' ' + s.surname.trim()).trim();
    const isEdit = this.variant === 'edit' || this.variant === 'save-failed' || this.variant === 'conflict';
    const toasts = {
      failed: { tone: 'error', text: "Couldn't save. Your changes are still here.", action: 'Try again', onAction: () => this.setState({ toast: 'saved' }), onDismiss: () => this.setState({ toast: '' }) },
      saved: { tone: 'success', text: 'Saved ' + (fullName || 'the person') + '.', action: undefined, onAction: undefined, onDismiss: () => this.setState({ toast: '' }) }
    };
    return {
      avatar: (window.React && window.KinScape) ? window.React.createElement(window.KinScape.Avatar, { initial: 'L' }) : null,
      title: isEdit ? 'Edit ' + fullName : 'Add a person',
      showSummary: s.summary && errCount > 0,
      showConflict: !!s.conflict,
      reload: () => this.setState({ conflict: false, notes: 'Her baptism record spells the family name Rossau.', toast: '' }),
      summaryTitle: errCount === 1 ? '1 field needs fixing' : errCount + ' fields need fixing',
      given: s.given, surname: s.surname, maiden: s.maiden, notes: s.notes, sex: s.sex, variants: s.variants,
      givenErr: s.givenErr || undefined,
      surnameErr: s.surnameErr || undefined,
      onGiven: (e) => this.setState({ given: e.target.value, givenDirty: true }),
      onSurname: (e) => this.setState({ surname: e.target.value, surnameDirty: true }),
      blurGiven: () => this.setState((x) => ({ givenErr: x.given.trim() ? '' : (x.givenDirty || x.givenErr ? 'Enter the given names.' : '') })),
      blurSurname: () => this.setState((x) => ({ surnameErr: x.surname.trim() ? '' : (x.surnameDirty || x.surnameErr ? 'Enter the surname.' : '') })),
      onMaiden: (e) => this.setState({ maiden: e.target.value }),
      onNotes: (e) => this.setState({ notes: e.target.value }),
      onSex: (e) => this.setState({ sex: e.target.value }),
      sexOptions: [{ label: 'Male', value: 'male' }, { label: 'Female', value: 'female' }, { label: 'Intersex', value: 'intersex' }, { label: 'Unknown', value: 'unknown' }],
      birthStart: this.start.birth,
      deathStart: this.start.death,
      onBirth: (e) => this.setState({ birth: e.target.value }),
      onDeath: (e) => this.setState({ death: e.target.value }),
      deceased: s.deceased || deathTyped,
      deceasedLocked: deathTyped,
      deceasedFree: !deathTyped,
      deceasedNote: deathTyped ? 'Ticked because a death date is entered.' : "Tick if this person has died but the date isn't known.",
      toggleDeceased: () => this.setState((x) => ({ deceased: !x.deceased })),
      save: () => {
        const x = this.state;
        if (x.conflict) {
          return;
        }
        const ge = x.given.trim() ? '' : 'Enter the given names.';
        const se = x.surname.trim() ? '' : 'Enter the surname.';
        const be = this.parseDate(x.birth).error || '';
        const de = this.parseDate(x.death).error || '';
        const n = [ge, se, be, de].filter(Boolean).length;
        this.setState({ givenErr: ge, surnameErr: se, birthErr: !!be, deathErr: !!de, summary: n > 0, toast: n > 0 ? '' : 'saved' });
      },
      showToast: !!s.toast,
      toast: toasts[s.toast] || toasts.saved
    };
  }
}
</script>
</body>
</html>
