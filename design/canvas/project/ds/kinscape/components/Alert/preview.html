<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["Alert"];
  var handlers = [];
  var states = [{"children":"Something happened.","label":"Alert · error","props":{"title":"Title","tone":"error"}},{"children":"Something happened.","label":"Alert · info","props":{"title":"Title","tone":"info"}},{"children":"Something happened.","label":"Alert · success","props":{"title":"Title","tone":"success"}},{"children":"Something happened.","label":"Alert · warning","props":{"title":"Title","tone":"warning"}}];
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    handlers.forEach(function (handler) { props[handler] = noop; });
    var control = state.children === undefined ? h(Control, props) : h(Control, props, state.children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label' }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
