<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["Checkbox"];
  var handlers = [];
  var states = [{"label":"Checkbox off · default","props":{"aria-label":"Deceased","defaultChecked":false,"disabled":false}},{"label":"Checkbox off · active","props":{"aria-label":"Deceased","defaultChecked":false,"disabled":false,"state":"active"}},{"label":"Checkbox off · focus","props":{"aria-label":"Deceased","defaultChecked":false,"disabled":false,"state":"focus"}},{"label":"Checkbox off · hover","props":{"aria-label":"Deceased","defaultChecked":false,"disabled":false,"state":"hover"}},{"label":"Checkbox off · disabled","props":{"aria-label":"Deceased","defaultChecked":false,"disabled":true}},{"label":"Checkbox on · default","props":{"aria-label":"Deceased","defaultChecked":true,"disabled":false}},{"label":"Checkbox on · active","props":{"aria-label":"Deceased","defaultChecked":true,"disabled":false,"state":"active"}},{"label":"Checkbox on · focus","props":{"aria-label":"Deceased","defaultChecked":true,"disabled":false,"state":"focus"}},{"label":"Checkbox on · hover","props":{"aria-label":"Deceased","defaultChecked":true,"disabled":false,"state":"hover"}},{"label":"Checkbox on · disabled","props":{"aria-label":"Deceased","defaultChecked":true,"disabled":true}}];
