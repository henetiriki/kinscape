<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["Chip"];
  var handlers = [];
  var states = [{"label":"Chip · default","children":"Birth","props":{"disabled":false,"glyph":"birth","on":true}},{"label":"Chip · active","children":"Birth","props":{"disabled":false,"glyph":"birth","on":true,"state":"active"}},{"label":"Chip · focus","children":"Birth","props":{"disabled":false,"glyph":"birth","on":true,"state":"focus"}},{"label":"Chip · hover","children":"Birth","props":{"disabled":false,"glyph":"birth","on":true,"state":"hover"}},{"label":"Chip · disabled","children":"Birth","props":{"disabled":true,"glyph":"birth","on":true}},{"label":"Chip off · default","children":"Death","props":{"disabled":false,"glyph":"death","on":false}},{"label":"Chip off · active","children":"Death","props":{"disabled":false,"glyph":"death","on":false,"state":"active"}},{"label":"Chip off · focus","children":"Death","props":{"disabled":false,"glyph":"death","on":false,"state":"focus"}},{"label":"Chip off · hover","children":"Death","props":{"disabled":false,"glyph":"death","on":false,"state":"hover"}},{"label":"Chip off · disabled","children":"Death","props":{"disabled":true,"glyph":"death","on":false}}];
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    handlers.forEach(function (handler) { props[handler] = noop; });
    var control = state.children === undefined ? h(Control, props) : h(Control, props, state.children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label' }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
