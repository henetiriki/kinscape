<!-- @dsCard group="Map" height=480 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; width: var(--size-panel); }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["FilterFields"];
  var handlers = ["onBranchChange","onEventToggle","onPersonChange","onSurnamesChange"];
  var states = [{"label":"FilterFields · empty","props":{"branch":"","branches":[{"label":"Everyone","value":""},{"label":"Ancestors of…","value":"ancestors"},{"label":"Descendants of…","value":"descendants"}],"events":[],"eventTypes":[{"glyph":"birth","label":"Birth","value":"birth"},{"glyph":"baptism","label":"Baptism","value":"baptism"},{"glyph":"residence","label":"Residence","value":"residence"},{"glyph":"marriage","label":"Marriage","value":"marriage"},{"glyph":"divorce","label":"Divorce","value":"divorce"},{"glyph":"death","label":"Death","value":"death"},{"glyph":"burial","label":"Burial","value":"burial"},{"glyph":"land","label":"Land","value":"land"},{"glyph":"occupation","label":"Occupation","value":"occupation"},{"glyph":"other","label":"Other","value":"other"}],"people":[{"label":"Anyone","value":""}],"person":"","surnames":[]}},{"label":"FilterFields · with values","props":{"branch":"ancestors","branches":[{"label":"Everyone","value":""},{"label":"Ancestors of…","value":"ancestors"},{"label":"Descendants of…","value":"descendants"}],"events":["birth","marriage"],"eventTypes":[{"glyph":"birth","label":"Birth","value":"birth"},{"glyph":"baptism","label":"Baptism","value":"baptism"},{"glyph":"residence","label":"Residence","value":"residence"},{"glyph":"marriage","label":"Marriage","value":"marriage"},{"glyph":"divorce","label":"Divorce","value":"divorce"},{"glyph":"death","label":"Death","value":"death"},{"glyph":"burial","label":"Burial","value":"burial"},{"glyph":"land","label":"Land","value":"land"},{"glyph":"occupation","label":"Occupation","value":"occupation"},{"glyph":"other","label":"Other","value":"other"}],"people":[{"label":"Anyone","value":""},{"label":"J. Rossouw","value":"p1"}],"person":"p1","surnames":["Rossouw"],"surnameHelper":"Matches spelling variants too (Rossouw, Rossau)"}}];
  var give = function (props, names) {
    names.forEach(function (name) {
      var at = name.indexOf('.');
      if (at < 0) { props[name] = noop; return; }
      var prop = name.slice(0, at);
      var key = name.slice(at + 1);
      var withKey = function (item) {
        var copy = Object.assign({}, item);
        copy[key] = noop;
        return copy;
      };
      if (props[prop] === undefined) return;
      props[prop] = Array.isArray(props[prop]) ? props[prop].map(withKey) : withKey(props[prop]);
    });
  };
  var make = function (slot, key) {
    var props = Object.assign({ key: key }, slot.props);
    give(props, slot.handlers || []);
    var part = window.KinScape[slot.control];
    return slot.children === undefined ? h(part, props) : h(part, props, slot.children);
  };
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    give(props, handlers);
    Object.keys(state.slots || {}).forEach(function (name) { props[name] = make(state.slots[name], name); });
    var children = Array.isArray(state.children) ? state.children.map(make) : state.children;
    var control = children === undefined ? h(Control, props) : h(Control, props, children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label', id: 'ks-case-' + index }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
