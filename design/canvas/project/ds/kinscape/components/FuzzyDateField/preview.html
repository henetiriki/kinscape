<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["FuzzyDateField"];
  var handlers = [];
  var states = [{"label":"FuzzyDateField · empty","props":{"helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · typing","props":{"defaultValue":"BET 1850 AND 18","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born","state":"focus"}},{"label":"FuzzyDateField · readable","props":{"defaultValue":"BET 1850 AND 1855","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · focus","props":{"helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born","state":"focus"}},{"label":"FuzzyDateField · error","props":{"defaultValue":"31 FEB 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · disabled","props":{"disabled":true,"helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · exact","props":{"defaultValue":"14 MAR 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · about","props":{"defaultValue":"ABT 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · before","props":{"defaultValue":"BEF 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · after","props":{"defaultValue":"AFT 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · period","props":{"defaultValue":"FROM 1850 TO 1855","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · estimated","props":{"defaultValue":"EST 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · calculated","props":{"defaultValue":"CAL 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · error, wrong format","props":{"defaultValue":"14/03/1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · error, year out of range","props":{"defaultValue":"ABT 850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}},{"label":"FuzzyDateField · error, range in reverse","props":{"defaultValue":"BET 1855 AND 1850","helper":"For example 1850, ABT 1850 or BET 1850 AND 1855.","label":"Born"}}];
  var give = function (props, names) {
    names.forEach(function (name) {
      var at = name.indexOf('.');
      if (at < 0) { props[name] = noop; return; }
      var prop = name.slice(0, at);
      var key = name.slice(at + 1);
      var withKey = function (item) {
        var copy = Object.assign({}, item);
        copy[key] = noop;
        return copy;
      };
      if (props[prop] === undefined) return;
      props[prop] = Array.isArray(props[prop]) ? props[prop].map(withKey) : withKey(props[prop]);
    });
  };
  var make = function (slot, key) {
    var props = Object.assign({ key: key }, slot.props);
    give(props, slot.handlers || []);
    var part = window.KinScape[slot.control];
    return slot.children === undefined ? h(part, props) : h(part, props, slot.children);
  };
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    give(props, handlers);
    Object.keys(state.slots || {}).forEach(function (name) { props[name] = make(state.slots[name], name); });
    var children = Array.isArray(state.children) ? state.children.map(make) : state.children;
    var control = children === undefined ? h(Control, props) : h(Control, props, children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label', id: 'ks-case-' + index }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
