<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; contain: layout; width: 100%; }
.ks-label { color: var(--ink-3); }
.ks-case[data-form='running'] { display: block; }
.ks-case[data-form='running'] > .ks-label { display: block; margin-bottom: 8px; }
.ks-case > :last-child { height: 480px; min-height: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["MapLayout"];
  var handlers = [];
  var states = [{"children":[{"children":"The map","control":"Text","props":{"variant":"small"}}],"label":"MapLayout · text in each slot","props":{},"slots":{"search":{"children":"search","control":"Text","props":{"variant":"small"}},"action":{"children":"action","control":"Text","props":{"variant":"small"}},"account":{"children":"account","control":"Text","props":{"variant":"small"}},"zoom":{"children":"zoom","control":"Text","props":{"variant":"small"}},"layers":{"children":"layers","control":"Text","props":{"variant":"small"}},"panel":{"children":"panel","control":"Text","props":{"variant":"small"}},"dock":{"children":"dock","control":"Text","props":{"variant":"small"}},"credits":{"children":"credits","control":"Text","props":{"variant":"small"}},"overlay":{"children":"overlay","control":"Text","props":{"variant":"small"}}}}];
  var give = function (props, names) {
    names.forEach(function (name) {
      var at = name.indexOf('.');
      if (at < 0) { props[name] = noop; return; }
      var prop = name.slice(0, at);
      var key = name.slice(at + 1);
      var withKey = function (item) {
        var copy = Object.assign({}, item);
        copy[key] = noop;
        return copy;
      };
      if (props[prop] === undefined) return;
      props[prop] = Array.isArray(props[prop]) ? props[prop].map(withKey) : withKey(props[prop]);
    });
  };
  var make = function (slot, key) {
    var props = Object.assign({ key: key }, slot.props);
    give(props, slot.handlers || []);
    var part = window.KinScape[slot.control];
    return slot.children === undefined ? h(part, props) : h(part, props, slot.children);
  };
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    give(props, handlers);
    Object.keys(state.slots || {}).forEach(function (name) { props[name] = make(state.slots[name], name); });
    var children = Array.isArray(state.children) ? state.children.map(make) : state.children;
    var control = children === undefined ? h(Control, props) : h(Control, props, children);
    return h('figure', Object.assign({ className: 'ks-case', key: index }, state.form ? { 'data-form': state.form.name, style: { width: state.form.box } } : {}), h('figcaption', { className: 'small ks-label', id: 'ks-case-' + index }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
