<!-- @dsCard group="Feedback" height=580 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["NoticeCard"];
  var handlers = [];
  var states = [{"children":"The 1910 provinces are off.","label":"NoticeCard · one action","props":{"actions":[{"label":"Undo"}],"icon":"info","title":"Layer hidden"}},{"children":"Check your connection.","label":"NoticeCard · two actions","props":{"actions":[{"label":"Retry"},{"label":"Dismiss"}],"icon":"warning","title":"Map not loaded"}},{"children":"1910 of 1994.","label":"NoticeCard · loading","props":{"progress":40,"title":"Loading boundaries"}},{"children":"Add a Person to see them on the map.","label":"NoticeCard · large","props":{"icon":"info","size":"large","title":"No ancestors yet"}},{"children":"The 1910 provinces are off.","label":"NoticeCard · phone","props":{"actions":[{"label":"Undo"}],"icon":"info","phone":true,"title":"Layer hidden"}}];
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    handlers.forEach(function (handler) { props[handler] = noop; });
    var control = state.children === undefined ? h(Control, props) : h(Control, props, state.children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label', id: 'ks-case-' + index }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
