<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
body { margin: 0; padding: 16px; font-family: var(--font-body); }
#root { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }
.ks-case { margin: 0; display: flex; flex-direction: column; gap: 8px; padding: 0px 0; width: var(--size-panel); }
.ks-label { color: var(--ink-3); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["Panel"];
  var handlers = ["onSelect"];
  var states = [{"children":[{"control":"LayerGroup","handlers":["rows.onChange"],"props":{"heading":"Boundaries","rows":[{"checked":true,"description":"Colonies, republics, provinces, homelands","id":"polities","label":"Polities"},{"checked":false,"description":"Drostdy and magisterial districts","id":"districts","label":"Districts"}]}},{"control":"LayerGroup","handlers":["rows.onChange"],"props":{"heading":"Basemap","rows":[{"checked":true,"description":"As they were on the map date","id":"names","label":"Place names","size":"m"},{"checked":true,"description":"Many early borders follow them","id":"rivers","label":"Rivers","size":"m"},{"checked":true,"description":"Hillshade, no modern borders","id":"terrain","label":"Terrain","size":"m"}]}},{"control":"LayerGroup","handlers":["rows.onChange"],"props":{"heading":"Pins","rows":[{"checked":true,"description":"8 of 214 true on this date","id":"pins","label":"Pins","size":"m"},{"checked":true,"description":"Grow with the date range","id":"halos","label":"Uncertainty halos","size":"m"}]}}],"label":"Panel · Layers tab","props":{"bodyId":"panel-layers","label":"Layers and filters","selected":"layers","tabs":[{"controls":"panel-layers","label":"Layers","value":"layers"},{"controls":"panel-layers","count":1,"label":"Filters","value":"filters"}]},"slots":{"end":{"control":"Legend","props":{}}}},{"children":[{"control":"FilterFields","handlers":["onBranchChange","onEventToggle","onPersonChange","onSurnamesChange"],"props":{"branch":"","branches":[{"label":"Everyone","value":""},{"label":"Ancestors of…","value":"ancestors"},{"label":"Descendants of…","value":"descendants"}],"events":["birth","baptism","residence","marriage","divorce","death","burial","land","occupation","other"],"eventTypes":[{"glyph":"birth","label":"Birth","value":"birth"},{"glyph":"baptism","label":"Baptism","value":"baptism"},{"glyph":"residence","label":"Residence","value":"residence"},{"glyph":"marriage","label":"Marriage","value":"marriage"},{"glyph":"divorce","label":"Divorce","value":"divorce"},{"glyph":"death","label":"Death","value":"death"},{"glyph":"burial","label":"Burial","value":"burial"},{"glyph":"land","label":"Land","value":"land"},{"glyph":"occupation","label":"Occupation","value":"occupation"},{"glyph":"other","label":"Other","value":"other"}],"people":[{"label":"Anyone","value":""}],"person":"","surnames":["Rossouw"],"surnameHelper":"Matches spelling variants too (Rossouw, Rossau)"}}],"label":"Panel · Filters tab","props":{"bodyId":"panel-filters","gap":20,"label":"Layers and filters","selected":"filters","tabs":[{"controls":"panel-filters","label":"Layers","value":"layers"},{"controls":"panel-filters","count":1,"label":"Filters","value":"filters"}]},"slots":{"end":{"children":"Clear filters","control":"Button","props":{}}}}];
  var give = function (props, names) {
    names.forEach(function (name) {
      var at = name.indexOf('.');
      if (at < 0) { props[name] = noop; return; }
      var list = name.slice(0, at);
      var key = name.slice(at + 1);
      props[list] = props[list].map(function (item) {
        var copy = Object.assign({}, item);
        copy[key] = noop;
        return copy;
      });
    });
  };
  var make = function (slot, key) {
    var props = Object.assign({ key: key }, slot.props);
    give(props, slot.handlers || []);
    var part = window.KinScape[slot.control];
    return slot.children === undefined ? h(part, props) : h(part, props, slot.children);
  };
  var items = states.map(function (state, index) {
    var props = Object.assign({ key: index }, state.props);
    give(props, handlers);
    Object.keys(state.slots || {}).forEach(function (name) { props[name] = make(state.slots[name], name); });
    var children = Array.isArray(state.children) ? state.children.map(make) : state.children;
    var control = children === undefined ? h(Control, props) : h(Control, props, children);
    return h('figure', { className: 'ks-case', key: index }, h('figcaption', { className: 'small ks-label', id: 'ks-case-' + index }, state.label), control);
  });
  ReactDOM.flushSync(function () {
    ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, items));
  });
})();
</script>
</body>
</html>
