<div id="root"></div>
<script>
(function () {
  var h = React.createElement;
  var noop = function () {};
  var Control = window.KinScape["TextField"];
  var handlers = [];
  var states = [{"label":"TextField · default","props":{"disabled":false,"helper":"Helper text","label":"Name"}},{"label":"TextField · active","props":{"disabled":false,"helper":"Helper text","label":"Name","state":"active"}},{"label":"TextField · focus","props":{"disabled":false,"helper":"Helper text","label":"Name","state":"focus"}},{"label":"TextField · hover","props":{"disabled":false,"helper":"Helper text","label":"Name","state":"hover"}},{"label":"TextField · disabled","props":{"disabled":true,"helper":"Helper text","label":"Name"}},{"label":"TextField · error","props":{"error":"Enter a name.","label":"Name"}},{"label":"TextField · warning","props":{"label":"Name","mark":"warning"}},{"label":"TextField · search","props":{"label":"Search","shortcut":"/","type":"search"}},{"label":"TextField · password","props":{"label":"Password","type":"password"}}];
  var items = states.map(function (state, index) {

  });
})();
</script>
