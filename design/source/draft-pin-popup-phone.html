<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KinScape — Draft, Pin popup, phone</title>
    <link rel="stylesheet" href="fonts.css" />

    <style>
      body{margin:0}
    </style>
  </head>
  <body>
    <div
      style="width: 390px; height: 360px; position: relative; overflow: hidden; box-sizing: border-box; background: #f4f5f0; font-family: 'Public Sans', system-ui, sans-serif; color: #18211b">
      <div style="padding: 24px 16px 0">
        <span
          class="_overline_1ler9_95"
          style='font-family: "Public Sans", system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; line-height: 16px; text-transform: uppercase; margin: 0px;'>
          Pin popup as a sheet on a phone
        </span>
      </div>
      <section
        aria-label="Pin details"
        style="position: absolute; left: 0; right: 0; bottom: 0; height: 296px; box-sizing: border-box; padding: 8px 16px 20px; background: #ffffff; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgb(24 33 27 / 0.16); display: flex; flex-direction: column; gap: 12px">
        <span
          style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #c9cfc5"></span>
        <div
          style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span
              style="display: flex; align-items: center; gap: 8px; color: #9a3b12; font-size: 16px">
              <svg
                aria-hidden="true"
                class="_glyph_1o8ve_1"
                data-event="residence"
                fill="currentColor"
                viewBox="0 0 24 24"
                style="color: rgb(154, 59, 18); vertical-align: -2px; flex: 0 0 auto; width: 16px; height: 16px; display: inline-block;">
                <path d="M6 18V6H18V18Z"></path>
              </svg>
              <span
                class="_overline_1ler9_95"
                style='font-family: "Public Sans", system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; line-height: 16px; text-transform: uppercase; margin: 0px;'>
                Residence
              </span>
            </span>
            <span
              class="_h3_1ler9_30"
              style='font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 700; letter-spacing: normal; line-height: 28px; margin: 0px;'>
              Example Person
            </span>
          </div>
          <div style="margin: -8px -8px 0px 0px;">
            <button
              aria-label="Close"
              class="_iconBtn_5950n_1 _ring_17j5c_3"
              type="button"
              style="background: rgb(255, 255, 255); border: 1px solid rgb(226, 229, 221); border-radius: 8px; box-sizing: border-box; color: rgb(24, 33, 27); cursor: pointer; height: 44px; width: 44px; justify-content: center; align-items: center; padding: 0px; display: inline-flex; position: relative;">
              <svg
                aria-hidden="true"
                data-icon="close"
                fill="none"
                height="20"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                viewBox="0 0 24 24"
                width="20">
                <path d="M6 6l12 12M18 6L6 18"></path>
              </svg>
            </button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span
            class="_title_1ler9_39"
            style='font-family: "Public Sans", system-ui, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: normal; line-height: 22px; margin: 0px;'>
            From 1890 to 1905
          </span>
          <span
            class="_mono_1ler9_124"
            style='font-family: "JetBrains Mono", monospace; font-size: 12px; font-variant-ligatures: none; font-weight: 400; letter-spacing: normal; line-height: 16px; margin: 0px;'>
            FROM 1890 TO 1905
          </span>
        </div>
        <div
          style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 8px; background: #f4f5f0">
          <span
            class="_overline_1ler9_95"
            style='font-family: "Public Sans", system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.1px; line-height: 16px; text-transform: uppercase; margin: 0px;'>
            Address as recorded
          </span>
          <span
            class="_body_1ler9_48"
            style='font-family: "Public Sans", system-ui, sans-serif; font-size: 15px; font-weight: 400; letter-spacing: normal; line-height: 22px; margin: 0px;'>
            Farm Example, district Example
          </span>
        </div>
        <p style="margin: auto 0 0; font-size: 12.5px; color: #4a544c">
          Look-up only on a phone. Add people and pins on a tablet or computer.
        </p>
      </section>
    </div>
  </body>
</html>
