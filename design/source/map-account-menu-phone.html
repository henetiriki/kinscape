<!doctype html>
<html lang="en">

                  href="#rvs-vaal"
                  startOffset="55%"

                </textPath>
              </text>
            </g>
            <g
              fill="#2E2C22"
              font-weight="600"

                ORANGE FREE STATE

            <text
              x="742"
              y="463"
              text-anchor="middle"
              fill="#6B3412"
              font-style="italic"
              font-size="7.9">
              contested · Orange River Colony
            </text>
            <g fill="#18211B" font-size="9.3" font-weight="500">
              <text x="680" y="511">Kimberley</text>
              <text x="738" y="534" text-anchor="end">Bloemfontein</text>
            </g>
            <circle
              cx="746"
              cy="517"
              r="2.4"
              fill="#18211B"
              stroke="#ffffff"
              stroke-width="1.2"></circle>

        <g style="display: inline">
          <circle
            cx="746"
            cy="517"
            r="30"
            fill="#9A3B12"

            filter="url(#haloS)"></circle>
          <circle
            cx="746"
            cy="517"
            r="5.4"
            fill="#9A3B12"
            fill-opacity="0.6"
            stroke="#ffffff"
            stroke-width="2.5"

          <path
            d="M670 487 L677 494 L670 501 L663 494 Z"
            fill="#9A3B12"
            stroke="#ffffff"
            stroke-width="2.5"
            vector-effect="non-scaling-stroke"
            stroke-linejoin="round"></path>
        </g>
      </svg>

      <div
        style="position: absolute; left: 16px; right: 16px; top: 16px; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 4px 0 12px; background: #FFFFFF; border-radius: 26px; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)">
        <img
          src="../../app/icon0.svg"
          alt="KinScape"
          style="width: 32px; height: 32px; border-radius: 8px; display: block" />
        <input
          type="search"
          aria-label="Search people and places"
          placeholder="Search people and places"
          style="flex: 1; min-width: 0; height: 44px; border: 0; font-size: 16px; color: #18211B; outline: none; background: transparent" />
        <button
          type="button"
          aria-label="Account menu"
          style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #264F29; color: #FFFFFF; font-weight: 600; font-size: 16px">
          L
        </button>
      </div>

      <button
        type="button"
        aria-label="Layers and filters"
        style="position: absolute; right: 16px; top: 80px; width: 48px; height: 48px; border-radius: 12px; border: 0; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M12 3l9 5-9 5-9-5 9-5z"></path>
          <path d="M3 13l9 5 9-5"></path>
        </svg>
      </button>

      <section
        aria-label="Map date"
        style="position: absolute; left: 0; right: 0; bottom: 0; height: 152px; box-sizing: border-box; padding: 8px 16px 20px; background: #FFFFFF; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(24,33,27,0.16); display: flex; flex-direction: column; gap: 12px">
        <button
          type="button"
          aria-label="Expand the sheet"
          style="align-self: center; width: 64px; height: 20px; margin-bottom: -4px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span
            style="width: 40px; height: 4px; border-radius: 2px; background: #C9CFC5"></span>
        </button>
        <div style="display: flex; align-items: center; gap: 6px">
          <button
            type="button"
            aria-label="Back one year"
            style="width: 44px; height: 44px; border: 1px solid #C9CFC5; border-radius: 8px; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
          </button>
          <span
            style="position: relative; flex: 1; min-width: 0; display: flex">
            <input
              aria-label="Map date"
              aria-invalid="false"
              aria-describedby="date-msg-phone"
              value="1901"
              readonly=""
              style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; text-align: center; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-variant-ligatures: none; font-size: 22px; font-weight: 500; color: #18211B; background: #FFFFFF; border: 1px solid #C9CFC5" />
          </span>
          <button
            type="button"
            aria-label="Forward one year"
            style="width: 44px; height: 44px; border: 1px solid #C9CFC5; border-radius: 8px; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
          <button
            type="button"
            aria-label="Play through time"
            style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #264F29; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: 4px">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true">
              <path d="M7 4.5v15l12.5-7.5z"></path>
            </svg>
          </button>
        </div>
        <p
          style="margin: 0; font-size: 13px; color: #4A544C; text-align: center">
          Tap the map to see what a place was part of in 1901.
        </p>
      </section>

      <div
        role="menu"
        aria-label="Account"
        style="position: absolute; right: 16px; top: 76px; width: 296px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(24,33,27,0.1), 0 10px 30px rgba(24,33,27,0.2); padding: 4px; box-sizing: border-box; display: flex; flex-direction: column">
        <div
          style="padding: 12px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12.5px; line-height: 18px; color: #4A544C">
            Signed in as
          </span>
          <span style="font-size: 14px; line-height: 20px; font-weight: 600">
            researcher@example.com
          </span>
        </div>
        <span
          style="height: 1px; background: #E2E5DD; margin: 0 8px 4px"></span>
        <button
          type="button"
          role="menuitem"
          style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 12px; border: 0; border-radius: 8px; background: #F4F5F0; color: #18211B; text-align: left">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="flex: none">
            <path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"></path>
          </svg>
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 14px; line-height: 20px; font-weight: 600">
              Export all data
            </span>
            <span style="font-size: 12.5px; line-height: 18px; color: #4A544C">
              JSON and GeoJSON
            </span>
          </span>
        </button>
        <button
          type="button"
          role="menuitem"
          style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 12px; border: 0; border-radius: 8px; background: transparent; color: #18211B; text-align: left; font-size: 14px; font-weight: 600">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="flex: none">
            <path d="M6 4h9l3 3v13H6z"></path>
            <path d="M9 11h6M9 15h6"></path>
          </svg>
          Sources and attributions
        </button>
        <span style="height: 1px; background: #E2E5DD; margin: 4px 8px"></span>
        <button
          type="button"
          role="menuitem"
          style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 12px; border: 0; border-radius: 8px; background: transparent; color: #18211B; text-align: left; font-size: 14px; font-weight: 600">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="flex: none">
            <path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"></path>
          </svg>
          Sign out
        </button>
        <span
          style="padding: 8px 12px; font-size: 12.5px; line-height: 18px; color: #4A544C">
          Last backup: today, 02:00
        </span>
      </div>
    </div>
  </body>
</html>
