<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KinScape — Map credits at 800px</title>
    <link rel="stylesheet" href="fonts.css" />

    <style>
      body{margin:0}
      a{color:#264F29}a:hover{color:#1D3E20}
      button{font:inherit}
      button:focus-visible{outline:2px solid #264F29;outline-offset:2px}
    </style>
  </head>
  <body>
    <div
      style="width: 800px; height: 120px; position: relative; overflow: hidden; background: #C9D5D2; font-family: 'Public Sans', system-ui, sans-serif; color: #18211B">
      <aside
        aria-hidden="true"
        style="position: absolute; left: 24px; bottom: 28px; width: 320px; height: 200px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.1)"></aside>
      <section
        aria-hidden="true"
        style="position: absolute; left: 368px; right: 24px; bottom: 28px; height: 176px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)"></section>

      <div
        style="position: absolute; left: 24px; bottom: 6px; box-sizing: border-box; width: 72px; height: 17px; padding: 0 4px; border: 1px solid #24302b; border-top: 0; background: rgb(255 255 255 / 0.6); font-size: 11px; line-height: 16px; color: #24302b; white-space: nowrap">
        100 km
      </div>

      <div
        style="position: absolute; right: 24px; bottom: 6px; display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16px; color: #24302b">
        <button
          type="button"
          aria-expanded="true"
          aria-controls="credits-text"
          style="display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; cursor: pointer">
          <svg
            aria-hidden="true"
            data-icon="info"
            fill="none"
            height="14"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            width="14">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v5.5M12 7.5v.01"></path>
          </svg>
          Credits
        </button>
        <span aria-hidden="true">·</span>
        <a href="#" style="color: #1D3E20">Attributions</a>
      </div>

      <div
        id="credits-text"
        style="position: absolute; right: 24px; bottom: 30px; width: 300px; box-sizing: border-box; padding: 10px 14px; background: #ffffff; border-radius: 12px; box-shadow: 0 1px 2px rgb(24 33 27 / 0.1), 0 10px 30px rgb(24 33 27 / 0.2); font-size: 11px; line-height: 16px; color: #24302b">
        Boundaries: KinScape data, sources per layer · Terrain: [DEM SOURCE] ·
        Coast &amp; rivers: [SOURCE]
      </div>
    </div>
  </body>
</html>
