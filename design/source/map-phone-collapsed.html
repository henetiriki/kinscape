      <div
        style="position: absolute; left: 16px; right: 16px; top: 16px; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 4px 0 12px; background: #FFFFFF; border-radius: 26px; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)">
        <img
          src="../../app/icon0.svg"
          alt="KinScape"
          style="width: 32px; height: 32px; border-radius: 8px; display: block" />
        <input
          type="search"
          aria-label="Search people and places"
          placeholder="Search people and places"
          style="flex: 1; min-width: 0; height: 44px; border: 0; font-size: 16px; line-height: 24px; color: #18211B; outline: none; background: transparent" />
        <button
          type="button"
          aria-label="Account menu"
          style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #264F29; color: #FFFFFF; font-weight: 600; font-size: 16px; line-height: 24px; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)">
          L
        </button>
      </div>

      <button
        type="button"
        aria-label="Layers and filters"
        style="position: absolute; right: 16px; top: 80px; width: 48px; height: 48px; border-radius: 12px; border: 0; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(24,33,27,0.08), 0 6px 20px rgba(24,33,27,0.12)">

          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"

          stroke-linejoin="round"

          <path d="M3 13l9 5 9-5"></path>
        </svg>
      </button>

      <section
        aria-label="Map date"
        style="position: absolute; left: 0; right: 0; bottom: 0; height: 152px; box-sizing: border-box; padding: 8px 16px 20px; background: #FFFFFF; border-radius: 18px 18px 0 0; box-shadow: 0 -6px 24px rgba(24,33,27,0.16); display: flex; flex-direction: column; gap: 12px">
        <button
          type="button"
          aria-label="Expand the sheet"
          style="align-self: center; width: 64px; height: 20px; margin-bottom: -4px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <span
            style="width: 40px; height: 4px; border-radius: 2px; background: #C9CFC5"></span>
        </button>
        <div style="display: flex; align-items: center; gap: 6px">
          <button
            type="button"
            aria-label="Back one year"
            style="width: 44px; height: 44px; border: 1px solid #C9CFC5; border-radius: 8px; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
          </button>
          <input
            aria-label="Map date"
            value="1901"
            readonly=""
            style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; text-align: center; border: 1px solid #C9CFC5; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: #18211B" />
          <button
            type="button"
            aria-label="Forward one year"
            style="width: 44px; height: 44px; border: 1px solid #C9CFC5; border-radius: 8px; background: #FFFFFF; color: #18211B; display: flex; align-items: center; justify-content: center">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true">
              <path d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
          <button
            type="button"
            aria-label="Play through time"
            style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #264F29; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-left: 4px">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true">
              <path d="M7 4.5v15l12.5-7.5z"></path>
            </svg>
          </button>
        </div>
        <p
          style="margin: 0; font-size: 13px; color: #4A544C; text-align: center">
          Tap the map to see what a place was part of in 1901.
        </p>
