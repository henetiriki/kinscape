<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KinScape — Sign in (phone)</title>
    <link rel="stylesheet" href="fonts.css" />

    <style>
      body{margin:0}
      a{color:#264F29}a:hover{color:#1D3E20}
    </style>
  </head>
  <body>
    <div
      style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Public Sans', system-ui, sans-serif; color: #18211B; background: #FFFFFF">

        style="position: relative; height: 188px; flex: none; background: #C9D5D2; overflow: hidden">
        <svg
          viewBox="200 90 960 790"
          preserveAspectRatio="xMidYMid slice"
          style="position: absolute; inset: 0; width: 100%; height: 100%"
          aria-hidden="true">
          <path
            d="M63 0 L89 60 L126 114 L131 147 L136 210 L150 270 L163 348 L165 369 L173 408 L194 444 L220 474 L234 488 L256 525 L268 564 L278 594 L299 630 L318 666 L331 696 L328 726 L312 735 L315 753 L325 774 L339 804 L333 816 L340 831 L347 814 L360 816 L359 833 L381 835 L399 847 L420 860 L446 837 L478 834 L504 833 L532 821 L557 812 L580 815 L598 813 L640 817 L674 822 L682 809 L714 808 L722 798 L761 795 L782 786 L814 765 L835 751 L866 726 L892 699 L921 668 L945 645 L955 635 L969 614 L987 582 L999 562 L1018 534 L1037 507 L1052 498 L1071 473 L1082 426 L1097 382 L1098 348 L1082 328 L1102 294 L1144 270 L1197 246 L1228 210 L1234 150 L1228 96 L1218 54 L1202 0 L1202 -90 L63 -90 Z"
            fill="#E9EBE2"></path>
          <g
            fill="none"
            stroke="#6E99A3"
            stroke-width="1.2"
            vector-effect="non-scaling-stroke"
            stroke-linejoin="round">
            <path
              d="M887 516 L877 546 L861 576 L835 600 L798 603 L772 611 L733 600 L706 608 L665 575 L634 547 L625 514 L598 534 L564 550 L525 504 L486 477 L438 486 L420 474 L399 486 L368 507 L325 504 L283 495 L234 488"></path>
            <path
              d="M950 369 L929 381 L905 387 L872 378 L836 370 L808 381 L770 389 L714 429 L691 445 L662 483 L625 514"></path>
            <path
              d="M756 255 L788 216 L824 174 L856 126 L892 102 L940 99 L1013 115 L1061 150 L1082 198 L1108 240 L1133 282"></path>
          </g>
          <g
            fill="none"
            stroke="#3B3A2F"
            stroke-opacity="0.42"
            stroke-width="1"
            vector-effect="non-scaling-stroke"
            stroke-linejoin="round">
            <path
              d="M634 547 L684 500 L694 472 L691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L900 450 L890 486 L872 484 L840 501 L811 531 L790 552 L788 582 L798 603 L772 611 L733 600 L706 608 L665 575 Z"></path>
            <path
              d="M691 445 L714 429 L770 389 L808 381 L836 370 L872 378 L905 387 L911 408 L935 438 L961 456 L987 447 L1005 402 L990 378 L987 354 L998 324 L1018 313 L1048 327 L1049 294 L1047 240 L1026 180 L1013 115 L940 99 L892 102 L856 126 L824 174 L788 216 L756 255 L714 312 L703 366 L690 414 Z"></path>
            <path
              d="M790 552 L811 531 L840 501 L872 484 L898 504 L916 534 L903 567 L877 594 L840 611 L808 600 L788 582 Z"></path>
            <path
              d="M911 408 L935 438 L961 456 L987 447 L1005 402 L1024 408 L1050 408 L1057 381 L1097 382 M955 635 L924 594 L903 567"></path>
          </g>
          <rect
            x="631"
            y="684"
            width="18"
            height="18"
            rx="2.5"
            fill="#9A3B12"
            stroke="#ffffff"
            stroke-width="2.5"
            vector-effect="non-scaling-stroke"></rect>
        </svg>
        <div
          style="position: absolute; left: 20px; top: 20px; display: flex; align-items: center; gap: 10px">
          <img
            src="../../app/icon0.svg"
            alt=""
            style="width: 36px; height: 36px; border-radius: 9px; display: block" />
          <span
            style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; color: #18211B"
            >KinScape</span
          >
        </div>
      </div>

      <form
        style="flex: 1; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1
            style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 28px; letter-spacing: -0.015em">
            Sign in
          </h1>
          <p
            style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A544C">
            Your tree is private. Sign in to open the map.
          </p>
        </div>

        <div
          role="alert"
          style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; background: #FBEDEA; border: 1px solid #E7B9B0; color: #7E2316; font-size: 14px; line-height: 1.45">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
            style="flex: none; margin-top: 1px">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7.5v5.5M12 16.5v.01"></path>
          </svg>
          <span
            >That email and password don't match. Check them and try
            again.</span
          >
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pemail" style="font-size: 14px; font-weight: 600"
            >Email</label
          >
          <input
            id="pemail"
            type="email"
            value="researcher@example.com"
            aria-invalid="true"
            style="height: 48px; padding: 0 14px; border: 1.5px solid #B4412F; border-radius: 8px; font: inherit; font-size: 16px; color: #18211B; box-sizing: border-box" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ppass" style="font-size: 14px; font-weight: 600"
            >Password</label
          >
          <input
            id="ppass"
            type="password"
            value=""
            aria-invalid="true"
            aria-describedby="phint"
            style="height: 48px; padding: 0 14px; border: 1.5px solid #B4412F; border-radius: 8px; font: inherit; font-size: 16px; box-sizing: border-box" />
          <span id="phint" style="font-size: 13px; color: #4A544C"
            >Password cleared after a failed attempt.</span
          >
        </div>

        <button
          type="submit"
          style="height: 50px; border: 0; border-radius: 8px; background: #264F29; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; margin-top: 4px">
          Sign in
        </button>

        <button
          type="button"
          style="height: 50px; border: 1px solid #747775; border-radius: 8px; background: #FFFFFF; color: #1F1F1F; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 12px">
          <span
            aria-hidden="true"
            style="width: 20px; height: 20px; box-sizing: border-box; border: 1px dashed #747775; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #5F6368"
            >G</span
          >
          Continue with Google
        </button>

        <p
          style="margin: auto 0 0; font-size: 13px; line-height: 1.5; color: #4A544C">
          There's no sign-up. Accounts are set up by whoever runs this KinScape.
        </p>
      </form>
    </div>
  </body>
</html>
